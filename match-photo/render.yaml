services:
  - type: web
    name: sagi-match-photo
    runtime: node
    rootDir: match-photo
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
      - key: PAYMENT_MODE
        value: manual
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: match-photo-data
      mountPath: /var/data
      sizeGB: 10
