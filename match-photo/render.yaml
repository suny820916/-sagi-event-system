services:
  - type: web
    name: sagi-match-photo
    runtime: node
    rootDir: match-photo
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY
        generateValue: true
      - key: PUBLIC_TITLE
        value: SAGI MATCH PHOTO
      - key: ALLOWED_ORIGINS
        value: https://sagisports.cn,https://www.sagisports.cn,https://suny820916.github.io
    disk:
      name: match-photo-data
      mountPath: /var/data
      sizeGB: 10
