<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#090909"/>
  <title>SAGI MATCH PHOTO</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <header class="top">
    <div class="brand"><b>SAGI</b><i></i><span>MATCH PHOTO</span></div>
    <button id="adminBtn" class="ghost">管理</button>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">找到你的高光时刻</div>
      <h1>比赛结束，<br/>精彩不会结束。</h1>
      <p>带水印免费预览 · 付款后下载高清原图</p>
      <div class="price-row">
        <span>单张 ¥5</span><span>5张 ¥15</span><span>个人包 ¥29</span><span>全队 ¥99</span>
      </div>
    </section>

    <section class="filters card">
      <select id="eventSelect"><option value="">全部赛事</option></select>
      <input id="teamInput" placeholder="球队名称"/>
      <input id="jerseyInput" inputmode="numeric" placeholder="球衣号码"/>
      <button id="searchBtn" class="primary">找照片</button>
    </section>

    <section class="findme card">
      <div><strong>AI 找我</strong><small>上传一张自拍，自动找比赛中的你</small></div>
      <label class="upload-lite">选择自拍<input id="selfieInput" type="file" accept="image/*" capture="user"/></label>
    </section>

    <section class="gallery-head">
      <div><b>比赛照片</b><span id="count">0 张</span></div>
      <button id="clearBtn" class="ghost">清空选择</button>
    </section>
    <section id="gallery" class="gallery"></section>
    <div id="empty" class="empty">还没有照片。管理员上传后会自动出现在这里。</div>
  </main>

  <div id="cart" class="cart hidden">
    <div><b><span id="selectedCount">0</span> 张</b><small id="quoteText">¥0</small></div>
    <button id="checkoutBtn" class="primary">立即购买</button>
  </div>

  <dialog id="checkoutDialog">
    <form method="dialog" class="sheet">
      <button class="x">×</button>
      <h2>确认订单</h2>
      <div id="checkoutSummary" class="summary"></div>
      <input id="nickname" placeholder="你的称呼（可选）"/>
      <input id="contact" placeholder="微信号/手机号（可选）"/>
      <button id="createOrderBtn" type="button" class="primary full">生成付款订单</button>
      <div id="orderResult"></div>
    </form>
  </dialog>

  <dialog id="adminDialog">
    <form method="dialog" class="sheet admin">
      <button class="x">×</button>
      <h2>SAGI PHOTO 管理端</h2>
      <label>管理员密钥<input id="adminKey" type="password" autocomplete="current-password"/></label>
      <div class="admin-grid">
        <section>
          <h3>1. 创建赛事</h3>
          <input id="eventName" placeholder="如：托朗戈杯总决赛"/>
          <div class="row"><input id="eventCity" placeholder="城市"/><input id="eventDate" type="date"/></div>
          <button id="createEventBtn" type="button" class="primary full">创建赛事</button>
        </section>
        <section>
          <h3>2. 批量上传比赛照片</h3>
          <select id="adminEventSelect"><option value="">选择赛事</option></select>
          <input id="uploadTeam" placeholder="球队"/>
          <input id="uploadMatch" placeholder="场次，如 A队 vs B队"/>
          <div class="row"><input id="uploadJersey" placeholder="号码（可空）"/><input id="uploadPlayer" placeholder="球员名（可空）"/></div>
          <label class="upload-zone">选择比赛照片（一次最多40张）<input id="photoFiles" type="file" accept="image/*" multiple/></label>
          <button id="uploadBtn" type="button" class="primary full">上传并生成水印预览</button>
          <progress id="uploadProgress" max="100" value="0"></progress>
        </section>
        <section>
          <h3>3. 待确认付款</h3>
          <button id="refreshOrdersBtn" type="button" class="ghost full">刷新订单</button>
          <div id="orders"></div>
        </section>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
