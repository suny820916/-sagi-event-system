<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGI 转播包装预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a111f;color:#f7fbff;font:600 18px "Microsoft YaHei",sans-serif}
main{position:relative;overflow:hidden;aspect-ratio:16/9;background:radial-gradient(ellipse at 62% 80%,#1d6556,#0a172c 75%);container-type:inline-size}
.field{position:absolute;inset:23% 10% 11%;border:.17cqw solid #b0ffdf25;transform:perspective(90cqw) rotateX(24deg)}
.field:before{content:"";position:absolute;top:50%;width:100%;border-top:.17cqw solid #b0ffdf25}.field:after{content:"";position:absolute;top:50%;left:50%;width:13%;aspect-ratio:1;border:.17cqw solid #b0ffdf25;border-radius:50%;transform:translate(-50%,-50%)}
.bug{position:absolute;top:6%;left:5%;display:flex;align-items:stretch;height:4.25cqw;font-size:1.65cqw;font-weight:800;line-height:4.25cqw;background:#10182e;border-left:.5cqw solid #51efda}
.bug span{padding:0 .85cqw}.bug .home{background:#1263c9}.bug .away{background:#aa421c}.clock{color:#51efda;min-width:6.4cqw;font-variant-numeric:tabular-nums}.score{min-width:5.8cqw;text-align:center;font-variant-numeric:tabular-nums}
.score.bump{animation:bump .72s ease-out}@keyframes bump{40%{transform:scale(1.17);background:#51efda;color:#081426}}
.event{position:absolute;left:5%;bottom:11%;min-width:35%;padding:1.35cqw 2cqw;background:#10182e;border-left:.55cqw solid var(--accent);animation:enter .46s cubic-bezier(.17,.75,.25,1)}
.event b{display:block;color:var(--accent);font-size:2.65cqw}.event span{font-size:1.55cqw}
@keyframes enter{from{opacity:0;transform:translateX(-3.5cqw)}to{opacity:1;transform:none}}
.pen{position:absolute;left:14%;right:14%;bottom:10%;background:#10182e;border-top:.45cqw solid #51efda;padding:1.15cqw 1.65cqw;animation:enter .46s ease-out}
.pen h2{font-size:1.65cqw;margin:0 0 .6cqw;color:#51efda}.row{display:grid;grid-template-columns:13cqw 4cqw 1fr;align-items:center;min-height:3.2cqw;font-size:1.45cqw}.row strong{font-variant-numeric:tabular-nums;font-size:2.2cqw}.dots{display:flex;gap:.75cqw}.dot{width:1.65cqw;height:1.65cqw;border-radius:50%;text-align:center;line-height:1.55cqw;border:.11cqw solid #8e9db8;color:#081426;font-size:1.1cqw}.hit{background:#51efac}.miss{background:#ff727d}.next{border:.22cqw solid #51efda}.note{position:absolute;right:5%;top:6%;font-size:1.1cqw;color:#d1dfef}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button{background:#172844;color:#fff;border:1px solid #52749a;padding:8px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#51efda;color:#51efda}[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.bug .brand{width:4.25cqw;padding:.72cqw;display:grid;place-items:center;background:#131d33}
.brand img{width:100%;height:100%;object-fit:contain}
.bug .score-cell{position:relative;padding:0;min-width:7.1cqw;text-align:center}
.bug .score{display:block;padding:0}
.bug .goal-word{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:.07cqw;padding:0;background:#51efda;color:#081426;overflow:hidden}
.bug .goal-word i{font-style:normal;font-size:1.62cqw;animation:goal-letter .48s cubic-bezier(.15,.8,.25,1) both;animation-delay:calc(var(--i)*75ms)}
@keyframes goal-letter{0%{opacity:0;transform:translateY(1.5cqw) scale(.65)}70%{opacity:1;transform:translateY(-.12cqw) scale(1.14)}100%{opacity:1;transform:none}}

/* Keep the brand tile visible and expand the goal sting over the score row. */
.bug .goal-word{left:auto;right:auto;width:21cqw;height:5.45cqw;top:-.6cqw;transform:translateX(-6cqw);gap:.35cqw;z-index:2;box-shadow:0 .4cqw 1cqw #08142655}
.bug .goal-word img{width:4.4cqw;height:4.4cqw;object-fit:contain;margin-right:.3cqw}
.bug .goal-word i{font-size:3.25cqw;font-weight:900;line-height:1}

.bug .goal-word.away-goal{background:#ff934f;transform:translateX(-2.6cqw)}
.bug .goal-word.away-goal img{order:5;margin-left:.3cqw;margin-right:0}
.bug .goal-word{clip-path:inset(0);animation:goal-sweep 1.25s ease-out both}
@keyframes goal-sweep{0%{clip-path:inset(0 100% 0 0)}16%,86%{clip-path:inset(0)}100%{clip-path:inset(0 0 0 100%)}}
</style>

let goalTimer;
function show(key){
 clearTimeout(goalTimer);goalWord.hidden=true;
 const [clock,result,title,detail,accent]=scenes[key];
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===key)));
 document.querySelector('#clock').textContent=clock;score.textContent=result;
 score.classList.remove('bump');
 if((key==='goal'||key==='awayGoal')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const away=key==='awayGoal';
  goalCrest.src=away?awayCrest:homeCrest;goalCrest.alt=away?'北岸竞技队徽':'海城联队队徽';
  goalWord.classList.toggle('away-goal',away);
  void goalWord.offsetWidth;goalWord.hidden=false;
  goalTimer=setTimeout(()=>{goalWord.hidden=true;score.classList.add('bump');},1250);
 }
 eventCard.hidden=true;pen.hidden=true;
 if(title){eventCard.querySelector('b').textContent=title;eventCard.querySelector('span').textContent=detail;eventCard.style.setProperty('--accent',accent);void eventCard.offsetWidth;eventCard.hidden=false;}
 if(key==='penalty'){drawPenalty();pen.hidden=false;}
}
buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.scene)));show('kickoff');
</script></html>
