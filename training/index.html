<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><title>SAGI TRAINING</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:auto;max-width:600px;padding:20px}h1{font-size:28px}b{color:#ff4141}section{background:#222;padding:18px;margin:14px 0;border-radius:16px}label{display:block;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#181818;color:white;font:inherit}button{background:#eee;color:#111;font-weight:bold;margin-top:8px}li{margin:10px 0;overflow-wrap:anywhere}small{color:#bbb}</style><h1>SAGI<b>●</b> TRAINING</h1><p>足球运动员成长中心 · V1.0 原型</p><section><h2>足球大脑</h2><a style='color:white' href='iq.html'>进入动态中场决策训练 →</a></section><section><h2>球员档案</h2><form id="profile"><label>昵称<input name="name" required maxlength="40"></label><label>年龄段<select name="age"><option>U9</option><option>U11</option><option>U13</option><option>U15</option><option>U17</option><option>成人</option></select></label><label>位置<select name="position"><option>待定</option><option>门将</option><option>后卫</option><option>中场</option><option>前锋</option></select></label><button>保存档案</button></form></section><section><h2>训练记录</h2><form id="session"><label>日期<input type="date" name="date" required></label><label>项目<select name="type"><option>控球</option><option>传接球</option><option>射门</option><option>敏捷</option><option>体能</option></select></label><label>训练分钟<input name="minutes" type="number" min="1" max="300" required></label><label>主观强度（1轻松–10极重）<input name="rpe" type="number" min="1" max="10" required></label><button>记录训练</button></form><p id="summary"></p><ul id="history"></ul></section><section><h2>数据管理</h2><small>数据只保存在当前浏览器，清理浏览器可能丢失。请定期备份。未成年人请由监护人管理。</small><button id="export">导出备份</button><button id="clear">清空本机数据</button><p role="status" id="status"></p></section><script>
const key='sagi.training.v1', $=id=>document.getElementById(id);let state={profile:null,sessions:[]};try{const raw=localStorage.getItem(key);if(raw){const x=JSON.parse(raw);if(Array.isArray(x.sessions))state=x}}catch(e){$('status').textContent='读取失败，请检查浏览器存储。'}
function save(next){try{localStorage.setItem(key,JSON.stringify(next));state=next;$('status').textContent='已保存';render();return true}catch(e){$('status').textContent='保存失败，数据未写入';return false}}
function render(){const p=state.profile;if(p)for(const k of ['name','age','position'])$('profile').elements[k].value=p[k];$('summary').textContent='累计 '+state.sessions.length+' 次训练 · '+state.sessions.reduce((a,b)=>a+Number(b.minutes),0)+' 分钟';$('history').replaceChildren();for(const s of [...state.sessions].reverse()){let li=document.createElement('li');li.textContent=s.date+'｜'+s.type+'｜'+s.minutes+' 分钟｜强度 '+s.rpe;$('history').append(li)}}
$('profile').onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.name=p.name.trim();if(!p.name)return;save({...state,profile:p})};
$('session').elements.date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
$('session').onsubmit=e=>{e.preventDefault();if(!state.profile){$('status').textContent='请先保存球员档案';return}const s=Object.fromEntries(new FormData(e.target));s.minutes=Number(s.minutes);s.rpe=Number(s.rpe);if(!Number.isInteger(s.minutes)||s.minutes<1||s.minutes>300||!Number.isInteger(s.rpe)||s.rpe<1||s.rpe>10)return;save({...state,sessions:[...state.sessions,s]})};
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='sagi-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('clear').onclick=()=>{if(confirm('确定清空本机全部训练数据？'))if(save({profile:null,sessions:[]}))$('profile').reset()};render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{const p=document.createElement('p');p.textContent='离线安装暂不可用，在线功能仍可使用。';document.body.append(p)});</script></html>
