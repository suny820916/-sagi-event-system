<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><title>SAGI TRAINING</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:auto;max-width:600px;padding:20px}h1{font-size:28px}b{color:#ff4141}section{background:#222;padding:18px;margin:14px 0;border-radius:16px}label{display:block;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#181818;color:white;font:inherit}button{background:#eee;color:#111;font-weight:bold;margin-top:8px}li{margin:10px 0;overflow-wrap:anywhere}small{color:#bbb}[hidden]{display:none!important}</style><h1>SAGI<b>●</b> TRAINING</h1><p>足球运动员成长中心 · V0.10 个人训练版</p><section><h2>足球大脑</h2><a style='color:white' href='iq.html'>进入动态中场决策训练 →</a></section><section><h2>28天足球大脑计划</h2><p id="day"></p><p id="daily"></p><p id="dailyProgress"></p><progress id="dailyBar" max="12" value="0" style="width:100%"></progress><button id="begin">开始28天计划</button><a style="color:white" href="iq.html">开始今日决策训练 →</a><p><small>每天约10分钟：观察、空间判断、决策、复盘。先准确再提速。</small></p></section><section><h2>球员档案</h2><form id="profile"><label>昵称<input name="name" required maxlength="40"></label><label>年龄段<select name="age"><option>U9</option><option>U11</option><option>U13</option><option>U15</option><option>U17</option><option>成人</option></select></label><label>位置<select name="position"><option>待定</option><option>门将</option><option>后卫</option><option>中场</option><option>前锋</option></select></label><button>保存档案</button></form></section><section><h2>训练记录</h2><form id="session"><label>日期<input type="date" name="date" required></label><label>项目<select name="type"><option>控球</option><option>传接球</option><option>射门</option><option>敏捷</option><option>体能</option></select></label><label>训练分钟<input name="minutes" type="number" min="1" max="300" required></label><label>主观强度（1轻松–10极重）<input name="rpe" type="number" min="1" max="10" required></label><button>记录训练</button></form><p id="summary"></p><ul id="history"></ul></section><section><h2>数据管理</h2><small>数据只保存在当前浏览器，清理浏览器可能丢失。请定期备份。未成年人请由监护人管理。</small><button id="export">导出备份</button><label>恢复训练中心与决策备份<input id="restore" type="file" accept=".json,application/json"></label><button id="clear">清空训练中心数据</button><p role="status" id="status"></p></section><script>
const key='sagi.training.v1', $=id=>document.getElementById(id);const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d+'T00:00:00Z').toISOString().slice(0,10)===d;const validProfile=p=>p===null||!!(p&&typeof p.name==='string'&&p.name.trim().length>0&&p.name.length<=40&&['U9','U11','U13','U15','U17','成人'].includes(p.age)&&['待定','门将','后卫','中场','前锋'].includes(p.position));const cleanProfile=p=>p?{name:p.name.trim(),age:p.age,position:p.position}:null;const cleanSession=s=>({date:s.date,type:s.type,minutes:s.minutes,rpe:s.rpe});const validSession=s=>s&&validDate(s.date)&&['控球','传接球','射门','敏捷','体能'].includes(s.type)&&Number.isInteger(s.minutes)&&s.minutes>=1&&s.minutes<=300&&Number.isInteger(s.rpe)&&s.rpe>=1&&s.rpe<=10;let state={profile:null,sessions:[]};try{const raw=localStorage.getItem(key);if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.sessions))state={profile:validProfile(x.profile)?cleanProfile(x.profile):null,planStart:validDate(x.planStart)?x.planStart:undefined,sessions:x.sessions.filter(validSession).map(cleanSession)}}}catch(e){$('status').textContent='读取失败，请检查浏览器存储。'}
function save(next){try{localStorage.setItem(key,JSON.stringify(next));state=next;$('status').textContent='已保存';render();return true}catch(e){$('status').textContent='保存失败，数据未写入';return false}}
function localDay(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function plan(){let start=state.planStart;const now=new Date();const day=start?Math.max(1,Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.parse(start+'T00:00:00Z'))/86400000)+1):0;$('day').textContent=day?'DAY '+Math.min(day,28)+' / 28'+(day>28?' · 周期结束':''):'尚未开始';$('daily').textContent=day?['不限时：接球前扫描与身体朝向','3秒：识别空当与接应角度','2秒：转换与风险判断','复测：准确优先，复盘错误'][Math.min(3,Math.floor((day-1)/7))]:'先建立不限时基线。';$('begin').hidden=!!start;let rows=[];try{rows=readIQ().filter(r=>r&&Number.isFinite(Date.parse(r.date))&&localDay(new Date(r.date))===localDay(now))}catch{}const unique=new Set(rows.filter(r=>Number.isInteger(r.scenario)&&r.scenario>=1&&r.scenario<=12).map(r=>r.scenario)).size;$('dailyBar').value=Math.min(12,unique);$('dailyProgress').textContent='今日情景练习：'+Math.min(12,unique)+' / 12 个不同情景（'+rows.length+' 次作答）'} 
$('begin').onclick=()=>{const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);save({...state,planStart:d})};
function render(){plan();const p=state.profile;if(p)for(const k of ['name','age','position'])$('profile').elements[k].value=p[k];$('summary').textContent='累计 '+state.sessions.length+' 次训练 · '+state.sessions.reduce((a,b)=>a+Number(b.minutes),0)+' 分钟';$('history').replaceChildren();for(const s of [...state.sessions].reverse()){let li=document.createElement('li');li.textContent=s.date+'｜'+s.type+'｜'+s.minutes+' 分钟｜强度 '+s.rpe;$('history').append(li)}}
$('profile').onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.name=p.name.trim();if(!validProfile(p)){$('status').textContent='档案无效，请检查昵称、年龄段和位置';return;}save({...state,profile:p})};
$('session').elements.date.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
$('session').onsubmit=e=>{e.preventDefault();if(!state.profile){$('status').textContent='请先保存球员档案';return}const s=Object.fromEntries(new FormData(e.target));s.minutes=Number(s.minutes);s.rpe=Number(s.rpe);if(!validSession(s)){$('status').textContent='训练记录无效，请检查日期与项目';return;}save({...state,sessions:[...state.sessions,s]})};
$('export').onclick=()=>{try{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({schema:1,training:state,iq:readIQ()},null,2)],{type:'application/json'}));a.href=u;a.download='sagi-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch{$('status').textContent='导出失败，请检查本地数据'}};
const iqAnswers=[1,2,0,1,0,2,1,0,2,0,0,1];
function validIQ(r){return !!(r&&Number.isInteger(r.scenario)&&r.scenario>=1&&r.scenario<=iqAnswers.length&&Number.isInteger(r.choice)&&r.choice>=-1&&r.choice<=2&&typeof r.preferred==='boolean'&&r.preferred===(r.choice===iqAnswers[r.scenario-1])&&typeof r.date==='string'&&Number.isFinite(Date.parse(r.date)))}
function cleanIQ(r){const x={scenario:r.scenario,choice:r.choice,preferred:r.preferred,date:r.date};if([0,1000,2000,3000].includes(r.limitMs))x.limitMs=r.limitMs;if(typeof r.seconds==='number'&&Number.isFinite(r.seconds)&&r.seconds>=0)x.seconds=r.seconds;if(typeof r.version==='string'&&/^\d+\.\d+$/.test(r.version))x.version=r.version;return x}
function readIQ(){const x=JSON.parse(localStorage.getItem('sagi.iq.records')||'[]');if(!Array.isArray(x))throw Error('bad IQ');return x.filter(validIQ).map(cleanIQ)}
function validBackup(x){if(!x||typeof x!=='object'||x.schema!==1)return false;const t=x.training;return !!(t&&Array.isArray(t.sessions)&&t.sessions.every(validSession)&&validProfile(t.profile??null)&&(t.planStart==null||validDate(t.planStart))&&Array.isArray(x.iq)&&x.iq.every(validIQ))}
$('restore').onchange=async()=>{try{const f=$('restore').files[0];if(!f)return;if(f.size>5000000)throw Error();const x=JSON.parse(await f.text());if(!validBackup(x))throw Error();if(!confirm('恢复将替换当前训练与决策记录，确定继续？'))return;const old=localStorage.getItem('sagi.iq.records');localStorage.setItem('sagi.iq.records',JSON.stringify(x.iq.map(cleanIQ)));if(!save({profile:cleanProfile(x.training.profile),sessions:x.training.sessions.map(cleanSession),planStart:x.training.planStart||undefined})){if(old===null)localStorage.removeItem('sagi.iq.records');else localStorage.setItem('sagi.iq.records',old);throw Error()}$('status').textContent='恢复成功'}catch{$('status').textContent='恢复失败，请检查备份文件与存储空间'}finally{$('restore').value=''}};
$('clear').onclick=()=>{if(confirm('确定清空训练中心数据？决策记录仍保留。'))if(save({profile:null,sessions:[]}))$('profile').reset()};render();window.addEventListener('pageshow',render);window.addEventListener('storage',e=>{if(e.key==='sagi.iq.records')plan()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{const p=document.createElement('p');p.textContent='离线安装暂不可用，在线功能仍可使用。';document.body.append(p)});</script></html>
