<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGI FOOTBALL IQ</title><style>body{background:#111;color:white;font:17px system-ui;max-width:560px;margin:auto;padding:20px}button{display:block;width:100%;padding:16px;margin:10px 0;border:1px solid #777;border-radius:12px;background:#252525;color:white;text-align:left;font:inherit}svg{width:100%;background:#193e32;border-radius:12px}a{color:white}small{color:#bbb}</style><h1>SAGI<span style="color:#f44">●</span> IQ</h1><p>中场决策训练 · 体验版 01</p><a href="index.html">返回训练中心</a><p id="progress"></p><svg viewBox="0 0 320 210" aria-label="战术示意图"><g fill="none" stroke="#b5d0ba"><rect x="10" y="10" width="300" height="190"/><path d="M160 10V200"/><circle cx="160" cy="105" r="32"/></g><g id="players"></g></svg><h2 id="question"></h2><div id="choices"></div><p id="feedback" role="status"></p><button id="next" hidden>下一题</button><small>示意情景仅提供一种优先判断，并非唯一正确战术。用时包含阅读时间，不代表真实比赛反应速度。</small><script>
const q=[{t:'接球前，身后有对手逼近，右侧队友无人盯防。你优先做什么？',p:[[100,105,'你'],[130,105,'对手'],[185,165,'队友'],[45,105,'来球']],a:['接球后再抬头','提前观察右肩，侧身接球','直接转身带球'],c:1,f:'提前扫描能让你在接球前确认压力和出口。若来球质量不好，安全回传也是选择。'},{t:'中路被两人封堵，边路队友有空间。此时球队需要保持球权。',p:[[100,105,'你'],[145,85,'对手'],[145,125,'对手'],[180,35,'队友']],a:['强行直塞中路','盲目长传','转移至空闲边路'],c:2,f:'在没有清晰穿透线路时，转移可以迫使防线移动。先确认边路接球者不会立即被围抢。'},{t:'反击中前锋前方有空当，但传球路线被对手挡住。',p:[[80,105,'你'],[150,105,'对手'],[240,105,'前锋'],[120,167,'队友']],a:['借侧面队友形成第三人配合','马上沿被封堵路线直传','低头等待'],c:0,f:'有条件时借第三人改变传球角度；若时间窗口已关闭，应重新组织。'}];
const $=x=>document.getElementById(x);let i=0,start=0,locked=false,records=[];try{records=JSON.parse(localStorage.getItem('sagi.iq.records')||'[]');if(!Array.isArray(records))records=[]}catch{}
function show(){locked=false;const s=q[i];$('progress').textContent='第 '+(i+1)+' / '+q.length+' 题｜累计记录 '+records.length+' 次';$('question').textContent=s.t;$('players').innerHTML=s.p.map(([x,y,n])=>'<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+(n==='对手'?'#f66':n==='来球'?'white':'#6cf')+'"/><text x="'+x+'" y="'+(y-13)+'" fill="white" font-size="12" text-anchor="middle">'+n+'</text>').join('');$('choices').replaceChildren();$('feedback').textContent='';$('next').hidden=true;s.a.forEach((a,j)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(j);$('choices').append(b)});start=performance.now()}
function answer(j){if(locked)return;locked=true;const s=q[i],ok=j===s.c;records.push({scenario:i+1,choice:j,preferred:ok,seconds:Math.round((performance.now()-start)/100)/10,date:new Date().toISOString()});let err='';try{localStorage.setItem('sagi.iq.records',JSON.stringify(records))}catch{err=' 本次未能保存。'}$('feedback').textContent=(ok?'符合本题优先判断。':'还有更合适的优先选择。')+s.f+err;for(const b of $('choices').children)b.disabled=true;$('next').hidden=false;$('next').textContent=i===q.length-1?'重新练习':'下一题'}
$('next').onclick=()=>{i=(i+1)%q.length;show()};show();
</script></html>
