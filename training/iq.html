<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGI FOOTBALL IQ</title><style>body{background:#111;color:white;font:17px system-ui;max-width:560px;margin:auto;padding:20px}button{display:block;width:100%;padding:16px;margin:10px 0;border:1px solid #777;border-radius:12px;background:#252525;color:white;text-align:left;font:inherit}svg{width:100%;background:#193e32;border-radius:12px}a{color:white}small{color:#bbb}[hidden]{display:none!important}select{background:#252525;color:white;padding:10px;font:inherit}</style><h1>SAGI<span style="color:#f44">●</span> IQ</h1><p>中场决策训练 · 体验版 05</p><a href="index.html">返回训练中心</a><label>决策难度 <select id="difficulty"><option value="0">不限时</option><option value="3000">3秒</option><option value="2000">2秒</option><option value="1000">1秒</option></select></label><p id="clock" aria-live="off"></p><p id="progress"></p><svg viewBox="0 0 320 210" aria-label="战术示意图"><g fill="none" stroke="#b5d0ba"><rect x="10" y="10" width="300" height="190"/><path d="M160 10V200"/><circle cx="160" cy="105" r="32"/></g><g id="players"></g></svg><h2 id="question"></h2><button id="replay">播放情景</button><div id="choices"></div><p id="feedback" role="status"></p><button id="next" hidden>下一题</button><section><h2>我的训练报告</h2><p id="report"></p><button id="download">导出决策记录</button></section><small>跑动为简化示意，不是真实比赛模拟。示意情景仅提供一种优先判断，并非唯一正确战术。用时包含阅读时间，不代表真实比赛反应速度。</small><script>
const q=[{t:'接球前，身后有对手逼近，右侧队友无人盯防。你优先做什么？',p:[[100,105,'你'],[130,105,'对手'],[185,165,'队友'],[45,105,'来球']],a:['接球后再抬头','提前观察右肩，侧身接球','直接转身带球'],c:1,f:'提前扫描能让你在接球前确认压力和出口。若来球质量不好，安全回传也是选择。'},{t:'中路被两人封堵，边路队友有空间。此时球队需要保持球权。',p:[[100,105,'你'],[145,85,'对手'],[145,125,'对手'],[180,35,'队友']],a:['强行直塞中路','盲目长传','转移至空闲边路'],c:2,f:'在没有清晰穿透线路时，转移可以迫使防线移动。先确认边路接球者不会立即被围抢。'},{t:'反击中前锋前方有空当，但传球路线被对手挡住。',p:[[80,105,'你'],[150,105,'对手'],[240,105,'前锋'],[120,167,'队友']],a:['借侧面队友形成第三人配合','马上沿被封堵路线直传','低头等待'],c:0,f:'有条件时借第三人改变传球角度；若时间窗口已关闭，应重新组织。'}];
q.push(...[{"t":"领先一球，最后阶段，对手逼抢，你有安全回传线路。","p":[[100,105,"你"],[135,105,"对手"],[50,155,"队友"]],"a":["冒险直塞","回传并重新组织","原地等待"],"c":1,"f":"结合比分与时间，优先控制失误风险；有明确反击机会时仍可向前。"},{"t":"队友持球被逼向边线，你无球时怎样提供接应？","p":[[105,65,"你"],[65,30,"队友"],[100,35,"对手"]],"a":["移动到斜后方可见的传球线路","贴近持球队友","站在对手身后"],"c":0,"f":"斜向接应创造不同传球角度，同时保留下一脚出球空间。"},{"t":"刚刚夺回球权，对手阵型尚未恢复，前方有清晰传球线路。","p":[[85,105,"你"],[140,160,"对手"],[230,70,"队友"]],"a":["无条件回传","等待对手落位","确认线路后快速向前传球"],"c":2,"f":"转换窗口短暂，先观察接球者和防守覆盖，再决定是否加速。"}]);
const $=x=>document.getElementById(x);let i=0,start=0,locked=false,records=[],frame=0,ready=false;try{records=JSON.parse(localStorage.getItem('sagi.iq.records')||'[]');if(!Array.isArray(records))records=[]}catch{}
let roundCorrect=0,roundAnswered=0,timer=0,limit=0,order=[];function report(){const rows=records.filter(x=>x&&x.version==='0.4'||x&&x.version==='0.5');const groups=[0,3000,2000,1000].map(ms=>{const a=rows.filter(x=>x.limitMs===ms),n=a.length,ok=a.filter(x=>x.preferred).length,timeout=a.filter(x=>x.choice===-1).length;return (ms?ms/1000+'秒':'不限时')+'：'+n+'题，符合优先判断 '+ok+'，超时 '+timeout});$('report').textContent=groups.join(' ｜ ')}function show(){report();clearInterval(timer);cancelAnimationFrame(frame);locked=false;ready=false;const s=q[i];$('progress').textContent='第 '+(i+1)+' / '+q.length+' 题｜累计记录 '+records.length+' 次｜本轮 '+roundCorrect+' / '+roundAnswered;$('question').textContent=s.t;$('players').innerHTML=s.p.map(([x,y,n])=>'<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+(n==='对手'?'#f66':n==='来球'?'white':'#6cf')+'"/><text x="'+x+'" y="'+(y-13)+'" fill="white" font-size="12" text-anchor="middle">'+n+'</text>').join('');$('choices').replaceChildren();$('feedback').textContent='';$('next').hidden=true;order=s.a.map((a,j)=>j);for(let k=order.length-1;k>0;k--){const n=Math.floor(Math.random()*(k+1));[order[k],order[n]]=[order[n],order[k]]}order.forEach(j=>{const a=s.a[j];const b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(j);$('choices').append(b)});$('replay').hidden=false; play()}
function answer(j){if(locked||!ready)return;if(j!==-1&&limit&&performance.now()-start>=limit)j=-1;clearInterval(timer);locked=true;$('clock').textContent=j===-1?'时间到':'';$('replay').hidden=true;const s=q[i],ok=j===s.c;roundAnswered++;if(ok)roundCorrect++;records.push({scenario:i+1,choice:j,preferred:ok,limitMs:limit,version:'0.5',seconds:Math.round((performance.now()-start)/100)/10,date:new Date().toISOString()});report();let err='';try{localStorage.setItem('sagi.iq.records',JSON.stringify(records))}catch{err=' 本次未能保存。'}$('feedback').textContent=(j===-1?'本题超时。':ok?'符合本题优先判断。':'还有更合适的优先选择。')+s.f+err;for(const [k,b] of Array.from($('choices').children).entries()){b.disabled=true;if(order[k]===s.c)b.style.borderColor='#77dc8a'}$('progress').textContent='第 '+(i+1)+' / '+q.length+' 题｜本轮 '+roundCorrect+' / '+roundAnswered;$('next').hidden=false;$('next').textContent=i===q.length-1?'重新练习':'下一题'}
function play(){if(locked)return;clearInterval(timer);$('clock').textContent='';cancelAnimationFrame(frame);ready=false;for(const b of $('choices').children)b.disabled=true;$('feedback').textContent='观察跑动与来球…';const nodes=$('players').children,ps=q[i].p;const t0=performance.now();function tick(t){const u=Math.min(1,(t-t0)/2200);for(let k=0;k<ps.length;k++){const [x,y,n]=ps[k];let dx=n==='对手'?22: n==='队友'?-20:n==='来球'?-30:0;let dy=n==='队友'?12:0;const xx=x+dx*(1-u),yy=y+dy*(1-u);nodes[k*2].setAttribute('cx',xx);nodes[k*2].setAttribute('cy',yy);nodes[k*2+1].setAttribute('x',xx);nodes[k*2+1].setAttribute('y',yy-13)}if(u<1)frame=requestAnimationFrame(tick);else{ready=true;start=performance.now();limit=Number($('difficulty').value);$('replay').hidden=limit>0;if(limit){const check=()=>{const left=Math.max(0,limit-(performance.now()-start));$('clock').textContent='剩余 '+(left/1000).toFixed(1)+' 秒';if(left<=0)answer(-1)};timer=setInterval(check,50);check()}$('feedback').textContent='画面暂停，请选择。';for(const b of $('choices').children)b.disabled=false}}frame=requestAnimationFrame(tick)}
$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='sagi-iq-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('replay').onclick=play;$('difficulty').onchange=()=>{if(!locked)play()};
$('next').onclick=()=>{i=(i+1)%q.length;if(i===0){roundCorrect=0;roundAnswered=0}show()};show();
</script></html>
