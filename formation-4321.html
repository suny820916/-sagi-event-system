<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110c">
<title>SAGI 4-3-2-1 · Broadcast Tactical Motion V1.1</title>
<style>
:root{--bg:#050807;--panel:#0d1310;--line:rgba(255,255,255,.78);--muted:rgba(255,255,255,.58);--gold:#d7b866;--cyan:#77efff;--blue:#248ee8}
*{box-sizing:border-box}html,body{margin:0;background:#050807;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding:12px 10px 30px;background:radial-gradient(circle at 50% 0%,rgba(28,104,58,.18),transparent 36%),#050807}
.wrap{width:min(100%,760px);margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 2px 10px}
.brand{font-size:10px;letter-spacing:.22em;color:var(--gold);font-weight:850}.title{font-size:clamp(21px,6vw,34px);font-weight:950;letter-spacing:-.05em;margin-top:4px}.ver{font-size:10px;color:#999;border:1px solid #2b332e;padding:6px 9px;border-radius:999px}
.stage{position:relative;width:min(100%,540px);aspect-ratio:9/16;margin:auto;overflow:hidden;border-radius:24px;background:#0b3c22;border:1px solid rgba(255,255,255,.08);isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 24%,transparent 76%,rgba(0,0,0,.38)),repeating-linear-gradient(90deg,#0d522d 0 12.5%,#116436 12.5% 25%)}
.stage:after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 48%,transparent 0 30%,rgba(0,0,0,.08) 65%,rgba(0,0,0,.34));pointer-events:none}
.hud{position:absolute;z-index:20;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:flex-start}.hud small{font-size:8px;letter-spacing:.18em;color:#c9d2cd}.hud h2{font-size:38px;line-height:.9;margin:5px 0 0;letter-spacing:-.06em}.sceneTag{padding:7px 9px;border:1px solid rgba(255,255,255,.18);border-radius:11px;background:rgba(0,0,0,.25);backdrop-filter:blur(8px);font-size:9px;color:#d7dfda;text-align:right}
.pitch{position:absolute;inset:11.5% 8% 8%;z-index:3;border:2px solid var(--line)}.half{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}.circle{position:absolute;width:33%;aspect-ratio:1;left:33.5%;top:50%;transform:translateY(-50%);border:2px solid var(--line);border-radius:50%}.dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}.box{position:absolute;left:25%;width:50%;height:12%;border:2px solid var(--line)}.box.top{top:-2px;border-top:0}.box.bottom{bottom:-2px;border-bottom:0}.goal{position:absolute;left:38%;width:24%;height:3.4%;border:2px solid var(--line)}.goal.top{top:-3.4%}.goal.bottom{bottom:-3.4%}
.overlay{position:absolute;inset:11.5% 8% 8%;z-index:5;pointer-events:none}.overlay path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s ease}.shape{stroke:rgba(119,239,255,.2);stroke-width:1.2;stroke-dasharray:4 7}.route{stroke:var(--cyan);stroke-width:2;stroke-dasharray:7 7;filter:drop-shadow(0 0 4px rgba(119,239,255,.45));animation:dash 1s linear infinite}.support{stroke:rgba(215,184,102,.75);stroke-width:1.5;stroke-dasharray:3 6}
.player{position:absolute;z-index:12;width:48px;height:48px;margin:-24px 0 0 -24px;display:grid;place-items:center;left:var(--x);top:var(--y);opacity:1;transition:left .85s cubic-bezier(.2,.75,.2,1),top .85s cubic-bezier(.2,.75,.2,1),transform .35s ease,filter .35s ease}
.player:before{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 35% 28%,#fff 0 4%,#62c8ff 5% 12%,#1686d9 42%,#075aa4 76%,#043f76 100%);box-shadow:0 0 0 4px rgba(10,96,165,.23),0 5px 12px rgba(0,0,0,.32)}
.player.gk:before{background:radial-gradient(circle at 35% 28%,#fff 0 4%,#ffed9a 5% 12%,#d4aa35 42%,#957016 76%,#684d07 100%);box-shadow:0 0 0 4px rgba(215,184,102,.18),0 5px 12px rgba(0,0,0,.32)}.player.st:before{background:radial-gradient(circle at 35% 28%,#fff 0 4%,#d7fdff 5% 12%,#39cbd9 42%,#167783 78%,#0b4c55 100%)}
.num{position:relative;z-index:2;font-size:11px;font-weight:950;text-shadow:0 1px 3px #000}.role{position:absolute;top:43px;left:50%;transform:translateX(-50%);font-size:7px;font-weight:850;letter-spacing:.09em;white-space:nowrap;color:rgba(255,255,255,.72)}
.player.hot{transform:scale(1.14);filter:drop-shadow(0 0 8px rgba(119,239,255,.5))}
.ball{position:absolute;z-index:16;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 15%,#d9d9d9 16% 45%,#262626 46% 58%,#f5f5f5 59% 100%);box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 14px rgba(255,255,255,.65);left:50%;top:84%;transform:translate(-50%,-50%);transition:left .62s cubic-bezier(.2,.75,.2,1),top .62s cubic-bezier(.2,.75,.2,1),opacity .2s}
.phase{position:absolute;z-index:20;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.phase small{display:block;font-size:8px;color:rgba(255,255,255,.55);letter-spacing:.12em}.phase b{display:block;margin-top:3px;font-size:12px}.sagi{font-size:9px;color:var(--gold);border:1px solid rgba(215,184,102,.3);padding:6px 8px;border-radius:999px;background:rgba(0,0,0,.22)}
.toolbar{width:min(100%,540px);margin:12px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.sceneBtn,.controlBtn{appearance:none;border:1px solid #2d3631;background:#111713;color:#eee;border-radius:12px;padding:10px 8px;min-height:44px;font:800 11px inherit}.sceneBtn.on{background:linear-gradient(135deg,#e3cb85,#b18f3e);color:#17130a;border:0}.controls{width:min(100%,540px);margin:8px auto 0;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.controlBtn.primary{background:#173729}.note{text-align:center;font-size:10px;color:#78837d;line-height:1.5;margin:9px auto 0;width:min(100%,540px)}
@keyframes dash{to{stroke-dashoffset:-28}}@media(max-width:420px){.stage{border-radius:18px}.player{width:42px;height:42px;margin:-21px 0 0 -21px}.role{top:38px}.hud h2{font-size:34px}.toolbar{gap:5px}.sceneBtn{padding:9px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">SAGI TACTICAL LAB</div><div class="title">4-3-2-1 战术动画</div></div><div class="ver">V1.2 · TACTICAL LAB</div></div>

  <div id="stage" class="stage">
    <div class="hud"><div><small>FORMATION ENGINE</small><h2>4·3·2·1</h2></div><div id="sceneTag" class="sceneTag">SCENE 01<br>FORMATION</div></div>
    <div class="pitch"><div class="half"></div><div class="circle"></div><div class="dot"></div><div class="box top"></div><div class="box bottom"></div><div class="goal top"></div><div class="goal bottom"></div></div>

    <svg id="overlay" class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
      <g id="formationLines">
        <path class="shape" d="M18 71 L39 75 L61 75 L82 71 M27 54 L50 50 L73 54 M37 36 L63 36 M50 22 L37 36 L27 54 L18 71 M50 22 L63 36 L73 54 L82 71"/>
      </g>
      <g id="buildLines" style="opacity:0">
        <path class="route" d="M50 84 L39 73 L26 57"/>
        <path class="route" d="M50 84 L61 73 L74 57"/>
        <path class="support" d="M39 73 L50 52 L61 73 M26 57 L50 52 L74 57"/>
      </g>
      <g id="attackLines" style="opacity:0">
        <path class="route" d="M50 52 C43 46 40 40 37 34"/>
        <path class="route" d="M50 52 C57 46 60 40 63 34"/>
        <path class="route" d="M37 34 C42 28 46 23 50 18"/>
        <path class="route" d="M63 34 C58 28 54 23 50 18"/>
        <path class="support" d="M16 66 C14 51 18 40 27 32 M84 66 C86 51 82 40 73 32"/>
      </g>
    </svg>

    <div id="p1" class="player gk" data-role="GK"><span class="num">1</span><span class="role">GK</span></div>
    <div id="p3" class="player" data-role="LB"><span class="num">3</span><span class="role">LB</span></div>
    <div id="p4" class="player" data-role="LCB"><span class="num">4</span><span class="role">LCB</span></div>
    <div id="p5" class="player" data-role="RCB"><span class="num">5</span><span class="role">RCB</span></div>
    <div id="p2" class="player" data-role="RB"><span class="num">2</span><span class="role">RB</span></div>
    <div id="p8" class="player" data-role="LCM"><span class="num">8</span><span class="role">LCM</span></div>
    <div id="p6" class="player" data-role="CM"><span class="num">6</span><span class="role">CM</span></div>
    <div id="p7" class="player" data-role="RCM"><span class="num">7</span><span class="role">RCM</span></div>
    <div id="p10" class="player" data-role="LAM"><span class="num">10</span><span class="role">LAM</span></div>
    <div id="p11" class="player" data-role="RAM"><span class="num">11</span><span class="role">RAM</span></div>
    <div id="p9" class="player st" data-role="ST"><span class="num">9</span><span class="role">ST</span></div>
    <div id="ball" class="ball" aria-label="足球"></div>

    <div class="phase"><div><small id="phaseKicker">STRUCTURE</small><b id="phaseText">四后卫 · 三中场 · 双前腰 · 单前锋</b></div><div class="sagi">SAGI</div></div>
  </div>

  <div class="toolbar">
    <button class="sceneBtn on" data-scene="formation">01 阵型展开</button>
    <button class="sceneBtn" data-scene="build">02 后场出球</button>
    <button class="sceneBtn" data-scene="attack">03 进攻推进</button>
  </div>
  <div class="controls">
    <button id="auto" class="controlBtn primary">▶ 自动演示</button>
    <button id="replay" class="controlBtn">↻ 重播当前</button>
    <button id="clean" class="controlBtn">◫ 纯画面</button>\n    <button id="classic" class="controlBtn">AC米兰经典 →</button>
  </div>
  <div class="note">V1.2：三段式4321战术动画 + AC米兰经典案例 · 中文解说 · 9:16 手机端</div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
  const stage=$('#stage'), ball=$('#ball'), sceneTag=$('#sceneTag'), phaseKicker=$('#phaseKicker'), phaseText=$('#phaseText');
  const formations={
    formation:{p1:[50,85],p3:[18,71],p4:[39,75],p5:[61,75],p2:[82,71],p8:[27,54],p6:[50,50],p7:[73,54],p10:[37,36],p11:[63,36],p9:[50,22]},
    build:{p1:[50,85],p3:[15,68],p4:[36,74],p5:[64,74],p2:[85,68],p8:[26,56],p6:[50,57],p7:[74,56],p10:[39,39],p11:[61,39],p9:[50,23]},
    attack:{p1:[50,85],p3:[14,54],p4:[36,67],p5:[64,67],p2:[86,54],p8:[30,47],p6:[50,51],p7:[70,47],p10:[39,31],p11:[61,31],p9:[50,17]}
  };
  const meta={
    formation:['SCENE 01','FORMATION','STRUCTURE','四后卫 · 三中场 · 双前腰 · 单前锋'],
    build:['SCENE 02','BUILD UP','BUILD FROM BACK','门将发起 · 中卫拉开 · 6号位下沉接应'],
    attack:['SCENE 03','ATTACK','VERTICAL PROGRESSION','边后卫前插 · 双前腰内收 · 9号牵制纵深']
  };
  let current='formation', timers=[], autoRun=false, clean=false;

  function clearTimers(){timers.forEach(clearTimeout);timers=[]}
  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function pos(id,x,y){const e=document.getElementById(id);e.style.left=x+'%';e.style.top=y+'%'}
  function setPlayers(scene){
    Object.entries(formations[scene]).forEach(([id,p])=>pos(id,p[0],p[1]));
    $$('.player').forEach(x=>x.classList.remove('hot'));
    if(scene==='build') ['p1','p4','p5','p6','p8','p7'].forEach(id=>$('#'+id).classList.add('hot'));
    if(scene==='attack') ['p3','p2','p10','p11','p9'].forEach(id=>$('#'+id).classList.add('hot'));
  }
  function lines(scene){
    $('#formationLines').style.opacity=scene==='formation'?1:.12;
    $('#buildLines').style.opacity=scene==='build'?1:0;
    $('#attackLines').style.opacity=scene==='attack'?1:0;
  }
  function ballTo(x,y,delay=0){later(()=>{ball.style.left=x+'%';ball.style.top=y+'%'},delay)}
  function animateBall(scene){
    clearTimers();
    ball.style.opacity=1;
    if(scene==='formation'){ballTo(50,84,10);return}
    if(scene==='build'){
      ballTo(50,84,10); ballTo(38,73,700); ballTo(26,57,1450); ballTo(50,57,2250); ballTo(74,56,3050);
    }
    if(scene==='attack'){
      ballTo(50,52,10); ballTo(39,31,750); ballTo(50,17,1550); ballTo(61,31,2350); ballTo(50,17,3150);
    }
  }
  function setScene(scene,fromAuto=false){
    if(!formations[scene]) return;
    current=scene; if(!fromAuto) autoRun=false;
    setPlayers(scene); lines(scene); animateBall(scene);
    const m=meta[scene]; sceneTag.innerHTML=m[0]+'<br>'+m[1]; phaseKicker.textContent=m[2]; phaseText.textContent=m[3];
    $$('.sceneBtn').forEach(b=>b.classList.toggle('on',b.dataset.scene===scene));
    $('#auto').textContent=autoRun?'■ 停止自动':'▶ 自动演示';
  }
  function replay(){setScene(current,false)}
  function startAuto(){
    clearTimers(); autoRun=true; $('#auto').textContent='■ 停止自动';
    const seq=['formation','build','attack']; let i=0;
    function next(){
      if(!autoRun)return;
      setScene(seq[i],true); i=(i+1)%seq.length;
      timers.push(setTimeout(next,4600));
    }
    next();
  }
  $$('.sceneBtn').forEach(b=>b.addEventListener('click',()=>setScene(b.dataset.scene,false)));
  $('#replay').addEventListener('click',replay);\n  $('#classic').addEventListener('click',()=>{location.href='acmilan-4321-classic.html'});
  $('#auto').addEventListener('click',()=>{if(autoRun){autoRun=false;clearTimers();$('#auto').textContent='▶ 自动演示'}else startAuto()});
  $('#clean').addEventListener('click',()=>{
    clean=!clean; $('.top').style.display=clean?'none':'flex'; $('.toolbar').style.display=clean?'none':'grid'; $('.note').style.display=clean?'none':'block';
    $('#clean').textContent=clean?'退出纯画面':'◫ 纯画面';
  });
  setScene('formation',false);
})();
</script>
</body>
</html>
