plugins {
    id 'com.android.application'
}

def liveLicenceUrl = System.getenv("TENCENT_LIVE_LICENSE_URL") ?: ""
def liveLicenceKey = System.getenv("TENCENT_LIVE_LICENSE_KEY") ?: ""
def defaultSyncUrl = System.getenv("SAGI_DEFAULT_SYNC_URL") ?: ""
def releaseStorePath = System.getenv("SAGI_KEYSTORE_PATH") ?: ""
def releaseStorePassword = System.getenv("SAGI_KEYSTORE_PASSWORD") ?: ""
def releaseKeyAlias = System.getenv("SAGI_KEY_ALIAS") ?: ""
def releaseKeyPassword = System.getenv("SAGI_KEY_PASSWORD") ?: ""

android {
    namespace 'com.sagi.poollive'
    compileSdk 35

    defaultConfig {
        applicationId "com.sagi.poollive"
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName "1.0.0-rc2"

        buildConfigField "String", "LIVE_LICENSE_URL", '"' + liveLicenceUrl.replace('"','\\\"') + '"'
        buildConfigField "String", "LIVE_LICENSE_KEY", '"' + liveLicenceKey.replace('"','\\\"') + '"'
        buildConfigField "String", "DEFAULT_SYNC_URL", '"' + defaultSyncUrl.replace('"','\\\"') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        if (!releaseStorePath.isEmpty()) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (!releaseStorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.tencent.liteav:LiteAVSDK_Live:13.5.0.20670'
}
