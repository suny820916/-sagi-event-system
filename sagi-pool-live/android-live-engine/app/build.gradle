plugins {
    id 'com.android.application'
}

def liveLicenceUrl = System.getenv("TENCENT_LIVE_LICENSE_URL") ?: ""
def liveLicenceKey = System.getenv("TENCENT_LIVE_LICENSE_KEY") ?: ""

android {
    namespace 'com.sagi.poollive'
    compileSdk 35

    defaultConfig {
        applicationId "com.sagi.poollive"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "0.3.0"

        buildConfigField "String", "LIVE_LICENSE_URL", '"' + liveLicenceUrl.replace('"','\\\"') + '"'
        buildConfigField "String", "LIVE_LICENSE_KEY", '"' + liveLicenceKey.replace('"','\\\"') + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'com.tencent.liteav:LiteAVSDK_Live:13.5.0.20670'
}
