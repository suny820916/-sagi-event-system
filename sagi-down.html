<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAGI DOWN">



<title>SAGI DOWN</title>
<style>
:root{color-scheme:dark;--bg:#080b0d;--card:#0e1417;--line:#24343a;--text:#edf2f3;--muted:#788b92;--gold:#d7b568;--good:#6ca17a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
body{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand b{font-size:20px;letter-spacing:.5px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badge{font-size:10px;border:1px solid #4f5c38;color:#d7c58d;border-radius:99px;padding:6px 9px}
.hero{padding:22px;border:1px solid #2d424a;border-radius:18px;background:radial-gradient(circle at 90% 0,rgba(70,125,143,.18),transparent 35%),var(--card);margin-bottom:12px}.hero small{color:#8ba0a8;font-size:10px;letter-spacing:1px}.hero h1{font-size:27px;line-height:1.12;margin:10px 0 8px}.hero p{margin:0;color:#83959b;font-size:12px;line-height:1.6}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;margin-top:10px}.label{font-size:10px;color:#8fa1a7;margin-bottom:7px}.inputWrap{display:flex;gap:7px}.inputWrap input{flex:1;min-width:0;border:1px solid #2c3e45;background:#070b0d;color:#fff;border-radius:12px;padding:14px;font-size:14px;outline:none}.inputWrap input:focus{border-color:#6a7d84}.btn{border:1px solid #32434a;background:#121b1f;color:#eaf0f2;border-radius:12px;padding:12px 13px;font-weight:650;font-size:12px}.btn.primary{background:#eee;color:#0b0c0d;border-color:#eee}.btn.blue{border-color:#405b66;background:#102027}.btn:active{transform:scale(.985)}
.actions{display:grid;grid-template-columns:1.25fr .75fr;gap:8px;margin-top:10px}.status{margin-top:10px;border:1px solid #2b3b42;border-radius:11px;padding:10px 11px;color:#87999f;font-size:11px;line-height:1.5}.status.good{border-color:#355741;color:#9fc0a7}.status.warn{border-color:#665438;color:#d3bb7b}.platform{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.platform b{font-size:11px}.platform span{font-size:9px;color:#74868d}
.history{display:grid;gap:7px}.row{border:1px solid #24343a;border-radius:11px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.row b{font-size:11px;display:block}.row span{font-size:8px;color:#6f8288;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:67vw;margin-top:3px}.row button{padding:8px 10px}.empty{text-align:center;color:#60747b;font-size:10px;padding:14px}
.install{font-size:10px;color:#72858b;text-align:center;line-height:1.55;margin:18px 10px 0}
@media(max-width:390px){.actions{grid-template-columns:1fr}.hero h1{font-size:24px}.inputWrap{grid-template-columns:1fr}.inputWrap .btn{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><b>SAGI DOWN</b><span>视频链接快捷下载</span></div>
    <span class="badge">V1.0</span>
  </div>

  <section class="hero">
    <small>ONE TAP DOWNLOAD</small>
    <h1>粘贴链接，直接去下载。</h1>
    <p>独立快捷方式，不进入 CONTENT OS。支持识别 Instagram / YouTube / TikTok / X 等常见视频链接。</p>
  </section>

  <section class="card">
    <div class="label">视频链接</div>
    <div class="inputWrap">
      <input id="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://...">
      <button class="btn" id="pasteBtn" type="button">粘贴</button>
    </div>
    <div class="platform"><div><b id="platformName">等待链接</b><span id="platformHint">粘贴后自动识别平台</span></div></div>
    <div class="actions">
      <button class="btn primary" id="downloadBtn" type="button">下载视频</button>
      <button class="btn blue" id="openBtn" type="button">打开原链接</button>
    </div>
    <div id="status" class="status">等待粘贴视频链接。</div>
  </section>

  <section class="card">
    <div class="label">最近下载</div>
    <div id="history" class="history"><div class="empty">还没有记录</div></div>
  </section>

  <div class="install">iPhone：Safari 打开本页 → 分享 →「添加到主屏幕」，以后桌面直接点 SAGI DOWN。</div>
</div>

<script>
(()=>{'use strict';
const COBALT='https://cobalt.tools/';
const KEY='sagi_down_history_v1';
const q=id=>document.getElementById(id);
const url=q('url'),status=q('status'),platformName=q('platformName'),platformHint=q('platformHint');

function normalize(v){
  const s=String(v||'').trim(); if(!s)return'';
  try{const u=new URL(s); return /^https?:$/.test(u.protocol)?u.toString():''}catch(e){return''}
}
function detect(v){
  try{
    const h=new URL(v).hostname.toLowerCase();
    if(/instagram\.com$/.test(h)||/\.instagram\.com$/.test(h))return['Instagram','Reel / Post'];
    if(/youtube\.com$/.test(h)||/youtu\.be$/.test(h)||/\.youtube\.com$/.test(h))return['YouTube','Video / Shorts'];
    if(/tiktok\.com$/.test(h)||/\.tiktok\.com$/.test(h))return['TikTok','Video'];
    if(/x\.com$/.test(h)||/twitter\.com$/.test(h))return['X / Twitter','Video'];
    if(/bilibili\.com$/.test(h)||/b23\.tv$/.test(h))return['Bilibili','Video'];
    return['视频链接','将交给下载页处理'];
  }catch(e){return['等待链接','粘贴后自动识别平台']}
}
function setStatus(t,k=''){status.textContent=t;status.className='status '+k}
function updateDetect(){
  const v=normalize(url.value),d=detect(v);platformName.textContent=d[0];platformHint.textContent=d[1]
}
function history(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveHistory(v){
  let list=history().filter(x=>x.url!==v);
  list.unshift({url:v,at:Date.now(),platform:detect(v)[0]});
  localStorage.setItem(KEY,JSON.stringify(list.slice(0,20)));renderHistory()
}
function renderHistory(){
  const host=q('history'),list=history();
  host.innerHTML=list.length?list.map((x,i)=>'<div class="row"><div><b>'+escapeHtml(x.platform||'视频')+'</b><span>'+escapeHtml(x.url)+'</span></div><button class="btn" data-use="'+i+'" type="button">再下</button></div>').join(''):'<div class="empty">还没有记录</div>';
  host.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const x=list[Number(b.dataset.use)];if(!x)return;url.value=x.url;updateDetect();download()})
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function paste(){
  try{const t=await navigator.clipboard.readText();if(t){url.value=t.trim();updateDetect();setStatus('链接已粘贴。','good')}}catch(e){setStatus('iPhone 未允许读取剪贴板，请长按输入框粘贴。','warn')}
}
async function download(){
  const v=normalize(url.value);if(!v){setStatus('请先粘贴有效链接。','warn');return}
  try{await navigator.clipboard.writeText(v);setStatus('链接已复制，正在打开 Cobalt。进入后直接粘贴即可。','good')}catch(e){setStatus('正在打开 Cobalt，请在页面中粘贴当前链接。','good')}
  saveHistory(v);window.open(COBALT,'_blank','noopener')
}
function openOriginal(){const v=normalize(url.value);if(!v){setStatus('请先粘贴有效链接。','warn');return}window.open(v,'_blank','noopener')}
q('pasteBtn').onclick=paste;q('downloadBtn').onclick=download;q('openBtn').onclick=openOriginal;url.addEventListener('input',updateDetect);url.addEventListener('keydown',e=>{if(e.key==='Enter')download()});renderHistory();


})();
</script>
</body>
</html>
