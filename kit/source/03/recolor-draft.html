const palettes=[
 {name:"藏蓝红金",base:[20,42,91],accent:[180,30,42]},
 {name:"红白金",base:[185,31,42],accent:[232,232,228]},
 {name:"蓝白金",base:[28,76,184],accent:[232,232,228]},
 {name:"紫白金",base:[92,40,140],accent:[232,232,228]},
 {name:"白黑金",base:[232,232,228],accent:[25,25,27]},
 {name:"黄绿",base:[225,195,30],accent:[20,105,60]}
];
const im=document.getElementById("source"), out=document.getElementById("out");
const W=320,H=249;
const front=[[120,18],[145,9],[197,10],[221,25],[229,55],[226,85],[232,119],[225,163],[219,195],[205,218],[146,216],[129,191],[122,155],[119,112],[118,75],[121,39]];
const back=[[22,27],[48,14],[86,10],[114,24],[126,49],[124,83],[128,117],[122,155],[117,192],[109,214],[39,215],[29,190],[24,154],[20,111],[18,76]];
const shorts=[[239,65],[299,63],[309,84],[307,117],[302,159],[298,207],[262,211],[252,185],[247,155],[237,119]];
const accentPolys=[
 [[124,26],[149,17],[158,34],[133,45]],

 [[27,148],[48,148],[48,164],[28,165]],
 [[121,125],[145,126],[143,145],[122,146]],
 [[237,108],[247,110],[241,163],[232,154]]
];
const legacy=[
 {r:[48,49,101,70],o:[0,26]},
 {r:[136,45,157,58],o:[0,28]},

 {r:[205,40,222,60],o:[-20,18]},
 {r:[281,173,309,193],o:[-28,-8]}
];
function clamp(v,a=0,b=255){return Math.max(a,Math.min(b,v))}
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-6)+xi))c=!c;}return c}
function inAny(x,y,ps){for(const p of ps)if(inside(x,y,p))return true;return false}
function heal(data,w,h,[x0,y0,x1,y1],[dx,dy]){
 const src=new Uint8ClampedArray(data);
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
   const sx=Math.max(0,Math.min(w-1,x+dx)),sy=Math.max(0,Math.min(h-1,y+dy));
   const sx2=Math.max(0,Math.min(w-1,x-dx)),sy2=Math.max(0,Math.min(h-1,y+Math.max(8,Math.abs(dy))));
   const i=(y*w+x)*4,a=(sy*w+sx)*4,b=(sy2*w+sx2)*4;
   for(let k=0;k<3;k++)data[i+k]=Math.round(src[a+k]*.72+src[b+k]*.28);
 }
}
function mapColor(rgb,target){
 const [r,g,b]=rgb,max=Math.max(r,g,b),min=Math.min(r,g,b),lum=(max+min)/2;
 const scale=.48+lum/255*.92;
 return target.map(v=>clamp(Math.round(v*scale)));
}
function recolor(img,target,accent){
 const d=new Uint8ClampedArray(img.data);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
   const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx-mn;
   const shirt=inside(x,y,front)||inside(x,y,back);
   const short=inside(x,y,shorts);
   if(shirt){
     if(r>g+12&&r>b+6&&r>70){
       const c=mapColor([r,g,b],target);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];
     }
     if(inAny(x,y,accentPolys)&&sat<60&&mx<235){
       const c=mapColor([r,g,b],accent);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];
     }
   }
   if(short){
     if(sat<48&&mn>145){
       const c=mapColor([r,g,b],target);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];
     }
     if(inAny(x,y,accentPolys)){
       const c=mapColor([r,g,b],accent);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];
     }
   }
 }
 return new ImageData(d,W,H);
}
function mark(ctx,x,y,s,light=true){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineJoin="round";ctx.lineCap="round";
 ctx.strokeStyle=light?"#f7f4ec":"#111";ctx.lineWidth=2.4;
 ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(0,-8);ctx.lineTo(8,8);ctx.moveTo(-4,2);ctx.lineTo(4,2);ctx.stroke();
 ctx.fillStyle="#e11d2e";ctx.beginPath();ctx.arc(6,-7,2.5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function render(){
 const base=document.createElement("canvas");base.width=W;base.height=H;const bx=base.getContext("2d");bx.drawImage(im,0,0,W,H);
 const clean=bx.getImageData(0,0,W,H);legacy.forEach(x=>heal(clean.data,W,H,x.r,x.o));bx.putImageData(clean,0,0);
 for(const p of palettes){
   const c=document.createElement("canvas");c.width=1160;c.height=680;const ctx=c.getContext("2d");
   const work=document.createElement("canvas");work.width=W;work.height=H;const wx=work.getContext("2d");
   wx.putImageData(recolor(clean,p.base,p.accent),0,0);
   const light=(p.base[0]+p.base[1]+p.base[2])<520;
   mark(wx,178,68,1.05,light);mark(wx,74,60,.82,light);mark(wx,291,183,.68,light);
   ctx.fillStyle="#efefed";ctx.fillRect(0,0,c.width,c.height);
   const scale=Math.min(c.width/W,c.height/H),dw=W*scale,dh=H*scale;
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
   ctx.drawImage(work,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
   const wrap=document.createElement("div");wrap.style.cssText="background:#0f0f0f;border:1px solid #333;border-radius:14px;padding:10px";
   const t=document.createElement("div");t.textContent=p.name+" · V4多通道修复稿";t.style.cssText="font-weight:800;margin:0 0 8px";wrap.appendChild(t);
   c.style.cssText="width:100%;height:auto;background:#eee;border-radius:8px";wrap.appendChild(c);out.appendChild(wrap);
 }
}
if(im.complete)render();else im.onload=render;
