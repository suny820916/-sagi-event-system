const im=document.getElementById("source");function run(){for(const [name,target] of palettes){const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const ctx=c.getContext("2d");ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){let r=d.data[i],g=d.data[i+1],b=d.data[i+2];if(r-g>20&&r-b>10&&r>85){const l=(r+g+b)/3,delta=l-135;for(let k=0;k<3;k++)d.data[i+k]=Math.max(0,Math.min(255,target[k]+delta));}}ctx.putImageData(d,0,0);const div=document.createElement("div");div.textContent=name+" · 基色试验";div.appendChild(document.createElement("br"));div.appendChild(c);document.getElementById("out").appendChild(div);}}if(im.complete)run();else im.onload=run;
