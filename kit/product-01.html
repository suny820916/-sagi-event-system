<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>SAGI KIT · 01 狮头系列</title>
<style>
:root{--bg:#080808;--panel:#141414;--line:#2c2c2c;--text:#f5f1e8;--muted:#929292;--gold:#d8b55b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:1080px;margin:auto;padding:14px 12px 70px}.brandlogo{display:inline-flex;align-items:center;text-decoration:none}.brandlogo img{display:block;width:150px;height:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{color:#fff;text-decoration:none;background:#222;border:1px solid #333;border-radius:12px;padding:10px 12px;font-weight:800}.tag{font-size:11px;color:#111;background:linear-gradient(135deg,#bc9948,#e3c66e);border-radius:999px;padding:7px 10px;font-weight:900}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:16px;margin-top:14px}.gallery,.info{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}
.preview{width:100%;aspect-ratio:4/5;border-radius:16px;background-image:url("./assets/01-lion/sagi-demo-sprite.webp");background-size:300% 200%;background-repeat:no-repeat;background-position:0 0;background-color:#eee}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-top:9px}.thumb{border:1px solid #333;border-radius:10px;padding:3px;background:#0b0b0b;cursor:pointer}.thumb.on{border-color:var(--gold);box-shadow:0 0 0 1px #6c592c}.crop{width:100%;aspect-ratio:4/5;border-radius:7px;background-image:url("./assets/01-lion/sagi-demo-sprite.webp");background-size:300% 200%;background-repeat:no-repeat}.thumb span{display:block;text-align:center;color:#8d8d8d;font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:1px}.title{font-size:28px;font-weight:950;margin:6px 0}.sub{font-size:12px;color:var(--muted);line-height:1.65}.selected{margin:14px 0;padding:12px;background:#0c0c0c;border:1px solid #333;border-radius:14px}.selected small{display:block;color:#777}.selected b{display:block;font-size:18px;margin-top:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{background:#0b0b0b;border:1px solid #292929;border-radius:12px;padding:10px;font-size:10px;color:#888}.cell b{display:block;color:#eee;font-size:13px;margin-top:3px}
.section{margin-top:12px}.section h3{font-size:13px;margin:0 0 8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #333;background:#101010;color:#ccc;border-radius:999px;padding:7px 9px;font-size:10px}
.prices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.price{background:#0b0b0b;border:1px solid #292929;border-radius:10px;padding:8px;text-align:center;font-size:9px;color:#888}.price b{display:block;color:#f4e1a3;font-size:13px;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:13px;background:#292929;color:#fff;text-decoration:none;font-weight:900;font-size:14px}.primary{background:linear-gradient(135deg,#bc9948,#e3c66e);color:#111}
.note{margin-top:12px;color:#777;font-size:10px;line-height:1.6}
@media(max-width:760px){.hero{grid-template-columns:1fr}.info{padding-bottom:18px}.thumbs{gap:5px}.prices{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><a class="brandlogo" href="/"><img src="/assets/brand/sagi-football-logo.webp?v=20261121a" alt="SAGI FOOTBALL"></a><a class="back" href="./catalog.html">← 产品画册</a></div><div class="tag">SAGI KIT · TEAMWEAR</div></div>
 <div class="hero">
  <div class="gallery">
   <div class="preview" id="preview"></div>
   <div class="thumbs" id="thumbs"></div>
  </div>
  <div class="info">
   <div class="eyebrow">01 · LION SERIES</div>
   <div class="title">狮头系列一</div>
   <div class="sub">狮头暗纹与比赛服结构结合，提供六套标准配色，并支持球队标识、姓名、号码与尺码定制。</div>
   <div class="selected"><small>当前样板配色</small><b id="selectedName">藏蓝红金</b></div>
   <div class="grid">
    <div class="cell">儿童尺码<b>110 — 160</b></div>
    <div class="cell">成人尺码<b>XS(160) — 5XL(200)</b></div>
   </div>
   <div class="section"><h3>可选领型</h3><div class="chips"><span class="chip">常规V圆领</span><span class="chip">交叉V圆领</span><span class="chip">缺口V圆领</span><span class="chip">平口V领</span><span class="chip">翻领</span><span class="chip">Polo领</span></div></div>
   <div class="section"><h3>面料选择</h3><div class="chips"><span class="chip">针眼</span><span class="chip">菱形提花</span><span class="chip">针眼提花</span><span class="chip">高阶比赛面料</span></div><div class="note" style="margin-top:9px">具体面料、数量与定制内容确认后再确定最终报价。</div></div></div>
   <div class="actions"><a class="btn" href="./catalog.html">继续选款</a><a class="btn primary" id="designBtn" href="./customize.html?kit=01A">开始定制</a></div>
   <div class="note">页面展示为标准配色效果；正式生产以最终确认的尺码、印字、球队标识和订单信息为准。</div>
  </div>
 </div>
</div>
<script>
const items=[
 {name:"藏蓝红金",pos:["0%","0%"],hex:"#0e234e"},
 {name:"红白金",pos:["50%","0%"],hex:"#c90f22"},
 {name:"蓝白金",pos:["100%","0%"],hex:"#123fb5"},
 {name:"紫白金",pos:["0%","100%"],hex:"#511278"},
 {name:"白黑金",pos:["50%","100%"],hex:"#f2f2f0"},
 {name:"黄绿",pos:["100%","100%"],hex:"#f1cf08"}
];
const preview=document.getElementById("preview"), thumbs=document.getElementById("thumbs"), selected=document.getElementById("selectedName");
function choose(i){
 const it=items[i]; preview.style.backgroundPosition=it.pos[0]+" "+it.pos[1]; selected.textContent=it.name;
 [...thumbs.children].forEach((x,n)=>x.classList.toggle("on",n===i));
}
items.forEach((it,i)=>{const d=document.createElement("div");d.className="thumb"+(i===0?" on":"");d.innerHTML='<div class="crop" style="background-position:'+it.pos[0]+' '+it.pos[1]+'"></div><span>'+it.name+'</span>';d.onclick=()=>choose(i);thumbs.appendChild(d)});choose(0);
</script>
</body>
</html>
