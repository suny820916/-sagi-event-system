<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>SAGI KIT 产品画册 V2</title>
<style>
:root{--bg:#080808;--panel:#141414;--line:#2c2c2c;--text:#f5f1e8;--muted:#8e8e8e;--gold:#d8b55b;--red:#e11d2e;--green:#72c79a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:1180px;margin:auto;padding:16px 12px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-size:25px;font-weight:950}.sub{font-size:12px;color:var(--muted);margin-top:5px}.badge{border:1px solid #65552b;color:var(--gold);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border-radius:12px;background:#292929;color:#fff;text-decoration:none;font-weight:850;border:0}.primary{background:linear-gradient(135deg,#bc9948,#e3c66e);color:#111}
.rule{background:#15120b;border:1px solid #65552b;border-radius:16px;padding:14px;line-height:1.7;font-size:12px;color:#d8cfb4}.rule b{color:#f2dda1}
.progress{margin:14px 0;background:#101010;border:1px solid var(--line);border-radius:16px;padding:12px}.bar{height:8px;background:#252525;border-radius:999px;overflow:hidden}.fill{height:100%;width:4.55%;background:linear-gradient(90deg,#bc9948,#e3c66e)}.ptext{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#999;margin-top:8px}
.toolbar{position:sticky;top:0;z-index:5;background:#080808e8;backdrop-filter:blur(12px);padding:8px 0}.search{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.preview{aspect-ratio:4/5;background:#0b0b0b;display:flex;align-items:center;justify-content:center;position:relative}.preview.demo{background-image:url("./assets/01-lion/sagi-demo-sprite.webp");background-size:300% 200%;background-position:0 0;background-repeat:no-repeat}.placeholder{padding:22px;text-align:center}.source{font-size:42px;font-weight:950;color:#333}.source small{display:block;font-size:11px;color:#656565;margin-top:6px}.body{padding:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-size:16px;font-weight:950}.code{font-size:11px;color:var(--gold);margin-top:3px}.status{font-size:10px;border-radius:999px;padding:5px 8px;font-weight:850;white-space:nowrap}.published{background:#143322;color:#91e9b7}.locked{background:#332d17;color:#e7ce79}.queued{background:#232323;color:#929292}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.pill{background:#0b0b0b;border:1px solid #292929;border-radius:10px;padding:8px;font-size:10px;color:#777}.pill b{display:block;color:#eee;font-size:12px;margin-top:2px}.colors{display:flex;gap:5px;margin-top:10px}.c{height:8px;flex:1;border-radius:99px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.disabled{opacity:.38;pointer-events:none}
.note{font-size:10px;color:#777;line-height:1.6;margin-top:9px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:1fr}.app{padding-bottom:30px}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div><div class="brand">SAGI KIT · 新产品画册</div><div class="sub">严格按原图册逐款还原 · 通过验收后才发布</div></div><div class="badge">CATALOG V2.0</div></div>
 <div class="nav"><a class="btn" href="./index.html">队服设计器</a><a class="btn" href="./production.html">生产进度</a></div>
 <div class="rule"><b>唯一生产标准：</b> 原图册对应页 → 精确还原版型 / 纹路 / 拼接位置 → 只换 SAGI A+红点标识和标准六配色 → 内部对照验收 → 通过后发布 → 再继续下一款。</div>
 <div class="progress"><div class="bar"><div class="fill"></div></div><div class="ptext"><span>正式发布 1 / 22 款</span><span>01 狮头系列一 = 标准母版</span></div></div>
 <div class="toolbar"><input id="q" class="search" placeholder="搜索款式：狮头 / 斑马纹 / 城邦…"></div>
 <div id="grid" class="grid"></div>
</div>
<script>
const six=["藏蓝红金","红白金","蓝白金","紫白金","白黑金","黄绿"];
const sw=["linear-gradient(90deg,#0d214d,#e11d2e,#d8b55b)","linear-gradient(90deg,#c81929,#f2f2ee,#d8b55b)","linear-gradient(90deg,#1649c8,#f2f2ee,#d8b55b)","linear-gradient(90deg,#572080,#f2f2ee,#d8b55b)","linear-gradient(90deg,#f2f2ee,#171717,#d8b55b)","linear-gradient(90deg,#f0d10b,#0a663c)"];
const products=[
{code:"01A",name:"狮头系列一",page:7,state:"published",label:"已发布",url:"./product-01.html"},
{code:"01B",name:"狮头系列二",page:8,state:"locked",label:"源页锁定"},
{code:"03",name:"交错系列",page:9,state:"queued",label:"待还原"},
{code:"04",name:"斑马纹系列",page:10,state:"queued",label:"待还原"},
{code:"05",name:"折线系列",page:11,state:"queued",label:"待还原"},
{code:"06",name:"结构系列",page:12,state:"queued",label:"待还原"},
{code:"07",name:"星耀系列",page:13,state:"queued",label:"待还原"},
{code:"08",name:"城邦系列",page:14,state:"queued",label:"待还原"},
{code:"09",name:"双色线条",page:15,state:"queued",label:"待还原"},
{code:"10",name:"雄狮系列",page:16,state:"queued",label:"待还原"},
{code:"11",name:"假日风情",page:17,state:"queued",label:"待还原"},
{code:"12",name:"碎线系列",page:18,state:"queued",label:"待还原"},
{code:"13",name:"块面暗纹",page:19,state:"queued",label:"待还原"},
{code:"14",name:"交错系列",page:20,state:"queued",label:"待还原"},
{code:"15",name:"动势系列",page:21,state:"queued",label:"待还原"},
{code:"16",name:"线条渐变",page:22,state:"queued",label:"待还原"},
{code:"17",name:"脉络竖纹",page:23,state:"queued",label:"待还原"},
{code:"18",name:"经典系列",page:24,state:"queued",label:"待还原"},
{code:"19",name:"菱形暗花",page:25,state:"queued",label:"待还原"},
{code:"20",name:"塔系列",page:26,state:"queued",label:"待还原"},
{code:"21",name:"水龙吟系列",page:27,state:"queued",label:"待还原"},
{code:"22",name:"围龙系列",page:28,state:"queued",label:"待还原"}
];
function card(p){
 const live=p.state==="published";
 return `<div class="card" data-key="${p.code} ${p.name}">
   <div class="preview ${live?"demo":""}">${live?"":`<div class="placeholder"><div class="source">PDF ${p.page}<small>原图册对应页已登记</small></div></div>`}</div>
   <div class="body">
    <div class="row"><div><div class="name">${p.code} · ${p.name}</div><div class="code">原图册第 ${p.page} 页</div></div><span class="status ${p.state}">${p.label}</span></div>
    <div class="meta"><div class="pill">固定输出<b>6套标准配色</b></div><div class="pill">品牌标识<b>A + 红点</b></div></div>
    <div class="colors">${sw.map(x=>`<span class="c" style="background:${x}"></span>`).join("")}</div>
    <div class="actions">${live?`<a class="btn" href="${p.url}">查看产品页</a><a class="btn primary" href="${p.url}">用样板设计</a>`:`<span class="btn disabled">未通过不发布</span><a class="btn" href="./production.html">查看进度</a>`}</div>
    <div class="note">${live?"已完成六配色样板并作为 SAGI KIT 标准母版。":"必须先完成原图对照还原与六配色验收，才会进入正式画册。"}</div>
   </div>
 </div>`;
}
function render(){const q=document.getElementById("q").value.trim().toLowerCase();document.getElementById("grid").innerHTML=products.filter(p=>(p.code+" "+p.name).toLowerCase().includes(q)).map(card).join("")}
document.getElementById("q").addEventListener("input",render);render();
</script>
</body></html>
