<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#080808;--panel:#141414;--line:#2c2c2c;--text:#f5f1e8;--muted:#8e8e8e;--gold:#d8b55b;--red:#e11d2e;--green:#72c79a}
*{box-sizing:border-box}body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:1180px;margin:auto;padding:16px 12px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brandlink{display:inline-flex;align-items:center;text-decoration:none}.brandlink img{display:block;width:170px;height:auto}.brand-title{font-size:18px;font-weight:950;margin-top:8px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.topnav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.topnav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;color:#bbb;text-decoration:none;font-size:13px;font-weight:750;padding:8px 10px;border-radius:8px}.topnav a:hover,.topnav a.on{background:#171717;color:#f2dda1}
.catalogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0;font-size:18px}.card p{color:var(--muted);font-size:14px}
.card a{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border-radius:10px;background:var(--gold);color:#111;text-decoration:none;font-weight:750}
@media(max-width:560px){.top{flex-wrap:wrap}.topnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}.topnav a{font-size:clamp(11px,3.6vw,13px);padding-inline:2px;background:#171717}}
.card img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#080808;border-radius:8px;margin:12px 0}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.controls[hidden]{display:none}.controls button{background:#292929;color:#fff;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 12px;font:inherit}
.controls button:disabled{opacity:.45}
.card a.download{background:transparent;color:var(--gold);padding-inline:0}
.catalog-heading{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:16px 0 12px}.catalog-heading h1{margin:0}.design-link{display:inline-flex;align-items:center;min-height:44px;padding:8px 13px;border:1px solid #b42c3b;border-radius:9px;background:#a51c2a;color:#fff;text-decoration:none;font-weight:750}.design-link:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
<style>
.design-link[hidden]{display:none}.design-link{font:inherit;font-weight:750;cursor:pointer}
.design-dialog{width:min(1140px,calc(100% - 24px));height:min(900px,calc(100dvh - 24px));max-width:none;max-height:none;padding:0;border:1px solid var(--line);border-radius:14px;background:#0c0d0e;color:var(--text);overflow:hidden}
.design-dialog[open]{display:grid;grid-template-rows:auto minmax(0,1fr)}.design-dialog::backdrop{background:#000b}.design-open{overflow:hidden}
.dialog-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line)}
.dialog-bar button{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#232323;color:#fff;font:inherit;cursor:pointer}
.design-dialog iframe{display:block;width:100%;height:100%;border:0}
@media(max-width:600px){.design-dialog{width:100%;height:100dvh;margin:0;border:0;border-radius:0}.dialog-bar{padding-top:max(6px,env(safe-area-inset-top))}.design-dialog iframe{padding-bottom:env(safe-area-inset-bottom)}}
</style>
<link rel="stylesheet" href="/assets/brand/site-nav.css?v=1">
</head>
<body>
<div class="app">
<header class="top">
  <a class="brandlink" href="/home.html" aria-label="返回 SAGI SPORTS 首页"><img src="/assets/brand/sagi-official-logo.webp?v=20261121b" alt="SAGI FOOTBALL"></a>
  <nav class="sagi-site-nav" aria-label="主导航"><a href="/home.html">首页</a><a href="/kit/catalog.html" aria-current="page">球队装备</a><a href="/event/v23.html">赛事</a><a href="/toranhe/">托朗戈杯</a><a href="/broadcast/">直播</a><a href="/about.html">关于我们</a></nav>
</header>
<main aria-labelledby="catalog-title">
  <div class="catalog-heading"><h1 id="catalog-title">SAGI KIT 产品画册</h1></div>
  <div class="catalogs">
    <article class="card">
      <h2>SAGI 2026 产品画册</h2>
      <p>PDF · 36 页</p>
      <div class="viewer" data-folder="2026" data-pages="36" data-title="SAGI 2026 产品画册">
        <img src="./assets/catalogs/preview/2026/page-01.jpg?v=2" alt="SAGI 2026 产品画册 · 第 1 页" loading="lazy">
        <div class="controls" hidden>
          <button type="button" data-step="-1" disabled>上一页</button>
          <span aria-live="polite">1 / 36</span>
          <button type="button" data-step="1">下一页</button>
        </div>
        <button class="design-link choose-style" type="button" hidden>选这款并开始设计</button>
      </div>
      <a class="download" href="./assets/catalogs/sagi-2026-teamwear-catalog.pdf" download>下载原版 PDF</a>
    </article>
    <article class="card">
      <h2>SAGI 足球品牌文化画册</h2>
      <p>PDF · 28 页</p>
      <div class="viewer" data-folder="culture" data-pages="28" data-title="SAGI 足球品牌文化画册">
        <img src="./assets/catalogs/preview/culture/page-01.jpg?v=2" alt="SAGI 足球品牌文化画册 · 第 1 页" loading="lazy">
        <div class="controls" hidden>
          <button type="button" data-step="-1" disabled>上一页</button>
          <span aria-live="polite">1 / 28</span>
          <button type="button" data-step="1">下一页</button>
        </div>
        <button class="design-link choose-style" type="button" hidden>选这款并开始设计</button>
      </div>
      <a class="download" href="./assets/catalogs/sagi-football-brand-catalog.pdf" download>下载原版 PDF</a>
    </article>
  </div>
</main>
</div>
<dialog class="design-dialog" id="design-dialog" aria-labelledby="design-title">
  <div class="dialog-bar">
    <strong id="design-title">队服设计与下单</strong>
    <form method="dialog"><button type="submit">返回选款</button></form>
  </div>
  <iframe id="design-frame" title="队服设计与下单"></iframe>
</dialog>
<script src="./catalog-selection.js?v=1"></script>
<script>
  const dialog = document.getElementById('design-dialog');
  const frame = document.getElementById('design-frame');
  const dialogTitle = document.getElementById('design-title');
  let activeSelection = '';
  let opener;
  dialog.addEventListener('close', () => {
    document.body.classList.remove('design-open');
    opener?.focus();
  });
  function openDesign(selection, button) {
    const url = new URL('./design-order.html', location.href);
    url.search = new URLSearchParams({catalog: selection.catalog, page: selection.page, embedded: '1'});
    if (activeSelection && activeSelection !== url.href &&
      !confirm('切换到其他款式会清空上一款未下载的设计和订单，继续吗？')) return;
    if (activeSelection !== url.href) {
      frame.src = url.href;
      activeSelection = url.href;
    }
    opener = button;
    dialogTitle.textContent = '款号 ' + selection.code + ' · 设计与下单';
    dialog.showModal();
    document.body.classList.add('design-open');
  }
  for (const viewer of document.querySelectorAll('.viewer')) {
    let image = viewer.querySelector('img');
    const controls = viewer.querySelector('.controls');
    const [previous, next] = controls.querySelectorAll('button');
    const indicator = controls.querySelector('span');
    const total = Number(viewer.dataset.pages);
    const choose = viewer.querySelector('.choose-style');
    let page = 1;
    let requestedPage = 1;
    const images = new Map([[1, { image, ready: image.decode().then(() => image) }]]);
    choose.addEventListener('click', () => {
      const selected = catalogSelection(viewer.dataset.folder, page);
      if (selected) openDesign(selected, choose);
    });

    images.get(1).ready.catch(() => images.delete(1));

    function getPage(number, priority) {
      let entry = images.get(number);
      if (!entry) {
        const preview = new Image();
        preview.fetchPriority = priority;
        preview.alt = viewer.dataset.title + ' · 第 ' + number + ' 页';
        preview.src = './assets/catalogs/preview/' + viewer.dataset.folder + '/page-' + String(number).padStart(2, '0') + '.jpg?v=2';
        entry = { image: preview, ready: preview.decode().then(() => preview) };
        images.set(number, entry);
        entry.ready.catch(() => {
          if (images.get(number) === entry) images.delete(number);
        });
      }
      if (priority === 'high') entry.image.fetchPriority = priority;
      return entry.ready;
    }

    function preloadAround(direction) {
      for (const step of [1, 2, 3, -1]) {
        const number = page + direction * step;
        if (number >= 1 && number <= total) getPage(number, 'low').catch(() => {});
      }
      for (const number of images.keys()) {
        if (Math.abs(number - page) > 4 && number !== requestedPage) images.delete(number);
      }
    }

    async function turnPage(step) {
      const target = Math.max(1, Math.min(requestedPage + step, total));
      if (target === requestedPage) return;
      requestedPage = target;
      try {
        const readyImage = await getPage(target, 'high');
        if (requestedPage !== target) return;
        if (readyImage !== image) image.replaceWith(readyImage);
        image = readyImage;
        page = target;
        indicator.textContent = page + ' / ' + total;
        const selected = catalogSelection(viewer.dataset.folder, page);
        choose.hidden = !selected;
        if (selected) choose.textContent = '选款 ' + selected.code + ' · 开始设计';
        previous.disabled = page === 1;
        next.disabled = page === total;
        preloadAround(step);
      } catch {
        if (requestedPage !== target) return;
        requestedPage = page;
        indicator.textContent = '加载失败，请重试';
      }
    }

    function warmFirstPages() {
      if (requestedPage === 1) preloadAround(1);
    }
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(([entry]) => {
        if (!entry.isIntersecting) return;
        observer.disconnect();
        warmFirstPages();
      }, { rootMargin: '160px' });
      observer.observe(viewer);
    } else {
      warmFirstPages();
    }
    previous.addEventListener('click', () => turnPage(-1));
    next.addEventListener('click', () => turnPage(1));
    controls.hidden = false;
  }
</script>
</body>
</html>
