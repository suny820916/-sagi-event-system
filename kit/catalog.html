<style>
:root{--bg:#080808;--panel:#141414;--line:#2c2c2c;--text:#f5f1e8;--muted:#8e8e8e;--gold:#d8b55b;--red:#e11d2e;--green:#72c79a}
*{box-sizing:border-box}body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:1180px;margin:auto;padding:16px 12px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brandlink{display:inline-flex;align-items:center;text-decoration:none}.brandlink img{display:block;width:170px;height:auto}.brand-title{font-size:18px;font-weight:950;margin-top:8px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.topnav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.topnav a{color:#aaa;text-decoration:none;font-size:10px;font-weight:850;padding:7px 9px;border-radius:999px}.topnav a:hover,.topnav a.on{background:#171717;color:#f2dda1}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border-radius:12px;background:#292929;color:#fff;text-decoration:none;font-weight:850;border:0}.primary{background:linear-gradient(135deg,#bc9948,#e3c66e);color:#111}
.rule{background:#15120b;border:1px solid #65552b;border-radius:16px;padding:14px;line-height:1.7;font-size:12px;color:#d8cfb4}.rule b{color:#f2dda1}
.progress{margin:14px 0;background:#101010;border:1px solid var(--line);border-radius:16px;padding:12px}.bar{height:8px;background:#252525;border-radius:999px;overflow:hidden}.fill{height:100%;width:9.09%;background:linear-gradient(90deg,#bc9948,#e3c66e)}.ptext{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#999;margin-top:8px}
.toolbar{position:sticky;top:0;z-index:5;background:#080808e8;backdrop-filter:blur(12px);padding:8px 0}.search{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.preview{aspect-ratio:4/5;background:#0b0b0b;display:flex;align-items:center;justify-content:center;position:relative}.preview.demo{background-image:url("./assets/01-lion/sagi-demo-sprite.webp");background-size:300% 200%;background-position:0 0;background-repeat:no-repeat}.preview.demo01b{background-image:url("./assets/01b-lion-ii/sagi-01b-sprite.webp");background-size:300% 200%;background-position:0 0;background-repeat:no-repeat}.placeholder{padding:22px;text-align:center}.source{font-size:42px;font-weight:950;color:#333}.source small{display:block;font-size:11px;color:#656565;margin-top:6px}.body{padding:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-size:16px;font-weight:950}.code{font-size:11px;color:var(--gold);margin-top:3px}.status{font-size:10px;border-radius:999px;padding:5px 8px;font-weight:850;white-space:nowrap}.published{background:#143322;color:#91e9b7}.locked{background:#332d17;color:#e7ce79}.queued{background:#232323;color:#929292}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.pill{background:#0b0b0b;border:1px solid #292929;border-radius:10px;padding:8px;font-size:10px;color:#777}.pill b{display:block;color:#eee;font-size:12px;margin-top:2px}.colors{display:flex;gap:5px;margin-top:10px}.c{height:8px;flex:1;border-radius:99px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.disabled{opacity:.38;pointer-events:none}
.note{font-size:10px;color:#777;line-height:1.6;margin-top:9px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.top{align-items:flex-start}.brandlink img{width:150px}.topnav{max-width:55%}.grid{grid-template-columns:1fr}.app{padding-bottom:30px}}

@media(max-width:760px){
  .top{display:block!important}
  .brand,.brandmark,.brandlink,.brandlogo{display:inline-flex!important;max-width:100%!important}
  .brand img,.brandmark img,.brandlink img,.brandlogo img{width:150px!important;max-width:62vw!important;height:auto!important}
  .nav,.topnav{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important;max-width:none!important;width:100%!important;margin-top:14px!important;justify-content:stretch!important}
  .nav a,.topnav a{display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;white-space:nowrap!important;font-size:9px!important;padding:9px 4px!important;border:1px solid #262626!important;border-radius:10px!important;background:#101010!important}
  .nav a.on,.topnav a.on{border-color:#5a4d2e!important;background:#17140d!important;color:#f2dda1!important}
}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div><a class="brandlink" href="/"><img src="/assets/brand/sagi-official-logo.webp?v=20261121b" alt="SAGI FOOTBALL"></a><div class="brand-title">SAGI KIT · 足球队服定制</div><div class="sub">选款 · 配色 · 姓名号码 · 球队标识 · 定制需求</div></div><nav class="topnav"><a class="on" href="/kit/catalog.html">KIT</a><a href="/event/v23.html">EVENT</a><a href="/broadcast/">BROADCAST</a><a href="/about.html">ABOUT</a></nav></div>
 <div class="nav"><a class="btn primary" href="./customize.html">开始定制</a><a class="btn" href="./catalogs.html">原版画册</a><a class="btn" href="/">返回首页</a></div>
 <div class="rule"><b>为球队做一套真正属于自己的比赛服。</b> 先选择喜欢的款式与标准配色，再填写球队、姓名、号码与尺码需求；后续可继续接入 SAGI 订单系统与抖店成交。</div>
 <div class="toolbar"><input id="q" class="search" placeholder="搜索款式：狮头 / 斑马纹 / 城邦…"></div>
 <div id="grid" class="grid"></div>
</div>
<script>
const sw=[
"linear-gradient(90deg,#0d214d,#e11d2e,#d8b55b)",
"linear-gradient(90deg,#c81929,#f2f2ee,#d8b55b)",
"linear-gradient(90deg,#1649c8,#f2f2ee,#d8b55b)",
"linear-gradient(90deg,#572080,#f2f2ee,#d8b55b)",
"linear-gradient(90deg,#f2f2ee,#171717,#d8b55b)",
"linear-gradient(90deg,#f0d10b,#0a663c)"
];
const products=[
{code:"01A",name:"狮头系列一",url:"./product-01.html",preview:"demo"},
{code:"01B",name:"狮头系列二",url:"./product-01b.html",preview:"demo01b"}
];
function card(p){
 return `<div class="card" data-key="${p.code} ${p.name}">
   <div class="preview ${p.preview}"></div>
   <div class="body">
    <div class="row"><div><div class="name">${p.code} · ${p.name}</div><div class="code">SAGI KIT · TEAMWEAR</div></div><span class="status published">可定制</span></div>
    <div class="meta"><div class="pill">标准配色<b>6 套</b></div><div class="pill">支持定制<b>队徽 / 姓名 / 号码</b></div></div>
    <div class="colors">${sw.map(x=>`<span class="c" style="background:${x}"></span>`).join("")}</div>
    <div class="actions"><a class="btn" href="${p.url}">查看款式</a><a class="btn primary" href="./customize.html?kit=${encodeURIComponent(p.code)}">开始定制</a></div>
    <div class="note">选择款式后可继续填写球队名称、配色、姓名号码、尺码与数量。</div>
   </div>
 </div>`;
}
function render(){
 const q=document.getElementById("q").value.trim().toLowerCase();
 document.getElementById("grid").innerHTML=products.filter(p=>(p.code+" "+p.name).toLowerCase().includes(q)).map(card).join("");
}
document.getElementById("q").addEventListener("input",render);render();
</script>
</body></html>
