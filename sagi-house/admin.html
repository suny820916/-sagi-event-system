<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171716"><title>SAGI HOUSE 审核后台</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1b1a18;--muted:#77736c;--line:#e3dbcf;--green:#276b4c;--red:#a9473f;--gold:#b9914f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.wrap{max-width:760px;margin:auto;padding-bottom:40px}.top{background:#171716;color:#fff;padding:21px 15px;position:sticky;top:0;z-index:9}.top h1{font-size:21px;margin:0}.top small{color:#c7bda9}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.tabs button{border:1px solid #ffffff2d;color:#ddd;background:transparent;padding:9px;border-radius:11px}.tabs button.on{background:#fff;color:#171716;font-weight:800}.status{font-size:11px;margin-top:8px;color:#d4c9b3}.list{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.topline{display:flex;justify-content:space-between;gap:10px}.title{font-weight:850;font-size:16px}.badge{font-size:11px;border-radius:99px;padding:5px 8px;background:#eee6d7;color:#6f5d3e;height:max-content}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.price{font-size:20px;font-weight:900;color:#9e4f2c;margin-top:7px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}.owner{background:#f7f3eb;border-radius:11px;padding:10px;margin-top:9px;font-size:12px;line-height:1.7}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800}.approve{background:var(--green);color:#fff}.reject{background:#f2dfdc;color:#8c3732}.ghost{background:#eee9df;color:#514b42}.empty{background:#fff;border:1px dashed #d6ccbb;border-radius:17px;padding:28px;text-align:center;color:#777}.lead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}.lead b{display:block}.lead .contact{font-size:15px;font-weight:800;margin:6px 0}.lead a{display:inline-block;text-decoration:none;background:#171716;color:#fff;padding:8px 11px;border-radius:9px;font-size:12px}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:99}.toast.show{display:block}
</style></head><body><div class="wrap">
<header class="top"><h1>SAGI HOUSE · 审核后台</h1><small>V1.1 · OWNER PUBLISH</small><div class="tabs"><button class="on" data-tab="pending">待审核</button><button data-tab="approved">已上线</button><button data-tab="leads">客户线索</button></div><div id="cloudStatus" class="status">正在连接 SAGI CLOUD…</div></header>
<main id="list" class="list"></main>
</div><div id="toast" class="toast"></div>
<script>
const CLOUD='https://sagi-cloud-bridge-suny820916.onrender.com';let token='',tab='pending';const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}
async function activate(){const r=await fetch(CLOUD+'/api/activate',{method:'POST'}),o=await r.json().catch(()=>({}));if(!r.ok||!o.ok||!o.token)throw new Error(o.error||'云端激活失败');token=o.token;$('#cloudStatus').textContent='云端已连接 · '+o.version}
async function api(path,opt={}){opt.headers=Object.assign({'Authorization':'Bearer '+token},opt.headers||{});const r=await fetch(CLOUD+path,opt),o=await r.json().catch(()=>({}));if(!r.ok||!o.ok)throw new Error(o.error||('HTTP '+r.status));return o}
function card(a){const actions=tab==='pending'?'<div class="actions"><button class="approve" data-id="'+a.id+'" data-d="approved">审核通过</button><button class="reject" data-id="'+a.id+'" data-d="rejected">拒绝</button></div>':'<div class="actions"><button class="ghost" data-id="'+a.id+'" data-d="sold">标记已售</button><button class="ghost" data-id="'+a.id+'" data-d="rented">标记已租</button><button class="reject" data-id="'+a.id+'" data-d="archived">下架</button></div>';return '<article class="card"><div class="topline"><div><div class="title">'+esc(a.title)+'</div><div class="meta">'+esc(a.community)+' · '+esc(a.deal)+' · '+esc(a.propertyType)+(a.rooms?' · '+esc(a.rooms):'')+(a.area?' · '+esc(a.area)+'㎡':'')+'</div></div><span class="badge">'+(tab==='pending'?'待审核':'已上线')+'</span></div><div class="price">'+esc(a.price||'面议')+esc(a.priceUnit||'')+'</div>'+(a.photos&&a.photos.length?'<div class="photos">'+a.photos.slice(0,3).map(x=>'<img src="'+x+'">').join('')+'</div>':'')+'<div class="owner"><b>房东：</b>'+esc(a.ownerName||'')+'<br><b>电话：</b>'+esc(a.phone||'未填')+'<br><b>微信：</b>'+esc(a.wechat||'未填')+(a.description?'<br><b>描述：</b>'+esc(a.description):'')+'</div>'+actions+'</article>'}
async function load(){try{if(!token)await activate();$('#list').innerHTML='<div class="empty">正在读取…</div>';if(tab==='leads'){const o=await api('/api/house/leads');renderLeads(o.items||[]);return}const o=await api('/api/house/inbox?status='+tab),items=o.items||[];$('#list').innerHTML=items.length?items.map(card).join(''):'<div class="empty">'+(tab==='pending'?'暂时没有待审核房源':'暂时没有已上线房源')+'</div>';$('#list').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>decision(b.dataset.id,b.dataset.d))}catch(e){$('#cloudStatus').textContent='云端连接失败：'+e.message;$('#list').innerHTML='<div class="empty">后台暂不可用，请稍后刷新。</div>'}}
function renderLeads(items){$('#list').innerHTML=items.length?items.map(x=>'<div class="lead"><b>'+esc(x.listingTitle||'房源咨询')+'</b><div class="meta">'+new Date(x.createdAt).toLocaleString()+'</div><div class="contact">'+esc(x.name||'客户')+' · '+esc(x.contact)+'</div>'+(x.note?'<div class="meta">'+esc(x.note)+'</div>':'')+'<div style="margin-top:8px"><a href="tel:'+esc(x.contact)+'">拨打 / 联系</a></div></div>').join(''):'<div class="empty">暂时没有客户线索</div>'}
async function decision(id,d){try{await api('/api/house/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,decision:d})});toast(d==='approved'?'房源已上线':'状态已更新');load()}catch(e){toast(e.message)}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;load()});load();
</script></body></html>
