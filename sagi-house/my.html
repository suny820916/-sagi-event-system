<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171716">
<title>我的房源｜SAGI HOUSE</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1b1a18;--muted:#77736c;--line:#e3dbcf;--green:#276b4c;--red:#a9473f;--gold:#b9914f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.wrap{max-width:720px;margin:auto;padding-bottom:40px}.top{background:#171716;color:#fff;padding:20px 15px;position:sticky;top:0;z-index:8}.top a{color:#d9c9a7;text-decoration:none;font-size:13px}.top h1{font-size:22px;margin:8px 0 3px}.top p{margin:0;color:#bbb;font-size:12px}.panel,.card{background:#fff;margin:14px;border:1px solid var(--line);border-radius:18px;padding:14px}.panel h2{margin:0 0 5px;font-size:18px}.muted{font-size:12px;color:var(--muted);line-height:1.6}.tokenBox{display:flex;gap:7px;margin-top:10px}.tokenBox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;background:#faf9f6}.tokenBox button,.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800}.dark{background:#171716;color:#fff}.ghost{background:#eee9df;color:#4f4941}.danger{background:#f2dfdc;color:#8c3732}.good{background:var(--green);color:#fff}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f6f2ea;padding:10px;border-radius:10px;word-break:break-all;font-size:12px;margin-top:8px}.list{margin-top:8px}.card{margin-top:10px}.topline{display:flex;justify-content:space-between;gap:10px}.title{font-weight:850;font-size:16px}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#eee6d7;color:#6f5d3e;height:max-content}.meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}.price{font-size:22px;font-weight:900;color:#9e4f2c;margin-top:7px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:100px}.empty{text-align:center;background:#fff;border:1px dashed #d5c9b7;border-radius:17px;padding:28px 18px;color:#777;margin:14px}.empty a{display:inline-block;margin-top:12px;background:#171716;color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:93vh;overflow:auto;background:#f8f5ef;border-radius:24px 24px 0 0;padding:16px 15px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.close{float:right;border:0;background:#171716;color:#fff;border-radius:50%;width:34px;height:34px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #dcd4c7;background:#fff;border-radius:11px;padding:11px}.field textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editPhotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pic{position:relative}.pic img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px}.pic button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;width:25px;height:25px;background:#111c;color:#fff}.save{width:100%;border:0;background:#171716;color:#fff;border-radius:12px;padding:13px;font-weight:850}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:99}.toast.show{display:block}
</style></head><body><div class="wrap">
<header class="top"><a href="./owner.html">‹ 返回发布房源</a><h1>我的房源</h1><p>SAGI HOUSE V1.3 · OWNER CENTER</p></header>
<section class="panel">
<h2>房东管理码</h2><div class="muted">本机发布房源后会自动保存。换手机时，把原管理码粘贴到这里即可恢复全部房源。</div>
<div id="savedCode" class="code"></div>
<div class="tokenBox"><input id="tokenInput" placeholder="输入房东管理码"><button id="useToken" class="dark">使用</button></div>
</section>
<div id="list" class="list"></div>
</div>

<div id="modal" class="modal"><div class="sheet"><button id="close" class="close">×</button><h2>编辑房源</h2>
<div class="row"><div class="field"><label>价格</label><input id="ePrice" inputmode="decimal"></div><div class="field"><label>单位</label><select id="eUnit"><option>万</option><option>万元</option><option>元/月</option><option>元/年</option><option>面议</option></select></div></div>
<div class="row"><div class="field"><label>户型</label><input id="eRooms"></div><div class="field"><label>面积㎡</label><input id="eArea" inputmode="decimal"></div></div>
<div class="field"><label>楼层</label><input id="eFloor"></div>
<div class="field"><label>卖点标签</label><input id="eTags" placeholder="急售, 精装修, 房东直售"></div>
<div class="field"><label>房源描述</label><textarea id="eDesc"></textarea></div>
<div class="field"><label>补照片（最多保留6张）</label><input id="ePhotos" type="file" accept="image/*" multiple><div id="editPhotos" class="editPhotos"></div></div>
<button id="save" class="save">保存修改</button>
</div></div>
<div id="toast" class="toast"></div>

<script>
const CLOUD='https://sagi-cloud-bridge-suny820916.onrender.com',KEY='sagiHouseOwnerTokenV130';let token=localStorage.getItem(KEY)||'',items=[],editing=null,editPhotos=[];
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),1800)}
function label(s){return({pending:'待审核',approved:'已上线',rejected:'未通过',sold:'已售',rented:'已租',archived:'已下架'})[s]||s||'未知'}
function showCode(){$('#savedCode').textContent=token||'本机还没有管理码';$('#tokenInput').value=token}
async function api(path,body){const r=await fetch(CLOUD+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}),o=await r.json().catch(()=>({}));if(!r.ok||!o.ok)throw new Error(o.error||('HTTP '+r.status));return o}
async function load(){showCode();if(!token){$('#list').innerHTML='<div class="empty">还没有房东管理码。<br><a href="./owner.html">先发布一套房源</a></div>';return}$('#list').innerHTML='<div class="empty">正在读取我的房源…</div>';try{const o=await api('/api/house/owner/list',{ownerToken:token});items=o.items||[];render()}catch(e){$('#list').innerHTML='<div class="empty">无法读取房源：'+esc(e.message)+'</div>'}}
function render(){if(!items.length){$('#list').innerHTML='<div class="empty">这个管理码下还没有房源。<br><a href="./owner.html">发布房源</a></div>';return}$('#list').innerHTML=items.map(a=>'<article class="card"><div class="topline"><div><div class="title">'+esc(a.title)+'</div><div class="meta">'+esc(a.community)+' · '+esc(a.deal)+' · '+esc(a.propertyType)+(a.rooms?' · '+esc(a.rooms):'')+(a.area?' · '+esc(a.area)+'㎡':'')+'</div></div><span class="badge">'+esc(label(a.status))+'</span></div><div class="price">'+esc(a.price||'面议')+esc(a.priceUnit||'')+'</div>'+(a.photos&&a.photos.length?'<div class="photos">'+a.photos.slice(0,3).map(x=>'<img src="'+x+'">').join('')+'</div>':'')+'<div class="actions"><button class="btn dark" data-edit="'+a.id+'">修改房源</button>'+(a.deal==='出租'?'<button class="btn good" data-status="'+a.id+'" data-s="rented">已租</button>':'<button class="btn good" data-status="'+a.id+'" data-s="sold">已售</button>')+'<button class="btn danger" data-status="'+a.id+'" data-s="archived">下架</button></div></article>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.status,b.dataset.s))}
function openEdit(id){const a=items.find(x=>x.id===id);if(!a)return;editing=a;editPhotos=[...(a.photos||[])];$('#ePrice').value=a.price||'';$('#eUnit').value=a.priceUnit||'万';$('#eRooms').value=a.rooms||'';$('#eArea').value=a.area||'';$('#eFloor').value=a.floor||'';$('#eTags').value=(a.tags||[]).join(', ');$('#eDesc').value=a.description||'';renderEditPhotos();$('#modal').classList.add('show')}
function renderEditPhotos(){$('#editPhotos').innerHTML=editPhotos.map((x,i)=>'<div class="pic"><img src="'+x+'"><button data-del="'+i+'">×</button></div>').join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{editPhotos.splice(Number(b.dataset.del),1);renderEditPhotos()})}
async function compress(file){const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>rej(new Error('照片读取失败'));im.src=u});const max=760,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>470000&&q>.35){q-=.07;d=c.toDataURL('image/jpeg',q)}if(d.length>510000)throw new Error('照片太大，请换一张');return d}
$('#ePhotos').onchange=async e=>{for(const f of [...(e.target.files||[])]){if(editPhotos.length>=6)break;try{editPhotos.push(await compress(f))}catch(err){toast(err.message)}}renderEditPhotos();e.target.value=''};
$('#save').onclick=async()=>{if(!editing)return;const b=$('#save');b.disabled=true;b.textContent='正在保存…';try{await api('/api/house/owner/update',{ownerToken:token,id:editing.id,price:$('#ePrice').value.trim(),priceUnit:$('#eUnit').value,rooms:$('#eRooms').value.trim(),area:$('#eArea').value.trim(),floor:$('#eFloor').value.trim(),tags:$('#eTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),description:$('#eDesc').value.trim(),photos:editPhotos});toast('房源已更新');$('#modal').classList.remove('show');await load()}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='保存修改'}};
async function setStatus(id,status){const text=status==='sold'?'确认标记为已售？':status==='rented'?'确认标记为已租？':'确认下架这套房源？';if(!confirm(text))return;try{await api('/api/house/owner/status',{ownerToken:token,id,status});toast('状态已更新');await load()}catch(e){toast(e.message)}}
$('#useToken').onclick=()=>{const v=$('#tokenInput').value.trim();if(v.length<12)return toast('管理码不正确');token=v;localStorage.setItem(KEY,token);load()};
$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};showCode();load();
</script></body></html>
