<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#07090c;transform-origin:0 0}.stadium{position:absolute;inset:0;background:radial-gradient(circle at 50% 0,#6f8294 0,#263442 18%,#111820 42%,#06080b 74%)}.stadium:before{content:"";position:absolute;left:-5%;right:-5%;top:165px;height:300px;background:linear-gradient(#19212a,#0b1016 68%,transparent),repeating-linear-gradient(90deg,#ffffff08 0 7px,transparent 7px 22px);clip-path:polygon(0 0,100% 0,92% 100%,8% 100%)}.stadium:after{content:"";position:absolute;left:0;right:0;bottom:-35px;height:430px;background:linear-gradient(180deg,#173421,#0a2716 70%,#05130a);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.stadiumPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#030508e6 0,#05070a99 38%,#05070a55 58%,#030508c9 100%),linear-gradient(0deg,#040609c7 0,transparent 55%,#03050775 100%)}.pitchLines{position:absolute;left:320px;right:320px;bottom:0;height:360px;opacity:.22;transform:perspective(800px) rotateX(62deg);transform-origin:bottom;border:5px solid #fff;border-bottom:0}.pitchLines:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px solid #fff}.pitchLines:after{content:"";position:absolute;width:170px;height:170px;border:4px solid #fff;border-radius:50%;left:50%;top:45%;transform:translate(-50%,-50%)}.light{position:absolute;width:760px;height:760px;border-radius:50%;filter:blur(100px);opacity:.22}.l1{left:-180px;top:-330px;background:#5cb4ff}.l2{right:-220px;top:-300px;background:#d7b051}.header{position:absolute;left:95px;top:72px;display:flex;align-items:center;gap:24px}.crest{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 12px 20px #0009)}.team{font-size:34px;font-weight:950;letter-spacing:2px;color:#fff}.sub{font-size:17px;color:#d8b55b;letter-spacing:5px;margin-top:7px;font-weight:850}.groupTitle{position:absolute;left:100px;top:205px;font-size:28px;letter-spacing:7px;color:#d8b55b;font-weight:900}.groupName{position:absolute;left:95px;top:245px;font-size:72px;line-height:1;font-weight:1000;letter-spacing:-2px;color:#fff}.line{position:absolute;left:98px;top:330px;width:400px;height:5px;background:linear-gradient(90deg,#d8b55b,#fff1b7)}.players{position:absolute;left:70px;top:350px;width:1240px;height:650px;display:flex;align-items:flex-end;justify-content:center;gap:18px}.card{position:relative;width:230px;height:570px;flex:0 0 auto}.card.one{width:520px}.cut{position:absolute;left:0;right:0;bottom:82px;height:490px;display:flex;align-items:flex-end;justify-content:center}.cut img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 20px 25px #000d)}.fallback{width:84%;height:86%;border-radius:34px;background:linear-gradient(160deg,#222c38,#0c1118);display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:1000;color:#ffffff24;border:1px solid #ffffff10}.label{position:absolute;left:0;right:0;bottom:0;text-align:center}.no{font-size:34px;color:#d8b55b;font-weight:1000}.name{font-size:22px;font-weight:950;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:12px;color:#9ba4b1;letter-spacing:3px;margin-top:5px}.formation{position:absolute;right:78px;top:175px;width:500px;height:760px;border:1px solid #ffffff20;border-radius:32px;background:#05080cc7;padding:28px}.formationHead{display:flex;justify-content:space-between}.formationTitle{font-size:25px;font-weight:950;color:#fff}.formationText{font-size:42px;color:#d8b55b;font-weight:1000}.pitch{position:absolute;left:34px;right:34px;top:120px;bottom:34px;border:3px solid #ffffff50;background:linear-gradient(#123d25,#0e321e);overflow:hidden}.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff55}.pitch:after{content:"";position:absolute;width:115px;height:115px;border:2px solid #ffffff55;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.boxTop,.boxBottom{position:absolute;left:50%;width:220px;height:90px;transform:translateX(-50%);border:2px solid #ffffff55}.boxTop{top:-2px}.boxBottom{bottom:-2px}.nodes{position:absolute;inset:0}.node{position:absolute;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:#161e28;border:2px solid #ffffff75;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:15px;color:#fff}.node.active{background:#d8b55b;color:#111;border-color:#fff3b8;box-shadow:0 0 0 8px #d8b55b22}.node small{position:absolute;top:58px;font-size:9px;color:#cbd1d9;white-space:nowrap;max-width:86px;overflow:hidden;text-overflow:ellipsis}.fullList{position:absolute;left:95px;top:355px;width:1130px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px}.fullRow{display:grid;grid-template-columns:54px 56px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #ffffff12;padding:8px 4px;color:#fff}.fullRole{font-size:12px;color:#d8b55b;font-weight:900}.fullNo{font-size:25px;font-weight:1000}.fullName{font-size:22px;font-weight:900}.fullPos{font-size:11px;color:#98a1ad}

.captainBadge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:#d8b55b;color:#111;font-size:14px;font-weight:1000;margin-left:7px;vertical-align:middle}
.statPill{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:6px 10px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff1b;color:#d8b55b;font-size:11px;font-weight:900;letter-spacing:1px}
.subList{position:absolute;left:95px;top:355px;width:1130px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px}
.subRow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #ffffff12;padding:10px 5px;color:#fff}
.subNo{font-size:24px;font-weight:1000;color:#d8b55b}.subName{font-size:21px;font-weight:900}.subStat{font-size:11px;color:#aab2be}
.captainNode:after{content:'C';position:absolute;right:-6px;top:-7px;width:19px;height:19px;border-radius:50%;background:#fff1b7;color:#111;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:1000}
</style></head>
<body>
<div id="stage" class="stage">
  <div id="stadium" class="stadium"></div><img id="stadiumPhoto" class="stadiumPhoto"><div id="shade" class="shade"></div><div id="pitchLines" class="pitchLines"></div><div class="light l1"></div><div class="light l2"></div>
  <div class="header"><img id="crest" class="crest"><div><div id="team" class="team">TEAM</div><div class="sub">STARTING XI</div></div></div>
  <div id="groupTitle" class="groupTitle">STARTING XI</div><div id="groupName" class="groupName">TEAM LINEUP</div><div class="line"></div>
  <div id="players" class="players"></div><div id="fullList" class="fullList" style="display:none"></div><div id="subList" class="subList" style="display:none"></div>
  <div class="formation"><div class="formationHead"><div><div class="formationTitle">FORMATION</div><div style="font-size:12px;color:#8f97a5">LIVE LINEUP</div></div><div id="formationText" class="formationText">4-3-3</div></div><div class="pitch"><div class="boxTop"></div><div class="boxBottom"></div><div id="nodes" class="nodes"></div></div></div>
</div>
<script src="../cloud-config.js"></script><script src="../sagi-cloud.js"></script>
<script>
(function(){
'use strict';
const q=id=>document.getElementById(id),ROLE_NAMES={GK:'GOALKEEPER',DF:'DEFENDERS',MF:'MIDFIELDERS',FW:'FORWARDS'};
const FORMATIONS={
 '4-3-3':{GK:[[50,91]],DF:[[16,73],[38,72],[62,72],[84,73]],MF:[[24,48],[50,52],[76,48]],FW:[[18,22],[50,18],[82,22]]},
 '4-4-2':{GK:[[50,91]],DF:[[16,73],[38,72],[62,72],[84,73]],MF:[[16,48],[38,50],[62,50],[84,48]],FW:[[35,22],[65,22]]},
 '4-2-3-1':{GK:[[50,91]],DF:[[16,74],[38,72],[62,72],[84,74]],MF:[[36,56],[64,56],[18,38],[50,36],[82,38]],FW:[[50,18]]},
 '3-5-2':{GK:[[50,91]],DF:[[25,72],[50,75],[75,72]],MF:[[12,48],[32,54],[50,42],[68,54],[88,48]],FW:[[35,22],[65,22]]},
 '3-4-3':{GK:[[50,91]],DF:[[25,72],[50,75],[75,72]],MF:[[16,49],[38,52],[62,52],[84,49]],FW:[[18,22],[50,18],[82,22]]},
 '5-3-2':{GK:[[50,91]],DF:[[10,72],[30,75],[50,73],[70,75],[90,72]],MF:[[25,48],[50,52],[75,48]],FW:[[35,22],[65,22]]}
};
let last='',hideTimer=null,current=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),x=(innerWidth-1920*s)/2,y=(innerHeight-1080*s)/2;q('stage').style.transform='translate3d('+x+'px,'+y+'px,0) scale('+s+')'}
function fallback(role,i,n){const y={GK:91,DF:72,MF:48,FW:22}[role]||50;return[((i+1)/(n+1))*100,y]}
function allPoints(x){const form=FORMATIONS[x.formation]||FORMATIONS['4-3-3'],out=[];for(const role of ['GK','DF','MF','FW']){const ps=form[role]||[],arr=(x.allPlayers||[]).filter(p=>p.role===role);arr.forEach((p,i)=>out.push({p,role,xy:ps[i]||fallback(role,i,arr.length)}))}return out}
function renderNodes(x){q('formationText').textContent=x.formation||'4-3-3';q('nodes').innerHTML='';allPoints(x).forEach(({p,role,xy})=>{const d=document.createElement('div');d.className='node'+((x.group==='FULL'||x.group===role)?' active':'')+(p.captain?' captainNode':'');d.style.left=xy[0]+'%';d.style.top=xy[1]+'%';d.innerHTML='<span>'+esc(p.number)+'</span><small>'+esc(p.name)+'</small>';q('nodes').appendChild(d)})}
function card(p,n){return '<div class="card'+(n===1?' one':'')+'"><div class="cut">'+(p.photo?'<img src="'+p.photo+'">':'<div class="fallback">'+esc(p.number)+'</div>')+'</div><div class="label"><div class="no">#'+esc(p.number)+(p.captain?'<span class="captainBadge">C</span>':'')+'</div><div class="name">'+esc(p.name)+'</div><div class="role">'+esc(p.position||p.role)+'</div>'+(p.statValue?'<div class="statPill">'+esc(p.statLabel)+' <strong>'+esc(p.statValue)+'</strong></div>':'')+'</div></div>'}
function applyBg(x){q('stadiumPhoto').src=x.stadium||'';q('crest').src=x.crest||'';q('crest').style.visibility=x.crest?'visible':'hidden';const mode=x.background||'stadium';if(mode==='transparent'){q('stage').style.background='transparent';q('stadium').style.display='none';q('stadiumPhoto').style.display='none';q('shade').style.display='none';q('pitchLines').style.display='none'}else if(mode==='chroma'){q('stage').style.background='#00b140';q('stadium').style.display='none';q('stadiumPhoto').style.display='none';q('shade').style.display='none';q('pitchLines').style.display='none'}else{q('stage').style.background='#07090c';q('stadium').style.display='block';q('stadiumPhoto').style.display=x.stadium?'block':'none';q('shade').style.display='block';q('pitchLines').style.display='block'}}
function render(x){
 current=x;q('team').textContent=x.team||'TEAM';applyBg(x);q('fullList').style.display='none';q('subList').style.display='none';q('players').style.display='flex';
 if(x.group==='TEAM'){q('groupTitle').textContent='SAGI BROADCAST';q('groupName').textContent=(x.team||'TEAM')+' · '+(x.formation||'');q('players').innerHTML='<div style="align-self:center;text-align:center;color:#ffffff45;font-weight:1000;font-size:150px;letter-spacing:12px">'+esc(x.formation||'')+'</div>'}
 else if(x.group==='FULL'){q('groupTitle').textContent='STARTING XI';q('groupName').textContent='FULL LINEUP';q('players').style.display='none';q('fullList').style.display='grid';q('fullList').innerHTML=(x.allPlayers||[]).map(p=>'<div class="fullRow"><div class="fullRole">'+esc(p.role)+'</div><div class="fullNo">'+esc(p.number)+'</div><div class="fullName">'+esc(p.name)+(p.captain?' <span class="captainBadge">C</span>':'')+'</div><div class="fullPos">'+esc(p.position)+(p.statValue?' · '+esc(p.statLabel)+' '+esc(p.statValue):'')+'</div></div>').join('')} else if(x.group==='SUB'){q('groupTitle').textContent='SQUAD';q('groupName').textContent='SUBSTITUTES';q('players').style.display='none';q('subList').style.display='grid';const subs=x.substitutes||x.players||[];q('subList').innerHTML=subs.length?subs.map(p=>'<div class="subRow"><div class="subNo">#'+esc(p.number)+'</div><div><div class="subName">'+esc(p.name)+'</div><div class="subStat">'+esc(p.role)+' · '+esc(p.position)+'</div></div><div class="subStat">'+(p.statValue?esc(p.statLabel)+' '+esc(p.statValue):'SUB')+'</div></div>').join(''):'<div class="subStat">NO SUBSTITUTES</div>'}
 else{q('groupTitle').textContent='STARTING XI';q('groupName').textContent=ROLE_NAMES[x.group]||x.group;q('players').innerHTML=(x.players||[]).map(p=>card(p,(x.players||[]).length)).join('')}
 renderNodes(x);animate(x)
}
function animate(x){const els=[...q('stage').querySelectorAll('.card,.fullRow,.subRow,.node.active')];els.forEach((el,i)=>{if(!el.animate)return;const isNode=el.classList.contains('node');el.animate(isNode?[{opacity:0,transform:'translate(-50%,-50%) scale(.25)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.18)',offset:.72},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}]:[{opacity:0,transform:'translateY(35px) scale(.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:isNode?620:520,delay:i*(isNode?95:80),fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'})});const title=q('groupName');if(title.animate)title.animate([{opacity:0,transform:'translateX(-55px)'},{opacity:1,transform:'translateX(0)'}],{duration:560,fill:'forwards',easing:'ease-out'});clearTimeout(hideTimer);hideTimer=setTimeout(()=>{},Math.max(1000,+x.duration||4000))}
async function poll(){const cfg=window.SAGI_CLOUD||{};if(!window.SagiCloud||!cfg.url||!cfg.key||!cfg.eventSlug)return;try{const r=await window.SagiCloud.getEvent(cfg.eventSlug,cfg),x=r&&r.payload&&r.payload.lineupIntro;if(x&&x.commandId&&x.commandId!==last){last=x.commandId;render(x)}}catch(e){}}
addEventListener('resize',fit);fit();poll();setInterval(poll,650);
})();
</script></body></html>
