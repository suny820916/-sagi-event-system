<body>
<div class="app">

</div><div id="eventLogo" class="logo" style="margin-top:9px">EVENT LOGO</div></div>

<div class="card"><div class="title">主客队与名单 · SMART ROSTER</div>

<div class="actions"><button id="parse">识别粘贴名单</button><label class="file gold">照片 / 文件导入<input id="file" type="file" accept="image/*,.xlsx,.xls,.docx,.pdf,.csv,.tsv,.txt"></label><button id="auto">自动排首发</button><button id="add">+ 添加球员</button></div><div id="status" class="status">等待导入。</div></div>

</div>

<div class="sticky"><div class="si"><button id="new">新建比赛</button><button id="save" class="gold">保存到赛前云端</button></div></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const CLOUD='https://sagi-cloud-bridge-suny820916.onrender.com',q=id=>document.getElementById(id);
const F={5:['1-2-1','2-1-1','2-2'],7:['2-3-1','3-2-1','2-2-2'],8:['2-3-2','3-2-2','3-3-1'],9:['3-3-2','3-2-3','2-3-3','4-2-2'],11:['4-3-3','4-4-2','4-2-3-1','3-5-2','3-4-3','5-3-2']};
const SHOW=[['sting','STING','Logo Sting',2000,'FLASH','STING'],['match','MATCH','比赛信息',3000,'FADE','RISER'],['countdown','COUNTDOWN','开场倒计时',5000,'ZOOM','HIT'],['home_team','TEAM','主队开场',2500,'FADE','RISER','HOME'],['home_gk','GK','主队门将',3000,'ZOOM','HIT','HOME'],['home_df','DF','主队后卫',4000,'SLIDE','WHOOSH','HOME'],['home_mf','MF','主队中场',4000,'SLIDE','WHOOSH','HOME'],['home_fw','FW','主队前锋',4000,'FLASH','HIT','HOME'],['home_full','FULL','主队完整首发',6000,'ZOOM','CROWD','HOME'],['home_sub','SUB','主队替补名单',5000,'SLIDE','WHOOSH','HOME'],['away_team','TEAM','客队开场',2500,'FADE','RISER','AWAY'],['away_gk','GK','客队门将',3000,'ZOOM','HIT','AWAY'],['away_df','DF','客队后卫',4000,'SLIDE','WHOOSH','AWAY'],['away_mf','MF','客队中场',4000,'SLIDE','WHOOSH','AWAY'],['away_fw','FW','客队前锋',4000,'FLASH','HIT','AWAY'],['away_full','FULL','客队完整首发',6000,'ZOOM','CROWD','AWAY'],['away_sub','SUB','客队替补名单',5000,'SLIDE','WHOOSH','AWAY']].map(x=>({id:x[0],group:x[1],label:x[2],duration:x[3],transition:x[4],cue:x[5],side:x[6],enabled:true}));
let side='HOME',id='',projects=[],m={HOME:{name:'',formation:'4-3-3',crest:'',roster:[]},AWAY:{name:'',formation:'4-3-3',crest:'',roster:[]},eventLogo:''};
const uid=()=>('p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)),esc=s=>String(s??'').replace(/[&<>"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]));
function toast(t){q('toast').textContent=t;q('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>q('toast').classList.remove('on'),2200)}
function cs(t,k='work'){q('cloud').className='cloud '+k;q('cloudText').textContent=t}function st(t,k=''){q('status').className='status'+(k?' '+k:'');q('status').textContent=t}
const n=()=>Math.max(3,Math.min(15,+q('count').value||11)),df=()=>((F[n()]||[])[0]||String(n()-1));
function formations(){const a=F[n()]||[df()],old=m[side].formation;q('formation').innerHTML=a.map(x=>'<option>'+x+'</option>').join('');m[side].formation=a.includes(old)?old:a[0];q('formation').value=m[side].formation}
function stash(){m[side].name=q('teamName').value.trim();m[side].formation=q('formation').value||df()}
function switchSide(s){stash();side=s;q('home').classList.toggle('on',s==='HOME');q('away').classList.toggle('on',s==='AWAY');q('teamLabel').textContent=s==='HOME'?'主队名称':'客队名称';q('teamName').value=m[s].name||'';formations();renderCrest();renderRoster()}
function renderCrest(){q('crest').innerHTML=m[side].crest?'<img src="'+m[side].crest+'">':'队徽'}function renderLogo(){q('eventLogo').innerHTML=m.eventLogo?'<img src="'+m.eventLogo+'">':'EVENT LOGO'}
function renderRoster(){const r=m[side].roster,b=q('body');b.innerHTML='';r.forEach((p,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td><input data-k="number" data-i="'+i+'" value="'+esc(p.number)+'"></td><td><input data-k="name" data-i="'+i+'" value="'+esc(p.name)+'"></td><td><select data-k="squadType" data-i="'+i+'"><option value="STARTER" '+(p.squadType==='STARTER'?'selected':'')+'>首发</option><option value="SUB" '+(p.squadType==='SUB'?'selected':'')+'>替补</option></select></td><td><select data-k="role" data-i="'+i+'">'+['GK','DF','MF','FW'].map(x=>'<option '+(p.role===x?'selected':'')+'>'+x+'</option>').join('')+'</select></td><td><input data-k="position" data-i="'+i+'" value="'+esc(p.position||p.role)+'"></td><td><select data-k="captain" data-i="'+i+'"><option value="0" '+(!p.captain?'selected':'')+'>否</option><option value="1" '+(p.captain?'selected':'')+'>C</option></select></td><td><button class="del" data-d="'+i+'">删除</button></td>';b.appendChild(tr)});b.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{const p=r[+e.dataset.i],k=e.dataset.k;p[k]=k==='captain'?e.value==='1':e.value;draft()});b.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{r.splice(+e.dataset.d,1);renderRoster();draft()});const s=r.filter(x=>x.squadType==='STARTER').length;q('rosterCount').value=r.length+' 人';q('summary').textContent='共 '+r.length+' 人 · 首发 '+s+' · 替补 '+(r.length-s)}
function clean(s){return String(s??'').replace(/[\u200b\ufeff]/g,'').replace(/\s+/g,' ').trim()}function role(s=''){const x=String(s).toUpperCase();if(/门将|守门|GK|GOAL/.test(x))return'GK';if(/后卫|DF|CB|LB|RB|BACK/.test(x))return'DF';if(/中场|MF|CM|DM|AM|MID/.test(x))return'MF';if(/前锋|边锋|FW|ST|CF|LW|RW|FORWARD/.test(x))return'FW';return''}
function pos(s='',r=''){const x=String(s).toUpperCase();for(const t of ['GK','CB','LB','RB','DM','CDM','CM','CAM','AM','LM','RM','LW','RW','ST','CF','FW','DF','MF'])if(new RegExp('(^|[^A-Z])'+t+'([^A-Z]|$)').test(x))return t;return r||''}
function parseLine(line,i){let a=clean(line);if(!a)return null;a=a.replace(/[，；;|]+/g,'\t');let c=a.split(/\t+|\s{2,}/).map(clean).filter(Boolean);if(c.length<2)c=a.split(/\s+/).map(clean).filter(Boolean);let no='',name='',rest=[...c],ix=rest.findIndex(x=>/^#?\d{1,3}$/.test(x));if(ix>=0){no=rest[ix].replace('#','');rest.splice(ix,1)}ix=rest.findIndex(x=>/[\u3400-\u9fffA-Za-z\u0400-\u04ff]/.test(x)&&!/姓名|球员|号码|位置|首发|替补/i.test(x));if(ix>=0){name=rest[ix];rest.splice(ix,1)}if(!name)return null;const meta=rest.join(' '),r=role(meta);return{id:uid(),number:no||String(i+1),name,role:r,position:pos(meta,r),squadType:/替补|SUB|BENCH/i.test(meta)?'SUB':'',captain:/队长|CAPTAIN|\(C\)|（C）/i.test(a)}}
function parseText(t){const out=[];String(t).replace(/\r/g,'\n').split(/\n+/).forEach(x=>{const p=parseLine(x,out.length);if(p)out.push(p)});return out}
function plan(){const p=String(q('formation').value).split('-').map(Number),out=['GK'];if(p.length>1){for(let i=0;i<(p[0]||0);i++)out.push('DF');for(let i=0;i<p.slice(1,-1).reduce((a,b)=>a+b,0);i++)out.push('MF');for(let i=0;i<(p[p.length-1]||0);i++)out.push('FW')}while(out.length<n())out.push('MF');return out}
function arrange(){const a=plan(),r=m[side].roster;r.forEach((p,i)=>{p.squadType=i<n()?'STARTER':'SUB';if(!p.role)p.role=a[i]||'MF';if(!p.position)p.position=p.role});renderRoster();draft()}
function addRows(rows){const r=m[side].roster,seen=new Set(r.map(p=>(p.number+'|'+p.name).toLowerCase()));let k=0;rows.forEach(p=>{const x=(p.number+'|'+p.name).toLowerCase();if(!seen.has(x)){r.push(p);seen.add(x);k++}});arrange();st('已导入 '+k+' 人','ok')}
async function lib(src,g){if(window[g])return window[g];return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res(window[g]);s.onerror=()=>rej(new Error('模块下载失败'));document.head.appendChild(s)})}
const ext=f=>((f.name.toLowerCase().match(/\.([a-z0-9]+)$/)||[])[1]||'');
async function fileRows(f){const e=ext(f);if(f.type.startsWith('image/')){st('正在识别照片…','work');await lib('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','Tesseract');const w=await Tesseract.createWorker('chi_sim+eng');try{return parseText((await w.recognize(f)).data.text||'')}finally{await w.terminate()}}if(['xlsx','xls'].includes(e)){st('正在读取 Excel…','work');await lib('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js','XLSX');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),sh=wb.Sheets[wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:''});return parseText(a.map(x=>x.join('\t')).join('\n'))}if(e==='docx'){st('正在读取 Word…','work');await lib('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.13.0/mammoth.browser.min.js','mammoth');return parseText((await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value||'')}if(e==='pdf'){st('正在读取 PDF…','work');const pdf=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.min.mjs');pdf.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.worker.min.mjs';const d=await pdf.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let t='';for(let i=1;i<=d.numPages;i++){const p=await d.getPage(i),x=await p.getTextContent();t+='\n'+x.items.map(y=>y.str).join(' ')}return parseText(t)}return parseText(await f.text())}
function imgData(f,max=520){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onload=()=>{const z=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*z));c.height=Math.max(1,Math.round(im.height*z));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.78))};im.onerror=()=>res(fr.result);im.src=fr.result};fr.readAsDataURL(f)})}
function player(p){return{id:p.id||uid(),name:p.name||'PLAYER',number:p.number||'00',squadType:p.squadType||'SUB',role:p.role||'MF',position:p.position||p.role||'MF',captain:!!p.captain,statLabel:'',statValue:'',mediaUrl:'',mediaAction:'STANDARD',directorIn:0,directorOut:0,directorSpeed:1,directorFreeze:false,directorFreezeMs:1000,directorCamera:'MEDIUM'}}
function project(){stash();const c=n(),pack={matchFormat:{mode:String(c),playerCount:c},competition:q('competition').value.trim()||'MATCH',round:q('round').value.trim(),home:m.HOME.name||'HOME',away:m.AWAY.name||'AWAY',kickoff:q('kickoff').value,venue:q('venue').value,eventLogo:m.eventLogo||'',musicUrl:'',musicVolume:.65,audioEngine:{mode:'HYBRID',theme:'SAGI_PULSE',intensity:.75,ducking:.35,cueVolume:1,countdownBeat:true},sfx:{}};let name=q('projectName').value.trim()||pack.competition+' · '+pack.home+' vs '+pack.away;q('projectName').value=name;const core={activeSide:'HOME',matchConfig:{mode:String(c),playerCount:c},package:pack,teams:{HOME:{formation:m.HOME.formation||df(),customPositions:{},roster:m.HOME.roster.map(player)},AWAY:{formation:m.AWAY.formation||df(),customPositions:{},roster:m.AWAY.roster.map(player)}}};return{id:id||'prematch_'+Date.now().toString(36),name,savedAt:Date.now(),core:JSON.stringify(core),show:JSON.stringify(SHOW),matchday:'',vmix:'',assets:{homeCrest:m.HOME.crest||'',awayCrest:m.AWAY.crest||'',stadium:'',eventLogo:m.eventLogo||'',photos:{HOME:{},AWAY:{}}},meta:{date:q('date').value,source:'SAGI_PREMATCH_V1'}}}
function loadP(p){try{const x=JSON.parse(p.core);id=p.id;q('projectName').value=p.name||'';q('competition').value=x.package?.competition||'';q('round').value=x.package?.round||'';q('date').value=p.meta?.date||'';q('kickoff').value=x.package?.kickoff||'';q('venue').value=x.package?.venue||'';q('count').value=x.matchConfig?.playerCount||11;m.HOME={name:x.package?.home||'',formation:x.teams?.HOME?.formation||df(),crest:p.assets?.homeCrest||'',roster:(x.teams?.HOME?.roster||[]).map(player)};m.AWAY={name:x.package?.away||'',formation:x.teams?.AWAY?.formation||df(),crest:p.assets?.awayCrest||'',roster:(x.teams?.AWAY?.roster||[]).map(player)};m.eventLogo=p.assets?.eventLogo||'';renderLogo();switchSide('HOME');draft();toast('已载入比赛')}catch(e){toast('读取失败')}}
async function api(opt={}){const r=await fetch(CLOUD+'/api/prematch'+(opt.query||''),{cache:'no-store',...(opt.fetch||{})}),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'云端失败');return x}
async function list(){cs('正在连接赛前云端…','work');try{const x=await api({query:'?t='+Date.now()});projects=x.items||[];renderProjects();cs('赛前云端已连接 · '+projects.length+' 个比赛','ok')}catch(e){projects=[];renderProjects();cs('云端暂不可用 · 本机草稿可继续编辑','')}}
function renderProjects(){const w=q('projects');if(!projects.length){w.innerHTML='<div class="pm">还没有云端比赛，直接新建即可。</div>';return}w.innerHTML='';projects.forEach(p=>{let meta='';try{const x=JSON.parse(p.core);meta=(p.meta?.date||'')+' '+(x.package?.kickoff||'')+' · '+(x.package?.home||'HOME')+' vs '+(x.package?.away||'AWAY')}catch(e){}const d=document.createElement('div');d.className='project';d.innerHTML='<div class="pn">'+esc(p.name)+'</div><div class="pm">'+esc(meta)+'</div><div class="pb"><button data-l="'+esc(p.id)+'">编辑</button><button class="red" data-d="'+esc(p.id)+'">删除</button></div>';w.appendChild(d)});w.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>loadP(projects.find(x=>x.id===b.dataset.l)));w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del(b.dataset.d))}
async function save(){const p=project();q('save').disabled=true;q('save').textContent='正在保存…';try{const x=await api({fetch:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upsert',project:p})}});id=x.project.id;draft();await list();toast('已保存到赛前云端 · 现场可同步')}catch(e){draft();toast('云端失败，已保留本机草稿')}finally{q('save').disabled=false;q('save').textContent='保存到赛前云端'}}
async function del(x){try{await api({fetch:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:x})}});if(id===x)id='';await list();toast('已删除')}catch(e){toast('删除失败')}}
function snap(){stash();return{id,side,m,f:{projectName:q('projectName').value,competition:q('competition').value,round:q('round').value,date:q('date').value,kickoff:q('kickoff').value,venue:q('venue').value,count:q('count').value}}}function draft(){try{localStorage.setItem('sagi_prematch_draft_v1',JSON.stringify(snap()))}catch(e){}}function restore(){try{const x=JSON.parse(localStorage.getItem('sagi_prematch_draft_v1')||'null');if(!x)return;id=x.id||'';m=x.m||m;for(const k in x.f)if(q(k))q(k).value=x.f[k];side=x.side||'HOME';renderLogo();switchSide(side)}catch(e){}}
function fresh(){id='';m={HOME:{name:'',formation:df(),crest:'',roster:[]},AWAY:{name:'',formation:df(),crest:'',roster:[]},eventLogo:''};['projectName','round','date','kickoff','venue'].forEach(x=>q(x).value='');renderLogo();switchSide('HOME');draft();toast('已新建比赛')}
q('home').onclick=()=>switchSide('HOME');q('away').onclick=()=>switchSide('AWAY');q('formation').onchange=()=>{m[side].formation=q('formation').value;draft()};q('count').onchange=()=>{for(const s of ['HOME','AWAY']){const a=F[n()]||[df()];if(!a.includes(m[s].formation))m[s].formation=a[0]}formations();draft()};q('teamName').oninput=()=>{m[side].name=q('teamName').value;draft()};['projectName','competition','round','date','kickoff','venue'].forEach(x=>q(x).addEventListener('input',draft));
q('parse').onclick=()=>{const a=parseText(q('paste').value);a.length?addRows(a):st('没有识别到有效球员','bad')};q('file').onchange=async e=>{const f=e.target.files?.[0];if(f)try{const a=await fileRows(f);a.length?addRows(a):st('没有识别到有效球员','bad')}catch(err){st('导入失败：'+err.message,'bad')}e.target.value=''};q('auto').onclick=arrange;q('add').onclick=()=>{m[side].roster.push({id:uid(),number:String(m[side].roster.length+1),name:'PLAYER',squadType:'SUB',role:'MF',position:'CM',captain:false});renderRoster();draft()};
q('crestFile').onchange=async e=>{const f=e.target.files?.[0];if(f){m[side].crest=await imgData(f);renderCrest();draft()}e.target.value=''};q('eventLogoFile').onchange=async e=>{const f=e.target.files?.[0];if(f){m.eventLogo=await imgData(f);renderLogo();draft()}e.target.value=''};q('save').onclick=save;q('new').onclick=fresh;
restore();formations();renderRoster();renderCrest();renderLogo();list();
})();
</script></body></html>
