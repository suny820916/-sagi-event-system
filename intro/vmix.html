<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGI PLAYER INTRO · vMix</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:transparent;transform-origin:0 0}.bg{position:absolute;inset:0;background:radial-gradient(circle at 60% 35%,#203449 0,#0a0e15 35%,#05070a 72%)}.bg.chroma{background:#00b140}.bg.transparent{background:transparent}.gridFx{position:absolute;inset:-200px;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:80px 80px;transform:perspective(900px) rotateX(63deg) translateY(540px) scale(1.45);opacity:.45}.light{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(90px);opacity:.24}.l1{left:-250px;top:-350px;background:#4da6ff}.l2{right:-250px;bottom:-420px;background:#d2a541}.slash{position:absolute;width:1200px;height:120px;background:linear-gradient(90deg,transparent,#e4c670,transparent);transform:rotate(-18deg);filter:blur(4px);opacity:.25;left:-1200px;top:520px}.wind{position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(160deg,transparent 0 34px,#d8b55b 36px 39px,transparent 41px 86px);transform:translateX(-900px)}.brandMark{position:absolute;left:110px;top:88px;font-size:30px;font-weight:950;letter-spacing:4px;color:#e0c375;opacity:0}.teamCrest{position:absolute;right:120px;top:90px;width:140px;height:140px;object-fit:contain;opacity:0;filter:drop-shadow(0 12px 20px #0008)}.photoWrap{position:absolute;left:850px;bottom:-40px;width:760px;height:980px;opacity:0;transform:translateX(150px) scale(.96)}.photoWrap:after{content:"";position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,#05070a)}.playerPhoto{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 24px 40px #000c)}.info{position:absolute;left:125px;top:285px;width:850px}.eyebrow{font-size:23px;letter-spacing:7px;color:#d8b55b;font-weight:850;opacity:0;transform:translateY(20px)}.numberBig{font-size:250px;line-height:.82;font-weight:1000;color:#ffffff10;position:absolute;left:-20px;top:85px;opacity:0;transform:translateX(-80px)}.name{font-size:105px;line-height:.94;font-weight:1000;letter-spacing:-4px;max-width:930px;text-transform:uppercase;opacity:0;transform:translateY(55px)}.team{font-size:34px;color:#cbd2db;margin-top:22px;font-weight:800;letter-spacing:2px;opacity:0;transform:translateY(24px)}.pos{display:inline-block;margin-top:24px;padding:10px 22px;border:1px solid #d8b55b66;border-radius:999px;color:#e5ce8a;font-size:23px;font-weight:850;opacity:0}.line{width:0;height:6px;background:linear-gradient(90deg,#d8b55b,#fff3b8);margin:22px 0 18px;border-radius:3px}.count{position:absolute;right:110px;bottom:80px;color:#ffffff60;font-size:19px;letter-spacing:3px;font-weight:800;opacity:0}.stage.theme-gold .bg{background:radial-gradient(circle at 65% 35%,#42341c 0,#100d09 38%,#050403 76%)}.stage.theme-gold .l1{background:#b48632}.stage.theme-gold .l2{background:#f0d27b}.stage.theme-wind .bg{background:radial-gradient(circle at 60% 38%,#263143 0,#0a0f17 36%,#040609 75%)}.stage.playing .brandMark,.stage.playing .teamCrest,.stage.playing .eyebrow,.stage.playing .name,.stage.playing .team,.stage.playing .pos,.stage.playing .count{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) forwards}.stage.playing .teamCrest{animation-name:pop}.stage.playing .photoWrap{animation:photoIn .8s cubic-bezier(.18,.8,.18,1) .08s forwards}.stage.playing .numberBig{animation:numIn .7s ease-out .05s forwards}.stage.playing .line{animation:lineIn .65s ease-out .22s forwards}.stage.playing .eyebrow{animation-delay:.12s}.stage.playing .name{animation-delay:.2s}.stage.playing .team{animation-delay:.34s}.stage.playing .pos{animation-delay:.45s}.stage.playing .count{animation-delay:.5s}.stage.playing .slash{animation:slash 1.25s ease-out forwards}.stage.playing .wind{animation:wind 1.6s ease-out forwards}@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}@keyframes pop{0%{opacity:0;transform:scale(.72) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes photoIn{to{opacity:1;transform:translateX(0) scale(1)}}@keyframes numIn{to{opacity:1;transform:translateX(0)}}@keyframes lineIn{to{width:380px}}@keyframes slash{0%{left:-1300px;opacity:0}30%{opacity:.45}100%{left:1600px;opacity:0}}@keyframes wind{0%{transform:translateX(-1000px);opacity:0}35%{opacity:.25}100%{transform:translateX(450px);opacity:.05}}
</style></head>
<body>
<div id="stage" class="stage theme-light">
  <div id="bg" class="bg transparent"></div><div class="gridFx"></div><div class="light l1"></div><div class="light l2"></div><div class="slash"></div><div class="wind"></div>
  <div class="brandMark">SAGI SPORTS</div>
  <img id="crest" class="teamCrest">
  <div class="photoWrap"><img id="photo" class="playerPhoto"></div>
  <div class="info"><div class="eyebrow">STARTING XI</div><div id="numBig" class="numberBig">00</div><div id="name" class="name">PLAYER</div><div class="line"></div><div id="team" class="team">TEAM</div><div id="position" class="pos">PLAYER</div></div>
  <div id="count" class="count">01 / 01</div>
</div>
<script src="../cloud-config.js"></script><script src="../sagi-cloud.js"></script>
<script>
(function(){
'use strict';
const q=id=>document.getElementById(id);let commandId='',hideTimer=null;
function fit(){const st=q('stage'),s=Math.min(innerWidth/1920,innerHeight/1080),x=(innerWidth-1920*s)/2,y=(innerHeight-1080*s)/2;st.style.transform='translate('+x+'px,'+y+'px) scale('+s+')'}
function render(x){
 const st=q('stage');st.className='stage theme-'+(x.theme||'light');const bg=q('bg');bg.className='bg'+(x.background==='chroma'?' chroma':x.background==='transparent'?' transparent':'');
 q('name').textContent=(x.name||'PLAYER').toUpperCase();q('numBig').textContent=x.number||'00';q('team').textContent=(x.team||'TEAM').toUpperCase();q('position').textContent=(x.position||'PLAYER').toUpperCase();q('count').textContent=String((x.index||0)+1).padStart(2,'0')+' / '+String(x.total||1).padStart(2,'0');
 q('photo').src=x.photo||'';q('crest').src=x.crest||'';q('photo').style.visibility=x.photo?'visible':'hidden';q('crest').style.visibility=x.crest?'visible':'hidden';
 st.classList.remove('playing');void st.offsetWidth;st.classList.add('playing');clearTimeout(hideTimer);hideTimer=setTimeout(()=>st.classList.remove('playing'),Math.max(1000,+x.duration||4500));
}
async function poll(){
 const cfg=window.SAGI_CLOUD||{};if(!window.SagiCloud||!cfg.url||!cfg.key||!cfg.eventSlug)return;
 try{const r=await window.SagiCloud.getEvent(cfg.eventSlug,cfg),x=r&&r.payload&&r.payload.playerIntro;if(x&&x.commandId&&x.commandId!==commandId){commandId=x.commandId;render(x)}}catch(e){}
}
addEventListener('resize',fit);fit();poll();setInterval(poll,650);
})();
</script></body></html>
