<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>SAGI SPORTS · 为身边的足球加油</title>
<meta name="description" content="SAGI SPORTS · 记录平凡人的足球梦。球队装备、赛事组织与足球直播。">
<link rel="canonical" href="https://sagisports.cn/home.html">
<meta property="og:type" content="website">
<meta property="og:title" content="SAGI SPORTS">
<meta property="og:description" content="记录平凡人的足球梦。为身边的足球加油。">
<meta property="og:url" content="https://sagisports.cn/home.html">
<meta property="og:image" content="https://sagisports.cn/assets/brand/sagi-official-logo.webp?v=20261121b">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/brand/site-nav.css?v=2">
<style>
:root{color-scheme:dark;--bg:#090909;--text:#f4f4ef;--muted:#bababa;--line:#303030;--red:#e51f2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--text);outline-offset:4px}
.shell{width:min(1176px,calc(100% - 40px));margin-inline:auto}
.site-header{border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:74px}
.brand{display:inline-flex;align-items:center;min-height:44px}
.brand img{display:block;width:156px;height:auto}
.hero{min-height:clamp(26rem,calc(100svh - 75px),54rem);display:grid;align-content:center;padding:50px 0 64px}
.hero h1{font-size:clamp(44px,9.1vw,116px);font-weight:850;line-height:1.02;letter-spacing:-.065em;margin:0}
.hero-line{display:block}
.hero p{margin:24px 0 0;color:var(--muted);font-size:clamp(16px,2.15vw,24px);line-height:1.6}
.red-dot{color:var(--red)}
.businesses{border-top:1px solid var(--line);padding:clamp(32px,7vw,86px) 0}
.businesses h2{font-size:clamp(23px,3.4vw,36px);margin:0 0 22px;font-weight:750}
.business-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line)}
.business{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;min-height:210px;padding:24px clamp(12px,2.8vw,34px);border-right:1px solid var(--line)}
.business:last-child{border-right:0}
.business:hover{background:#141414}
.business h3{margin:0;font-size:clamp(24px,3.2vw,38px);line-height:1.2}
.business-name{font-size:clamp(12px,1.4vw,15px);font-weight:750;letter-spacing:.07em}
.business p{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.65}
.business .arrow{font-size:23px;line-height:1}
.cup-entry{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;color:var(--muted);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.cup-entry:hover{color:var(--text)}
.belief{border-top:1px solid var(--line);padding:clamp(46px,10vw,130px) 0}
.belief h2{margin:0;font-size:clamp(33px,6vw,70px);font-weight:820;line-height:1.15;letter-spacing:-.05em}
.belief p{margin:16px 0 30px;color:var(--muted);font-size:clamp(15px,2vw,20px);line-height:1.7}
.values{font-weight:750;font-size:clamp(13px,1.8vw,17px);letter-spacing:.11em}
footer{border-top:1px solid var(--line);padding:21px 0 25px;color:var(--muted);font-size:13px}
@media(max-width:720px){
 .shell{width:calc(100% - 36px)}
 .header-inner{display:block;min-height:0;padding:6px 0 3px}
 .brand img{width:138px}
 .hero{min-height:clamp(21rem,calc(87svh - 98px),39rem);padding:36px 0 48px}
 .hero h1{font-size:clamp(38px,12vw,70px);letter-spacing:-.055em}
 .hero p{margin-top:17px}
 .business-grid{grid-template-columns:1fr}
 .business{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;gap:4px 14px;border-right:0;border-bottom:1px solid var(--line);min-height:0;padding:16px 0}
 .business:last-child{border-bottom:0}
 .business h3,.business-name,.business p{grid-column:1}
 .business .arrow{grid-column:2;grid-row:1/-1;align-self:center}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/home.html" aria-label="SAGI SPORTS 首页"><img src="/assets/brand/sagi-official-logo.webp?v=20261121b" alt="SAGI FOOTBALL"></a>
    <nav class="sagi-site-nav" aria-label="主导航"><a href="/home.html" aria-current="page">首页</a><a href="/kit/catalog.html">球队装备</a><a href="/event/v23.html">赛事</a><a href="/toranhe/">托朗戈杯</a><a href="/broadcast/">直播</a><a href="/about.html">关于我们</a></nav>
  </div>
</header>
<main class="shell">
  <section class="hero" aria-labelledby="brand-title">
    <h1 id="brand-title">记录平凡人的<span class="hero-line">足球梦<span class="red-dot">.</span></span></h1>
    <p>让身边的足球被认真对待。</p>
  </section>
  <section class="businesses" aria-labelledby="business-title">
    <h2 id="business-title">身边的足球</h2>
    <div class="business-grid">
      <a class="business" href="/kit/catalog.html">
        <h3>球队装备</h3><span class="business-name" lang="en">SAGI KIT</span>
        <p>我们做球队装备。</p><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="business" href="/event/v23.html">
        <h3>赛事</h3><span class="business-name" lang="en">SAGI EVENT</span>
        <p>我们认真做身边的比赛。</p><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="business" href="/broadcast/">
        <h3>直播</h3><span class="business-name" lang="en">SAGI BROADCAST</span>
        <p>我们让这些比赛被看见。</p><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </div>
    <a class="cup-entry" href="/toranhe/">托朗戈杯 · 赛事故事与冠军档案 <span aria-hidden="true">&nbsp;↗</span></a>
  </section>
  <section class="belief" aria-labelledby="belief-title">
    <h2 id="belief-title">红点，就是热爱<span class="red-dot">.</span></h2>
    <p>我们可以看不到别的，但一定要看到热爱。</p>
    <div class="values" lang="en">ARDOR · AFIRE · ALIVE</div>
  </section>
</main>
<footer><div class="shell">SAGI SPORTS</div></footer>
</body>
</html>
