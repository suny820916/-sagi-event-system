<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<title>SAGI KIT · 报价成交</title>
<style>
:root{--bg:#080a0d;--panel:#10151b;--line:#2c3640;--text:#f4f1e9;--muted:#87939c;--gold:#d5b65b;--green:#67b27f;--red:#e47d7d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -8%,#2a2418 0,#0d1014 28%,#07090c 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input,select,textarea{font:inherit}
.app{max-width:760px;margin:auto;padding:17px 13px 85px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:42px;height:42px}.brand b{display:block;font-size:19px}.brand small{display:block;font-size:8px;color:#86929b;margin-top:2px}.back{color:#e2c879;text-decoration:none;border:1px solid #594b2e;border-radius:999px;padding:8px 10px;font-size:9px}
.hero{padding:21px 2px 10px}.hero h1{font-size:28px;line-height:1.08;margin:0}.hero p{font-size:10px;color:#89949d;line-height:1.7;margin:9px 0 0}.card{margin-top:11px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#11171d,#0c1014);padding:13px}.card h2{font-size:14px;margin:0 0 5px}.hint{font-size:9px;color:#85919a;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}label{display:block;font-size:8px;font-weight:900;color:#8f9aa3;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #303b45;border-radius:10px;background:#080d11;color:#f2f2ed;padding:10px;outline:none}textarea{min-height:74px;resize:vertical}.wide{grid-column:1/-1}
.productBar{display:grid;grid-template-columns:88px 1fr;gap:10px;margin-top:10px;align-items:center}.visual{aspect-ratio:4/3;border:1px solid #33404a;border-radius:11px;background:#fff var(--kit-sprite) no-repeat;background-size:400% 600%;position:relative;overflow:hidden}.visual.empty{background:#151b20}.visual .mask{position:absolute;background:rgba(10,13,16,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:4px;z-index:2}.visual .mask.a{left:9%;top:29%;width:31%;height:14%}.visual .mask.b{left:42%;top:29%;width:33%;height:16%}.visual img{position:absolute;width:20px;height:20px;left:52%;top:29%;object-fit:contain;z-index:3}.visual b{position:absolute;bottom:6px;left:6px;padding:3px 6px;border-radius:999px;background:#000c;color:#fff;font-size:7px}.pname{font-size:15px;font-weight:1000}.pmeta{font-size:9px;color:#89949d;line-height:1.55;margin-top:4px}
.priceBox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.metric{padding:12px;border:1px solid #343e47;border-radius:12px;background:#0b1014}.metric span{font-size:8px;color:#7f8a93;display:block}.metric strong{display:block;font-size:21px;margin-top:4px}.metric.total{border-color:#6c5930;background:#201a0d}.metric.total strong{color:#ebcf78}.currency{font-size:11px!important}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{flex:1;min-width:110px;border:1px solid #45515b;border-radius:10px;background:#161e24;color:#edf0f1;padding:10px;font-size:9px;font-weight:1000}.btn.primary{border-color:#a0873e;background:linear-gradient(135deg,#95772e,#d7b85c);color:#111}.btn.good{border-color:#4d8862;background:#245b3b;color:#fff}
.quoteSheet{margin-top:12px;background:#f7f4ec;color:#111;border-radius:14px;padding:15px;display:none}.quoteSheet.show{display:block}.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px}.sheetBrand{display:flex;gap:7px;align-items:center}.sheetBrand img{width:29px;height:29px;object-fit:contain}.sheetBrand b{font-size:20px}.sheetNo{text-align:right;font-size:8px}.sheetTitle{font-size:9px;color:#69645c;margin-top:3px}.sheetGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.sheetItem{border:1px solid #cdc7bc;border-radius:9px;padding:8px}.sheetItem span{font-size:7px;color:#716b62;display:block}.sheetItem b{font-size:10px;display:block;margin-top:3px;line-height:1.45}.sheetTotal{margin-top:11px;padding:12px;border:2px solid #111;border-radius:10px;display:flex;justify-content:space-between;align-items:end}.sheetTotal span{font-size:8px}.sheetTotal strong{font-size:24px}.sheetNote{font-size:8px;color:#645f57;line-height:1.65;margin-top:10px;border-top:1px solid #c9c2b7;padding-top:9px}
.history{display:grid;gap:8px;margin-top:10px}.quoteRow{border:1px solid #2f3942;border-radius:12px;background:#0b1014;padding:10px}.qtop{display:flex;justify-content:space-between;gap:8px}.qcode{font-size:10px;font-weight:1000;color:#e7ca77}.qstatus{font-size:7px;padding:4px 7px;border:1px solid #47535c;border-radius:999px;color:#a5afb6}.qstatus.deal{border-color:#407052;color:#a9dab7}.qteam{font-size:13px;font-weight:1000;margin-top:7px}.qmeta{font-size:8px;color:#84909a;line-height:1.55;margin-top:4px}.qamt{font-size:14px;font-weight:1000;margin-top:5px}.rowBtns{display:flex;gap:6px;margin-top:8px}.rowBtns button{flex:1;border:1px solid #3d4851;border-radius:8px;background:#151c22;color:#dce2e5;padding:7px 5px;font-size:8px}.empty{padding:20px;text-align:center;border:1px dashed #34404a;border-radius:12px;color:#75818a;font-size:9px}
.notice{margin-top:10px;font-size:8px;color:#b9a268;line-height:1.6;border-left:3px solid #a8873c;padding:8px 10px;background:#17140d;border-radius:0 10px 10px 0}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.priceBox{grid-template-columns:1fr 1fr}.metric.total{grid-column:1/-1}.sheetGrid{grid-template-columns:1fr 1fr}.productBar{grid-template-columns:76px 1fr}}
@media print{body{background:#fff}.app>*:not(.quoteSheet),.quoteSheet+.actions,.top,.hero,.card,.history{display:none!important}.app{padding:0}.quoteSheet{display:block!important;margin:0;border-radius:0;padding:0}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand"><img src="./brand-mark.svg" alt="SAGI KIT"><div><b>SAGI KIT</b><small>报价成交 V1.1</small></div></div><a class="back" href="./catalog.html">返回商品库</a></div>
<section class="hero"><h1>选定款式，30 秒出报价。</h1><p>销售价由你自己设置。系统只计算客户报价，不显示工厂成本、采购价或供应商信息。</p></section>

<section class="card">
<h2>报价信息</h2><div class="hint">从商品库进入时会自动带入款号。第一次设置销售单价后，手机会记住常用价格。</div>
<div class="productBar"><div id="visual" class="visual"><span class="mask a"></span><span class="mask b"></span><img src="./brand-mark.svg" alt="SAGI"><b id="visualCode">--</b></div><div><div id="productName" class="pname">请选择款式</div><div id="productMeta" class="pmeta">--</div></div></div>
<div class="grid">
 <div><label>SAGI 款式</label><select id="product"></select></div>
 <div><label>配色</label><select id="color"></select></div>
 <div><label>球队名称</label><input id="team" placeholder="例如：塔城长风"></div>
 <div><label>联系人</label><input id="contact" placeholder="姓名 / 微信称呼"></div>
 <div><label>联系电话</label><input id="phone" inputmode="tel" placeholder="选填"></div>
 <div><label>适用人群</label><select id="age"><option value="adult">成人</option><option value="child">儿童 / 青少年</option></select></div>
 <div><label>面料等级</label><select id="fabric"><option value="standard">标准版</option><option value="comfort">舒适版</option><option value="pro">专业版</option><option value="elite">高性能版</option></select></div>
 <div><label>数量（套）</label><input id="qty" type="number" min="1" max="999" inputmode="numeric" value="15"></div>
 <div><label>销售单价（元/套）</label><input id="unit" type="number" min="0" step="1" inputmode="decimal" placeholder="你自己定"></div>
 <div><label>报价有效期（天）</label><input id="valid" type="number" min="1" max="90" value="7"></div>
 <div class="wide"><label>报价备注</label><textarea id="note" placeholder="例如：含上衣+短裤、姓名号码印制；运费另计。"></textarea></div>
</div>
<div class="priceBox"><div class="metric"><span>数量</span><strong id="mQty">15</strong></div><div class="metric"><span>单价</span><strong><i class="currency">¥</i><span id="mUnit">--</span></strong></div><div class="metric total"><span>报价总额</span><strong><i class="currency">¥</i><span id="mTotal">--</span></strong></div></div>
<div class="notice">客户报价只保存销售价格。若以后加入利润分析，成本数据必须放到私有后台，不进入公开商品库和客户报价文件。</div>
<div class="actions"><button id="make" class="btn primary">生成 / 保存报价</button><button id="newQuote" class="btn">新建报价</button></div>
</section>

<section id="quoteSheet" class="quoteSheet">
 <div class="sheetHead"><div><div class="sheetBrand"><img src="./brand-mark.svg" alt="SAGI KIT"><b>SAGI KIT</b></div><div class="sheetTitle">球队定制服装报价单</div></div><div class="sheetNo"><b id="sheetCode">--</b><br><span id="sheetDate">--</span></div></div>
 <div id="sheetGrid" class="sheetGrid"></div>
 <div class="sheetTotal"><div><span>报价总额</span><div style="font-size:8px;color:#6f6960;margin-top:3px" id="sheetFormula"></div></div><strong id="sheetTotal">¥0</strong></div>
 <div class="sheetNote" id="sheetNote"></div>
</section>
<div id="quoteActions" class="actions" style="display:none"><button id="copy" class="btn">复制报价</button><button id="share" class="btn">微信/系统分享</button><button id="print" class="btn">保存/打印报价单</button><button id="toOrder" class="btn good">客户确认 → 转正式订单</button></div>

<section class="card"><h2>最近报价</h2><div class="hint">保存在当前手机。可以重新载入、标记已发送或成交。</div><div id="history" class="history"></div></section>
</main>
<script src="./sprite.js"></script><script src="./catalog-data.js"></script>
<script>
const META=window.SAGI_KIT_CATALOG_META||{products:[]},PRODUCTS=META.products||[],KEY='sagi-kit-quotes',SETKEY='sagi-kit-quote-settings';
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=null;
function settings(){try{return JSON.parse(localStorage.getItem(SETKEY)||'{}')||{}}catch(e){return{}}}
function saveSettings(v){localStorage.setItem(SETKEY,JSON.stringify(v))}
function quotes(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveQuotes(a){localStorage.setItem(KEY,JSON.stringify(a.slice(-200)))}
function money(n){return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function fabricName(v){return({standard:'标准版',comfort:'舒适版',pro:'专业版',elite:'高性能版'})[v]||v||''}
function spritePos(id){const m=(window.SAGI_KIT_SPRITE_MAP||{})[id];return m?{x:m[0]*33.333333,y:m[1]*20}:null}
function init(){if(window.SAGI_KIT_SPRITE)document.documentElement.style.setProperty('--kit-sprite','url("'+window.SAGI_KIT_SPRITE+'")');q('#product').innerHTML=PRODUCTS.map(p=>'<option value="'+p.id+'">'+p.id+' · '+p.name+'</option>').join('');const s=settings();if(s.lastUnitPrice!=null)q('#unit').value=s.lastUnitPrice;if(s.validDays)q('#valid').value=s.validDays;if(s.note)q('#note').value=s.note;const preset=new URLSearchParams(location.search).get('product');if(preset&&PRODUCTS.some(p=>p.id===preset))q('#product').value=preset;fillProduct();calc();renderHistory()}
function fillProduct(){const p=PRODUCTS.find(x=>x.id===q('#product').value)||PRODUCTS[0];if(!p)return;q('#color').innerHTML=p.colors.map(c=>'<option>'+esc(c)+'</option>').join('');q('#productName').textContent=p.name;q('#productMeta').textContent=p.style+' · '+p.colors.length+'种配色 · '+(p.tags||[]).join(' · ');q('#visualCode').textContent=p.id;const sp=spritePos(p.id);q('#visual').classList.toggle('empty',!sp);q('#visual').style.backgroundPosition=sp?sp.x+'% '+sp.y+'%':'center'}
function calc(){const qty=Math.max(1,Number(q('#qty').value)||1),unit=Number(q('#unit').value);q('#mQty').textContent=qty;q('#mUnit').textContent=Number.isFinite(unit)&&unit>0?money(unit):'--';q('#mTotal').textContent=Number.isFinite(unit)&&unit>0?money(qty*unit):'--'}
function newCode(){const d=new Date(),z=n=>String(n).padStart(2,'0'),r=(crypto.randomUUID?crypto.randomUUID().slice(0,4):Math.random().toString(36).slice(2,6)).toUpperCase();return 'SQ-'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+'-'+r}
function buildQuote(existing){const p=PRODUCTS.find(x=>x.id===q('#product').value),qty=Math.max(1,Number(q('#qty').value)||1),unit=Number(q('#unit').value);if(!p)return alert('请选择款式');if(!q('#team').value.trim())return alert('请填写球队名称');if(!Number.isFinite(unit)||unit<=0)return alert('请填写销售单价');const now=new Date().toISOString();return {schema:'SAGI-KIT-QUOTE-1',quoteCode:existing&&existing.quoteCode||newCode(),createdAt:existing&&existing.createdAt||now,updatedAt:now,status:existing&&existing.status||'草稿',statusHistory:existing&&existing.statusHistory||[{status:'草稿',at:now}],customer:{team:q('#team').value.trim(),contact:q('#contact').value.trim(),phone:q('#phone').value.trim()},product:{sagiCode:p.id,sagiName:p.name,style:p.style,color:q('#color').value,ageGroup:q('#age').value,fabric:q('#fabric').value},quantity:qty,unitPrice:unit,total:qty*unit,validDays:Math.max(1,Number(q('#valid').value)||7),note:q('#note').value.trim()}}
function persist(o){const a=quotes(),i=a.findIndex(x=>x.quoteCode===o.quoteCode);if(i>=0)a[i]=o;else a.push(o);saveQuotes(a);saveSettings({lastUnitPrice:o.unitPrice,validDays:o.validDays,note:o.note});current=o;renderSheet(o);renderHistory()}
function renderSheet(o){const c=o.customer,p=o.product;q('#sheetCode').textContent=o.quoteCode;q('#sheetDate').textContent=new Date(o.createdAt).toLocaleString('zh-CN',{hour12:false});const items=[['球队',c.team],['联系人',(c.contact||'未填')+(c.phone?' · '+c.phone:'')],['SAGI款式',p.sagiCode+' · '+p.sagiName],['配色',p.color],['适用人群',p.ageGroup==='child'?'儿童 / 青少年':'成人'],['面料',fabricName(p.fabric)],['数量',o.quantity+' 套'],['报价有效期',o.validDays+' 天']];q('#sheetGrid').innerHTML=items.map(x=>'<div class="sheetItem"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('');q('#sheetFormula').textContent=o.quantity+' 套 × ¥'+money(o.unitPrice)+'/套';q('#sheetTotal').textContent='¥'+money(o.total);q('#sheetNote').textContent='备注：'+(o.note||'无')+'\n本报价为 SAGI KIT 客户销售报价，不包含任何供应链成本信息。';q('#quoteSheet').classList.add('show');q('#quoteActions').style.display='flex'}
function textQuote(o){const c=o.customer,p=o.product;return 'SAGI KIT 报价单 '+o.quoteCode+'\n球队：'+c.team+'\n款式：'+p.sagiCode+' '+p.sagiName+'\n配色：'+p.color+'\n适用：'+(p.ageGroup==='child'?'儿童/青少年':'成人')+'\n面料：'+fabricName(p.fabric)+'\n数量：'+o.quantity+'套\n单价：¥'+money(o.unitPrice)+'/套\n总额：¥'+money(o.total)+'\n有效期：'+o.validDays+'天\n备注：'+(o.note||'无')}
function status(o,s){if(o.status===s)return o;const now=new Date().toISOString();return {...o,status:s,updatedAt:now,statusHistory:[...(o.statusHistory||[]),{status:s,at:now}]}}
function renderHistory(){const a=quotes().slice().sort((x,y)=>new Date(y.updatedAt||y.createdAt)-new Date(x.updatedAt||x.createdAt)).slice(0,12);q('#history').innerHTML=a.length?a.map(o=>'<div class="quoteRow"><div class="qtop"><b class="qcode">'+esc(o.quoteCode)+'</b><span class="qstatus '+(o.status==='已成交'?'deal':'')+'">'+esc(o.status||'草稿')+'</span></div><div class="qteam">'+esc(o.customer&&o.customer.team||'未命名球队')+'</div><div class="qmeta">'+esc((o.product&&o.product.sagiCode||'')+' · '+(o.product&&o.product.sagiName||''))+' · '+esc(o.quantity)+'套</div><div class="qamt">¥'+money(o.total)+'</div><div class="rowBtns"><button data-load="'+esc(o.quoteCode)+'">载入</button><button data-send="'+esc(o.quoteCode)+'">已发送</button><button data-deal="'+esc(o.quoteCode)+'">成交</button></div></div>').join(''):'<div class="empty">还没有报价记录。</div>';qa('[data-load]').forEach(b=>b.onclick=()=>loadQuote(b.dataset.load));qa('[data-send]').forEach(b=>b.onclick=()=>markQuote(b.dataset.send,'已发送'));qa('[data-deal]').forEach(b=>b.onclick=()=>markQuote(b.dataset.deal,'已成交'))}
function loadQuote(code){const o=quotes().find(x=>x.quoteCode===code);if(!o)return;current=o;q('#product').value=o.product.sagiCode;fillProduct();q('#color').value=o.product.color;q('#team').value=o.customer.team||'';q('#contact').value=o.customer.contact||'';q('#phone').value=o.customer.phone||'';q('#age').value=o.product.ageGroup||'adult';q('#fabric').value=o.product.fabric||'standard';q('#qty').value=o.quantity;q('#unit').value=o.unitPrice;q('#valid').value=o.validDays||7;q('#note').value=o.note||'';calc();renderSheet(o);window.scrollTo({top:0,behavior:'smooth'})}
function markQuote(code,s){const a=quotes(),i=a.findIndex(x=>x.quoteCode===code);if(i<0)return;a[i]=status(a[i],s);saveQuotes(a);if(current&&current.quoteCode===code){current=a[i];renderSheet(current)}renderHistory()}
function convertToOrder(o){if(!o)return;const d={};try{Object.assign(d,JSON.parse(localStorage.getItem('sagi-kit-draft')||'{}'))}catch(e){}d.product=o.product.sagiCode;d.step=2;d.custom={...(d.custom||{}),teamName:o.customer.team,contact:o.customer.contact,phone:o.customer.phone,ageGroup:o.product.ageGroup,fabric:o.product.fabric,color:o.product.color,colorSelect:o.product.color};const size=o.product.ageGroup==='child'?'140':'L';d.roster=Array.from({length:Math.min(80,o.quantity)},()=>({name:'',number:'',size}));localStorage.setItem('sagi-kit-draft',JSON.stringify(d));markQuote(o.quoteCode,'已成交');location.href='./index.html?product='+encodeURIComponent(o.product.sagiCode)+'&fromQuote='+encodeURIComponent(o.quoteCode)}
q('#product').onchange=()=>{fillProduct();calc()};q('#qty').oninput=calc;q('#unit').oninput=calc;
q('#make').onclick=()=>{const o=buildQuote(current&&current.quoteCode?current:null);if(o)persist(o)};
q('#newQuote').onclick=()=>{current=null;q('#team').value='';q('#contact').value='';q('#phone').value='';q('#qty').value=15;q('#quoteSheet').classList.remove('show');q('#quoteActions').style.display='none';calc()};
q('#copy').onclick=async()=>{if(!current)return;const t=textQuote(current);try{await navigator.clipboard.writeText(t);alert('报价已复制')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('报价已复制')}};
q('#share').onclick=async()=>{if(!current)return;const t=textQuote(current);if(navigator.share)try{await navigator.share({title:'SAGI KIT '+current.quoteCode,text:t});markQuote(current.quoteCode,'已发送')}catch(e){}else q('#copy').click()};
q('#print').onclick=()=>window.print();q('#toOrder').onclick=()=>convertToOrder(current);
init();
</script></body></html>
