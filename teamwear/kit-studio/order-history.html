<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><title>SAGI KIT · 订单历史</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f3f1ea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 80px}.brand{font-size:21px;font-weight:1000}.brand i{font-style:normal;color:#e44141}.sub{font-size:10px;color:#84909a;margin-top:4px}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.back{color:#d7bf77;text-decoration:none;font-size:10px;padding:7px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.stat{border:1px solid #2c3640;border-radius:13px;padding:11px;background:#10151b}.stat b{display:block;font-size:21px}.stat span{font-size:8px;color:#7f8b94}.toolbar{margin-top:12px;border:1px solid #2c3640;border-radius:14px;background:#10151b;padding:10px}.search{width:100%;padding:11px 12px;border:1px solid #3a4650;border-radius:10px;background:#080d11;color:#f2f4f5;font-size:12px}.chips{display:flex;gap:7px;overflow:auto;margin-top:9px}.chip{white-space:nowrap;border:1px solid #38444e;background:#151b21;color:#9ba6ae;border-radius:999px;padding:8px 11px;font-size:9px}.chip.on{border-color:#9a813e;color:#ead17e;background:#261f0f}
.list{display:grid;gap:10px;margin-top:12px}.order{border:1px solid #303b44;border-radius:15px;background:linear-gradient(145deg,#11171d,#0c1015);padding:13px}.orderhead{display:flex;justify-content:space-between;gap:10px}.code{font-size:9px;color:#d9c27c;font-weight:900}.time{font-size:8px;color:#74808a}.team{font-size:16px;font-weight:1000;margin-top:6px}.meta{font-size:9px;color:#8d99a3;line-height:1.7;margin-top:5px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:8px;padding:5px 7px;border:1px solid #394650;border-radius:999px;color:#a2adb5}.badge.good{border-color:#365b43;color:#9bc6a7;background:#0d1811}.badge.wait{border-color:#69572c;color:#d0b66d;background:#1c170d}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:1px solid #45515b;border-radius:9px;background:#182027;color:#e7eaec;padding:8px 10px;font-size:9px;font-weight:900}.btn.primary{background:linear-gradient(135deg,#8f742e,#d4b559);border-color:#b39643;color:#111}.empty{text-align:center;border:1px dashed #34404a;border-radius:14px;padding:30px 10px;color:#75818b;font-size:10px;margin-top:12px}
.modal{position:fixed;inset:0;background:#000d;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,760px);max-height:92vh;overflow:auto;background:#0c1116;border:1px solid #3a4650;border-radius:18px 18px 0 0;padding:14px}.sheetbar{display:flex;justify-content:space-between;align-items:center}.sheetbar b{font-size:15px}.close{border:1px solid #45515b;background:#161d23;color:white;border-radius:9px;padding:8px 10px}.confirm{margin-top:12px;background:#f5f2eb;color:#111;border-radius:13px;padding:15px}.confirmHead{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:9px}.confirmBrand{font-size:21px;font-weight:1000}.confirmBrand i{font-style:normal;color:#db3838}.confirmNo{text-align:right;font-size:9px}.info{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.ibox{border:1px solid #ccc6bb;border-radius:8px;padding:8px}.ibox span{display:block;font-size:7px;color:#6d675f}.ibox b{display:block;font-size:10px;margin-top:3px}.roster{width:100%;border-collapse:collapse;margin-top:10px}.roster th,.roster td{border-bottom:1px solid #d6d0c5;padding:7px 3px;text-align:left;font-size:9px}.roster th{color:#6b665e}.foot{font-size:8px;color:#625e57;line-height:1.6;margin-top:10px;padding-top:9px;border-top:1px solid #c9c2b8}.modalActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff}.app,.sheetbar,.modalActions{display:none!important}.modal{position:static;display:block!important;background:#fff}.sheet{max-height:none;border:0;padding:0;width:100%;overflow:visible}.confirm{margin:0;border-radius:0}}
</style></head><body>
<div class="app"><div class="toprow"><div><div class="brand">SAGI<i>●</i> KIT · 订单历史</div><div class="sub">手机本地订单中心 · 无服务器也能使用</div></div><a class="back" href="./start.html">返回首页</a></div>
<div class="stats"><div class="stat"><b id="stToday">0</b><span>今天</span></div><div class="stat"><b id="stYesterday">0</b><span>昨天</span></div><div class="stat"><b id="stMonth">0</b><span>本月</span></div><div class="stat"><b id="stTotal">0</b><span>全部订单</span></div></div>
<div class="toolbar"><input id="search" class="search" placeholder="搜索球队 / 联系人 / 订单号 / SAGI款号"><div class="chips"><button class="chip on" data-filter="today">今天</button><button class="chip" data-filter="yesterday">昨天</button><button class="chip" data-filter="month">本月</button><button class="chip" data-filter="all">全部</button></div></div>
<div id="list" class="list"></div></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheetbar"><b>订单确认单</b><button id="close" class="close">关闭</button></div><div class="confirm"><div class="confirmHead"><div><div class="confirmBrand">SAGI<i>●</i> KIT</div><div style="font-size:8px;color:#6c675f;margin-top:2px">球队定制服装确认单</div></div><div class="confirmNo"><b id="dCode"></b><br><span id="dDate"></span></div></div><div id="dInfo" class="info"></div><table class="roster"><thead><tr><th>#</th><th>姓名</th><th>号码</th><th>尺码</th></tr></thead><tbody id="dRoster"></tbody></table><div class="foot">请重点核对款式、配色、姓名、号码和尺码。个性化印制内容确认后再进入生产。</div></div><div class="modalActions"><button id="copy" class="btn">复制订单</button><button id="share" class="btn">微信/系统分享</button><button id="export" class="btn">导出 JSON</button><button id="print" class="btn primary">保存/打印确认单</button></div></div></div>
<script src="./cloud-sync.js"></script><script>
const KEY='sagi-kit-orders',q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let filter='today',selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function orders(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function dt(o){const d=new Date(o.createdAt||0);return isNaN(d)?new Date(0):d}
function startDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function category(o){const now=new Date(),t=dt(o).getTime(),today=startDay(now),yday=today-86400000,month=new Date(now.getFullYear(),now.getMonth(),1).getTime();if(t>=today)return'today';if(t>=yday&&t<today)return'yesterday';if(t>=month)return'month';return'old'}
function matchPeriod(o,f){if(f==='all')return true;const c=category(o);if(f==='month')return c==='today'||c==='yesterday'||c==='month';return c===f}
function pendingCodes(){try{return new Set(JSON.parse(localStorage.getItem('sagi-kit-sync-queue')||'[]').map(x=>x.order&&x.order.orderCode).filter(Boolean))}catch(e){return new Set()}}
function syncBadge(o){if(!window.SAGICloud||!SAGICloud.status().enabled)return'<span class="badge">仅本地</span>';return pendingCodes().has(o.orderCode)?'<span class="badge wait">待云端同步</span>':'<span class="badge good">云端已同步</span>'}
function stats(){const a=orders();q('#stToday').textContent=a.filter(o=>category(o)==='today').length;q('#stYesterday').textContent=a.filter(o=>category(o)==='yesterday').length;q('#stMonth').textContent=a.filter(o=>matchPeriod(o,'month')).length;q('#stTotal').textContent=a.length}
function render(){stats();const term=q('#search').value.trim().toLowerCase();let a=orders().filter(o=>matchPeriod(o,filter)).filter(o=>{if(!term)return true;const c=o.customer||{},p=o.product||{};return[o.orderCode,c.team,c.contact,c.phone,p.sagiCode,p.sagiName].join(' ').toLowerCase().includes(term)}).sort((a,b)=>dt(b)-dt(a));q('#list').innerHTML=a.length?a.map(o=>{const c=o.customer||{},p=o.product||{},n=(o.roster||[]).length;return '<div class="order"><div class="orderhead"><div class="code">'+esc(o.orderCode||'--')+'</div><div class="time">'+dt(o).toLocaleString('zh-CN',{hour12:false})+'</div></div><div class="team">'+esc(c.team||'未命名球队')+'</div><div class="meta">'+esc((p.sagiCode||'')+' · '+(p.sagiName||''))+'<br>'+esc(p.color||'')+' · '+n+'人 · '+esc(c.contact||'未填联系人')+'</div><div class="badges">'+syncBadge(o)+'</div><div class="actions"><button class="btn primary" data-view="'+esc(o.orderCode)+'">查看确认单</button><button class="btn" data-copy="'+esc(o.orderCode)+'">复制</button><button class="btn" data-export="'+esc(o.orderCode)+'">导出</button></div></div>'}).join(''):'<div class="empty">这里还没有订单。<br>完成一笔 SAGI KIT 订单后会自动出现在这里。</div>';
qa('[data-view]').forEach(b=>b.onclick=()=>openOrder(b.dataset.view));qa('[data-copy]').forEach(b=>b.onclick=()=>copyOrder(find(b.dataset.copy)));qa('[data-export]').forEach(b=>b.onclick=()=>exportOrder(find(b.dataset.export)))}
function find(code){return orders().find(o=>o.orderCode===code)}
function fabric(v){return({standard:'标准版',comfort:'舒适版',pro:'专业版',elite:'高性能版'})[v]||v||''}
function textOrder(o){const c=o.customer||{},p=o.product||{},r=o.roster||[];return 'SAGI KIT 订单 '+(o.orderCode||'')+'\n球队：'+(c.team||'')+'\n款式：'+(p.sagiCode||'')+' '+(p.sagiName||'')+'\n配色：'+(p.color||'')+'\n领型：'+(p.collar||'')+'\n面料：'+fabric(p.fabric)+'\n人数：'+r.length+'\n\n名单：\n'+r.map((x,i)=>(i+1)+'. '+(x.name||'')+' / '+(x.number||'')+' / '+(x.size||'')).join('\n')+'\n\n联系人：'+(c.contact||'')+' '+(c.phone||'')}
function openOrder(code){const o=find(code);if(!o)return;selected=o;const c=o.customer||{},p=o.product||{};q('#dCode').textContent=o.orderCode||'';q('#dDate').textContent=dt(o).toLocaleString('zh-CN',{hour12:false});const items=[['球队',c.team||''],['联系人',(c.contact||'')+' '+(c.phone||'')],['SAGI款号',(p.sagiCode||'')+' · '+(p.sagiName||'')],['配色',p.color||''],['适用人群',p.ageGroup==='child'?'儿童 / 青少年':'成人'],['领型',p.collar||''],['面料',fabric(p.fabric)],['赞助/队名',p.sponsor||'无']];q('#dInfo').innerHTML=items.map(x=>'<div class="ibox"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('');q('#dRoster').innerHTML=(o.roster||[]).map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.number)+'</td><td>'+esc(r.size)+'</td></tr>').join('');q('#modal').classList.add('show')}
async function copyOrder(o){if(!o)return;try{await navigator.clipboard.writeText(textOrder(o));alert('订单已复制')}catch(e){alert('复制失败，请打开确认单后手动复制')}}
function exportOrder(o){if(!o)return;const blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(o.orderCode||'SAGI-KIT')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
q('#close').onclick=()=>q('#modal').classList.remove('show');q('#modal').onclick=e=>{if(e.target.id==='modal')q('#modal').classList.remove('show')};q('#copy').onclick=()=>copyOrder(selected);q('#export').onclick=()=>exportOrder(selected);q('#print').onclick=()=>window.print();q('#share').onclick=async()=>{if(!selected)return;const t=textOrder(selected);if(navigator.share)try{await navigator.share({title:'SAGI KIT '+selected.orderCode,text:t})}catch(e){}else copyOrder(selected)};
qa('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;qa('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});q('#search').oninput=render;window.addEventListener('storage',render);window.addEventListener('sagi-cloud-status',render);render();
</script></body></html>
