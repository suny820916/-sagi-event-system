<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGI vMix Scoreboard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);display:flex;align-items:stretch;filter:drop-shadow(0 8px 24px #0009)}.team{height:86px;min-width:360px;display:flex;align-items:center;gap:18px;background:#0a0a0aeF;color:#fff;padding:0 24px;border-top:3px solid #d9b85f}.team.away{justify-content:flex-end}.crest{width:58px;height:58px;object-fit:contain}.fallback{width:58px;height:58px;border:2px solid #d9b85f;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d9b85f;font-weight:900}.name{font-size:30px;font-weight:800;white-space:nowrap}.score{height:86px;min-width:170px;background:#d9b85f;color:#080808;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:950;padding:0 20px}.meta{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#111e;color:#d9b85f;border:1px solid #6c592b;border-radius:999px;padding:7px 18px;font-size:18px;white-space:nowrap}.hidden{display:none}
</style></head><body><div id="wrap" class="wrap hidden"><div class="team home"><div id="hc"></div><div class="name" id="hn"></div></div><div class="score" id="sc">0 : 0</div><div class="team away"><div class="name" id="an"></div><div id="ac"></div></div></div><div id="meta" class="meta hidden"></div>
<script src="./cloud-config.js"></script><script src="./sagi-cloud.js"></script><script>
(function(){
var rev=null;
function q(x){return document.getElementById(x)}function esc(s){return String(s||'').replace(/[&<>"']/g,'')}
function cfg(){var p=new URLSearchParams(location.search),b=window.SAGI_CLOUD||{};return{url:p.get('url')||b.url||'',key:p.get('key')||b.key||'',eventSlug:p.get('event')||b.eventSlug||'',match:p.get('match')||'current'}}
function crest(team){return team&&team.crest?'<img class="crest" src="'+team.crest+'">':'<div class="fallback">'+esc((team&&team.name||'--').slice(0,2))+'</div>'}
function render(S){
 var c=cfg(),m=null;if(c.match&&c.match!=='current')m=(S.matches||[]).find(function(x){return x.id===c.match});if(!m&&S.liveMatchId)m=(S.matches||[]).find(function(x){return x.id===S.liveMatchId});if(!m)m=(S.matches||[]).find(function(x){return x.status!=='done'&&!x.postponed})||(S.matches||[])[0];if(!m){q('wrap').classList.add('hidden');return}
 var h=S.teams[m.home]||{name:'主队'},a=S.teams[m.away]||{name:'客队'};q('hc').innerHTML=crest(h);q('ac').innerHTML=crest(a);q('hn').textContent=h.name;q('an').textContent=a.name;q('sc').textContent=(m.hs==null?0:m.hs)+' : '+(m.as==null?0:m.as);q('meta').textContent=(S.name||'')+' · 第'+m.week+'周 '+(m.day||'')+' '+(m.stime||'');q('wrap').classList.remove('hidden');q('meta').classList.remove('hidden')
}
async function pull(){var c=cfg();if(!c.url||!c.key||!c.eventSlug)return;try{var r=await SagiCloud.getEvent(c.eventSlug,c);if(r&&r.revision!==rev){rev=r.revision;render(r.payload)}}catch(e){}}
pull();setInterval(pull,1000);
})();
</script></body></html>
