<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAGI EVENT · 公开赛事</title>
<meta name="theme-color" content="#080808">
<style>
:root{--bg:#080808;--p:#151515;--l:#2d2d2d;--t:#f4f1e8;--m:#8d8d8d;--g:#dfbd67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:920px;margin:auto;padding:18px 14px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-weight:900;font-size:21px}.tag{border:1px solid #66552b;color:var(--g);padding:6px 10px;border-radius:999px;font-size:11px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:15px;margin:13px 0}.hero h1{font-size:28px;margin:9px 0}.muted{color:var(--m);font-size:12px}.status{font-size:11px;color:#8bd7ae}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.k{background:#090909;border:1px solid #292929;border-radius:13px;padding:10px}.k span{display:block;color:#777;font-size:10px}.k b{font-size:22px;color:#efd88e}.week{color:var(--g);font-weight:900;margin:18px 0 8px}.match{background:#0b0b0b;border:1px solid #292929;border-radius:14px;padding:11px;margin:7px 0}.mh{display:flex;justify-content:space-between;color:#888;font-size:11px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;margin-top:8px}.team{display:flex;align-items:center;gap:8px;font-weight:750}.team.r{justify-content:flex-end}.crest{width:34px;height:34px;border-radius:9px;border:1px solid #333;object-fit:contain;background:#181818}.score{font-size:24px;font-weight:900;color:var(--g)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #292929;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.rank{display:grid;grid-template-columns:38px 1fr 70px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #292929}.no{color:var(--g);font-weight:900;text-align:center}.val{text-align:right;font-weight:900}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 2px;position:sticky;top:0;background:#080808e8;backdrop-filter:blur(10px);z-index:4}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:9px 12px;background:#222;color:#aaa;font-weight:700}.tabs button.on{background:#493b20;color:#f0d88e}.hidden{display:none}.bad{color:#ff9c9c}
</style></head><body><div class="w">
<div class="top"><div><div class="brand">SAGI EVENT SYSTEM</div><div class="muted">PUBLIC LIVE</div></div><div class="tag">V2.0</div></div>
<div id="hero" class="hero"><div class="status" id="status">正在连接赛事云端…</div><h1 id="name">赛事加载中</h1><div class="muted" id="meta"></div><div class="kpis"><div class="k"><span>球队</span><b id="kt">0</b></div><div class="k"><span>比赛</span><b id="km">0</b></div><div class="k"><span>已结束</span><b id="kd">0</b></div></div></div>
<div class="tabs"><button data-v="schedule" class="on">赛程赛果</button><button data-v="standings">积分榜</button><button data-v="scorers">射手榜</button></div>
<section id="schedule"><div class="card"><h2>赛程 / 赛果</h2><div id="matches"></div></div></section>
<section id="standings" class="hidden"><div class="card"><h2>积分榜</h2><div id="table"></div></div></section>
<section id="scorers" class="hidden"><div class="card"><h2>射手榜</h2><div id="shooters"></div></div></section>
</div>
<script src="./cloud-config.js"></script><script src="./sagi-cloud.js"></script>
<script>
(function(){
var S=null,revision=null;
function q(x){return document.getElementById(x)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function params(){var p=new URLSearchParams(location.search),base=window.SAGI_CLOUD||{};return{url:p.get('url')||base.url||'',key:p.get('key')||base.key||'',eventSlug:p.get('event')||base.eventSlug||''}}
function teamName(i){return S&&S.teams&&S.teams[i]?S.teams[i].name:'待定'}function crest(i){return S&&S.teams&&S.teams[i]?S.teams[i].crest:''}
function crestImg(i){var c=crest(i);return c?'<img class="crest" src="'+c+'">':'<span class="crest" style="display:flex;align-items:center;justify-content:center;font-size:9px;color:#dfbd67">'+esc(teamName(i).slice(0,2))+'</span>'}
function standings(){var t={};(S.teams||[]).forEach(function(_,i){t[i]={i:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});(S.matches||[]).forEach(function(m){if(m.hs==null||m.as==null)return;var h=t[m.home],a=t[m.away];if(!h||!a)return;h.p++;a.p++;h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;if(m.hs>m.as){h.w++;a.l++;h.pts+=3}else if(m.hs<m.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}});return Object.keys(t).map(function(k){var x=t[k];x.gd=x.gf-x.ga;return x}).sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf})}
function scorers(){var m={};(S.matches||[]).forEach(function(x){(x.events||[]).forEach(function(e){if(e.type!=='goal')return;var k=e.team+'|'+e.playerId;if(!m[k])m[k]={team:e.team,name:e.playerName,no:e.playerNo||'',goals:0};m[k].goals++})});return Object.values(m).sort(function(a,b){return b.goals-a.goals||a.name.localeCompare(b.name,'zh')})}
function render(){
 if(!S)return;q('name').textContent=S.name||'未命名赛事';q('meta').textContent=(S.loc||'')+(S.date?' · '+S.date:'');q('kt').textContent=(S.teams||[]).length;q('km').textContent=(S.matches||[]).length;q('kd').textContent=(S.matches||[]).filter(function(m){return m.status==='done'}).length;
 var w=q('matches');w.innerHTML='';var last=0;(S.matches||[]).forEach(function(m){if(m.week!==last){var h=document.createElement('div');h.className='week';h.textContent='第'+m.week+'周';w.appendChild(h);last=m.week}var d=document.createElement('div');d.className='match';var state=m.postponed?'延期':m.status==='done'?'全场':'未开始';d.innerHTML='<div class="mh"><span>'+esc(m.day||'')+' · '+esc(m.sdate||'')+' '+esc(m.stime||'')+'</span><span>'+state+'</span></div><div class="teams"><div class="team">'+crestImg(m.home)+'<span>'+esc(teamName(m.home))+'</span></div><div class="score">'+(m.hs==null?'VS':m.hs+' : '+m.as)+'</div><div class="team r"><span>'+esc(teamName(m.away))+'</span>'+crestImg(m.away)+'</div></div>';w.appendChild(d)});
 var a=standings(),h='<table><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>净</th><th>分</th></tr>';a.forEach(function(x,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(teamName(x.i))+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+x.gd+'</td><td><b>'+x.pts+'</b></td></tr>'});q('table').innerHTML=h+'</table>';
 var s=scorers();q('shooters').innerHTML=s.length?s.map(function(x,i){return'<div class="rank"><div class="no">'+(i+1)+'</div><div><b>'+(x.no?'#'+esc(x.no)+' ':'')+esc(x.name)+'</b><div class="muted">'+esc(teamName(x.team))+'</div></div><div class="val">'+x.goals+' 球</div></div>'}).join(''):'<div class="muted">暂无进球数据</div>';
}
async function pull(){
 var c=params();if(!c.url||!c.key||!c.eventSlug){q('status').textContent='云端尚未配置';q('status').className='status bad';return}
 try{var r=await SagiCloud.getEvent(c.eventSlug,c);if(!r){q('status').textContent='赛事尚未发布';return}if(r.revision!==revision){S=r.payload;revision=r.revision;try{localStorage.setItem('sagi_public_cache_'+c.eventSlug,JSON.stringify(r))}catch(e){}render()}q('status').textContent='云端已同步 · '+new Date(r.updated_at).toLocaleString()}catch(e){q('status').textContent='连接失败，正在显示最近缓存';q('status').className='status bad';try{var x=JSON.parse(localStorage.getItem('sagi_public_cache_'+c.eventSlug)||'null');if(x){S=x.payload;revision=x.revision;render()}}catch(_){}}
}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');['schedule','standings','scorers'].forEach(function(id){q(id).classList.toggle('hidden',id!==b.dataset.v)})}});
pull();setInterval(pull,5000);
})();
</script></body></html>
