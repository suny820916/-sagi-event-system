<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAGI V2 云端一键连接</title><meta name="theme-color" content="#080808">
<style>
body{margin:0;background:#080808;color:#f5f1e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.w{max-width:720px;margin:auto;padding:28px 16px}.card{background:#151515;border:1px solid #303030;border-radius:20px;padding:18px;margin:14px 0}.brand{font-size:24px;font-weight:900}.tag{display:inline-block;color:#dfbd67;border:1px solid #65552c;border-radius:999px;padding:6px 10px;font-size:12px}.muted{color:#999;font-size:13px;line-height:1.65}.big{width:100%;min-height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,#c39f4b,#ecd27f);color:#111;font-size:18px;font-weight:900}.big:disabled{opacity:.5}.status{margin-top:14px;padding:14px;border-radius:14px;background:#0a0a0a;border:1px solid #292929;white-space:pre-wrap;line-height:1.55}.ok{color:#8bd7ae}.bad{color:#ff9c9c}.warn{color:#e4c15f}input{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #3a3a3a;border-radius:13px;padding:13px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}a,button.small{border:0;border-radius:12px;background:#292929;color:#fff;padding:11px 13px;text-decoration:none;font-weight:750}
</style></head><body><div class="w">
<div class="brand">SAGI EVENT SYSTEM</div><div class="tag">V2.0 云端一键连接</div>
<div class="card"><div class="muted">Project URL、Publishable Key、赛事代码已经配置好。首次连接只需要点下面这个按钮。</div>
<button id="go" class="big" type="button" onclick="window.SAGI_CONNECT_NOW()">一键创建 / 连接云赛事</button>
<div id="status" class="status warn">准备就绪。</div></div>
<div class="card"><div class="muted">只有在页面提示“云赛事已经存在，但本机没有管理员代码”时，才需要在这里输入原管理员代码。</div><input id="token" type="password" placeholder="管理员代码（通常不需要手动填）"><div class="row"><button id="copy" class="small" type="button">复制管理员代码</button><a href="./v20.html?v=2003">返回 V2.0 管理端</a></div></div>
</div>
<script>
(function(){
'use strict';
var URL='https://zgqriuwltbnkgovtsccb.supabase.co';
var KEY='sb_publishable_bqROSu6ZQRdDW3DLazUCfg_4aYxldN8';
var SLUG='tacheng-winter-2026';
var STORE='sagi_cloud_admin_v20';
function q(x){return document.getElementById(x)}
function stat(t,kind){q('status').className='status '+(kind||'');q('status').textContent=t}
function makeCode(){var a=new Uint32Array(3);try{crypto.getRandomValues(a);return 'SAGI-'+Array.from(a).map(function(x){return x.toString(36)}).join('-').slice(0,24)}catch(e){return 'SAGI-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}}
function loadCfg(){try{return JSON.parse(localStorage.getItem(STORE)||'null')||{}}catch(e){return{}}}
function saveCfg(x){localStorage.setItem(STORE,JSON.stringify(x))}
function payload(){try{return JSON.parse(localStorage.getItem('sagi_v20')||localStorage.getItem('sagi_v17')||'null')||{name:'塔城长风冬季足球联赛',loc:'新疆塔城市',date:'',teams:[],matches:[],liveMatchId:''}}catch(e){return{name:'塔城长风冬季足球联赛',loc:'新疆塔城市',date:'',teams:[],matches:[],liveMatchId:''}}}
async function rpc(name,args){var r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(args)});var tx=await r.text(),data=null;try{data=tx?JSON.parse(tx):null}catch(e){data=tx}if(!r.ok)throw new Error((data&&data.message)||tx||('HTTP '+r.status));return data}
window.SAGI_CONNECT_NOW=async function(){
 var b=q('go');b.disabled=true;b.textContent='正在连接…';stat('1/3 正在测试 Supabase 连接…','warn');
 try{
   var current=await rpc('sagi_get_event',{p_slug:SLUG});
   var cfg=loadCfg(),tok=(q('token').value||cfg.token||'').trim();
   if(!current){
     if(tok.length<8)tok=makeCode();
     q('token').value=tok;
     stat('2/3 连接正常，正在创建云赛事…','warn');
     var created=await rpc('sagi_claim_event',{p_slug:SLUG,p_token:tok,p_payload:payload()});
     saveCfg({url:URL,key:KEY,eventSlug:SLUG,token:tok,revision:created.revision,enabled:true});
     stat('云赛事创建成功！\nrevision '+created.revision+'\n管理员代码已保存在本机。\n\n现在可以返回 V2.0。','ok');
     b.textContent='云端已连接';
   }else{
     if(tok.length<8){
       stat('云赛事已经存在。\n本机没有管理员代码，请输入原管理员代码后再点一次。','bad');
       b.disabled=false;b.textContent='验证并连接已有云赛事';return;
     }
     stat('2/3 找到已有赛事，正在验证管理员代码…','warn');
     var verified=await rpc('sagi_claim_event',{p_slug:SLUG,p_token:tok,p_payload:current.payload});
     saveCfg({url:URL,key:KEY,eventSlug:SLUG,token:tok,revision:verified.revision,enabled:true});
     stat('已有云赛事连接成功！\nrevision '+verified.revision+'\n现在可以返回 V2.0。','ok');
     b.textContent='云端已连接';
   }
 }catch(e){
   stat('连接失败：\n'+(e&&e.message?e.message:String(e))+'\n\n请把这段错误截图发给我。','bad');
   b.disabled=false;b.textContent='重新尝试连接';
 }
};
q('copy').onclick=async function(){var cfg=loadCfg(),tok=(q('token').value||cfg.token||'').trim();if(!tok){stat('当前还没有管理员代码。先点一键连接。','warn');return}try{await navigator.clipboard.writeText(tok);stat('管理员代码已复制。','ok')}catch(e){q('token').value=tok;q('token').select();document.execCommand('copy');stat('管理员代码已复制。','ok')}};
})();
</script></body></html>
