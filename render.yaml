services:
  - type: web
    name: sagi-cloud-bridge-suny820916
    runtime: python
    plan: free
    region: singapore
    rootDir: sagi-cloud-bridge
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny', local_dir='model_cache/tiny')"
    startCommand: gunicorn -w 1 -k gthread --threads 4 -b 0.0.0.0:$PORT --timeout 300 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SAGI_SERVER_SECRET
        generateValue: true
      - key: SAGI_ALLOWED_ORIGIN
        value: "https://suny820916.github.io"
      - key: SAGI_MAX_FILE_MB
        value: "300"
      - key: SAGI_JOB_TTL_MIN
        value: "30"
      - key: SAGI_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: SAGI_INSTAGRAM_PROXY
        sync: false
