services:
  - type: web
    name: sagi-cloud-bridge-suny820916
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./sagi-cloud-bridge/Dockerfile
    dockerContext: ./sagi-cloud-bridge
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SAGI_SERVER_SECRET
        generateValue: true
      - key: SAGI_ALLOWED_ORIGIN
        value: "https://suny820916.github.io"
      - key: SAGI_MAX_FILE_MB
        value: "300"
      - key: SAGI_JOB_TTL_MIN
        value: "30"
      - key: SAGI_RATE_LIMIT_PER_HOUR
        value: "20"
