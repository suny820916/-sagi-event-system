services:
  - type: web
    name: sagi-cloud-bridge-suny820916
    runtime: python
    plan: free
    region: singapore
    rootDir: sagi-cloud-bridge
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 4 -b 0.0.0.0:$PORT --timeout 300 app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SAGI_SERVER_SECRET
        generateValue: true
      - key: SAGI_ALLOWED_ORIGIN
        value: "https://suny820916.github.io"
      - key: SAGI_MAX_FILE_MB
        value: "300"
      - key: SAGI_JOB_TTL_MIN
        value: "30"
      - key: SAGI_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: SAGI_COBALT_HOSTPORT
        fromService:
          name: sagi-cobalt-8f2c9-suny820916
          type: web
          property: hostport

  - type: web
    name: sagi-cobalt-8f2c9-suny820916
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/imputnet/cobalt:11
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: "https://sagi-cobalt-8f2c9-suny820916.onrender.com/"
      - key: API_PORT
        value: "10000"
      - key: API_LISTEN_ADDRESS
        value: "0.0.0.0"
      - key: CORS_WILDCARD
        value: "0"
      - key: CORS_URL
        value: "https://sagi-cloud-bridge-suny820916.onrender.com"
      - key: RATELIMIT_WINDOW
        value: "60"
      - key: RATELIMIT_MAX
        value: "6"
      - key: DURATION_LIMIT
        value: "7200"
      - key: DISABLED_SERVICES
        value: "bilibili,bluesky,dailymotion,facebook,loom,ok.ru,pinterest,reddit,rutube,snapchat,soundcloud,streamable,tiktok,tumblr,twitch,twitter,vimeo,vk,youtube,xiaohongshu"
