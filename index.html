<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SAGI SPORTS · 点开热爱</title>
<meta name="description" content="SAGI SPORTS · 点开热爱。为身边的足球加油，记录平凡人的足球梦。">
<link rel="canonical" href="https://sagisports.cn/">
<meta property="og:type" content="website">
<meta property="og:title" content="SAGI SPORTS · 点开热爱">
<meta property="og:description" content="为身边的足球加油，记录平凡人的足球梦。">
<meta property="og:url" content="https://sagisports.cn/">
<meta property="og:image" content="https://sagisports.cn/assets/brand/sagi-official-logo.webp?v=20261121b">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#000;--white:#fff;--red:#ff101f;--muted:#777}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100svh;overflow:hidden}
.entry{
 min-height:100svh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:max(24px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
 background:#000;
 position:relative;
}
.wordmark{
 position:absolute;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
 font-size:10px;font-weight:900;letter-spacing:5px;color:#626262;white-space:nowrap;
}
.mark{
 width:min(82vw,720px);
 aspect-ratio:1/1;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
.mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.25))}
.loveButton{
 position:absolute;
 left:50.07%;
 top:68.87%;
 width:24.8%;
 aspect-ratio:1/1;
 transform:translate(-50%,-50%);
 border-radius:50%;
 border:0;
 background:var(--red);
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
 box-shadow:none;
 outline:none;
 appearance:none;
 -webkit-appearance:none;
 transition:transform .18s ease,filter .18s ease,opacity .18s ease;
 animation:redDotHeartbeat 2.4s cubic-bezier(.4,0,.2,1) infinite;
}
.loveButton:hover,.loveButton:focus-visible{
 transform:translate(-50%,-50%) scale(1.04);
 filter:brightness(1.08);
 box-shadow:none;
 outline:none;
}
.loveButton:active{
 transform:translate(-50%,-50%) scale(.97);
 filter:brightness(.96);
}
.copy{text-align:center;margin-top:-2.5vh;animation:fade .9s .18s both}
.title{font-size:clamp(26px,7vw,42px);font-weight:950;letter-spacing:.06em;margin:0}
.title .dot{color:var(--red)}
.sub{margin-top:13px;font-size:11px;line-height:1.9;color:#666;letter-spacing:.14em}
.hint{margin-top:18px;font-size:9px;color:#353535;letter-spacing:.20em}
.exit .mark,.exit .copy{opacity:0;transform:scale(.985);transition:.2s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes redDotHeartbeat{
 0%,100%{
  transform:translate(-50%,-50%) scale(1);
  opacity:.94;
  filter:brightness(.92);
 }
 12%{
  transform:translate(-50%,-50%) scale(1.055);
  opacity:1;
  filter:brightness(1.12);
 }
 22%{
  transform:translate(-50%,-50%) scale(.985);
  opacity:.96;
  filter:brightness(.98);
 }
 31%{
  transform:translate(-50%,-50%) scale(1.03);
  opacity:1;
  filter:brightness(1.08);
 }
 42%{
  transform:translate(-50%,-50%) scale(1);
  opacity:.96;
  filter:brightness(1);
 }
 68%{
  transform:translate(-50%,-50%) scale(.99);
  opacity:.90;
  filter:brightness(.90);
 }
 84%{
  transform:translate(-50%,-50%) scale(1.01);
  opacity:.94;
  filter:brightness(.98);
 }
}
@media(max-width:520px){
 .mark{width:min(92vw,560px)}
 .copy{margin-top:-5vw}
 .wordmark{font-size:9px;letter-spacing:4px}
}

.introVideoLayer{
 position:fixed;inset:0;z-index:50;background:#000;
 display:none;align-items:center;justify-content:center;
 opacity:0;transition:opacity .22s ease;
}
.introVideoLayer.on{display:flex;opacity:1}
.introVideo{
 width:100%;height:100%;object-fit:contain;background:#000;display:block;
}
.skipIntro{
 position:absolute;z-index:2;
 top:max(18px,env(safe-area-inset-top));right:16px;
 border:1px solid rgba(255,255,255,.22);
 background:rgba(0,0,0,.28);color:#fff;border-radius:999px;
 padding:8px 12px;font-size:10px;font-weight:850;letter-spacing:.08em;
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.72;
}
.videoFallback{
 position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));
 transform:translateX(-50%);color:#777;font-size:10px;
 display:none;white-space:nowrap;cursor:pointer;
}
@media(prefers-reduced-motion:reduce){.mark,.copy,.loveButton{animation:none}}
</style>
</head>
<body>
<main class="entry" id="entry">
  <div class="wordmark">SAGI SPORTS</div>

  <div class="mark" aria-label="SAGI A red dot">
    <svg viewBox="0 0 2048 2048" role="img" aria-hidden="true">
      <path fill="#fff" d="M 844,256 L 788,296 L 739,349 L 715,385 L 586,635 L 382,1063 L 153,1605 L 145,1638 L 145,1684 L 170,1746 L 235,1811 L 265,1828 L 317,1844 L 379,1844 L 420,1832 L 455,1814 L 489,1784 L 523,1729 L 696,1353 L 992,748 L 1012,729 L 1043,729 L 1058,743 L 1159,944 L 1545,1767 L 1600,1818 L 1664,1844 L 1726,1844 L 1754,1836 L 1812,1807 L 1857,1766 L 1894,1700 L 1902,1672 L 1902,1606 L 1894,1577 L 1689,1087 L 1653,1017 L 1593,875 L 1360,397 L 1316,337 L 1255,280 L 1219,256 L 1125,215 L 1041,203 L 974,207 L 902,227 Z"/>
    </svg>
    <button class="loveButton" id="loveButton" aria-label="点开热爱，进入 SAGI SPORTS 主页"></button>
  </div>

  <section class="copy">
    <h1 class="title">点开热爱<span class="dot">.</span></h1>
    <div class="sub">为身边的足球加油<br>记录平凡人的足球梦</div>
    <div class="hint">TAP THE RED DOT</div>
  </section>
</main>

<div class="introVideoLayer" id="introVideoLayer" aria-hidden="true">
  <video class="introVideo" id="introVideo" playsinline webkit-playsinline preload="auto" src="/assets/intro/sagi-intro.mp4"></video>
  <button class="skipIntro" id="skipIntro" type="button">跳过</button>
  <div class="videoFallback" id="videoFallback">视频无法播放 · 点击进入主页</div>
</div>

<script>
const btn=document.getElementById("loveButton");
const entry=document.getElementById("entry");
const layer=document.getElementById("introVideoLayer");
const video=document.getElementById("introVideo");
const skip=document.getElementById("skipIntro");
const fallback=document.getElementById("videoFallback");
let leaving=false;

function enterHome(){
  if(leaving)return;
  leaving=true;
  location.href="/home.html";
}

function playIntro(){
  btn.disabled=true;
  entry.classList.add("exit");
  layer.style.display="flex";
  layer.setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>layer.classList.add("on"));
  video.currentTime=0;
  video.volume=1;
  const p=video.play();
  if(p&&typeof p.catch==="function"){
    p.catch(()=>{
      fallback.style.display="block";
      video.controls=true;
      btn.disabled=false;
    });
  }
}

btn.addEventListener("click",playIntro);
video.addEventListener("ended",enterHome);
video.addEventListener("error",()=>{
  fallback.style.display="block";
  fallback.onclick=enterHome;
});
skip.addEventListener("click",enterHome);
</script>
</body>
</html>
