<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SAGI SPORTS · 点开热爱</title>
<meta name="description" content="SAGI SPORTS · 点开热爱。为身边的足球加油，记录平凡人的足球梦。">
<link rel="canonical" href="https://sagisports.cn/">
<meta property="og:type" content="website">
<meta property="og:title" content="SAGI SPORTS · 点开热爱">
<meta property="og:description" content="为身边的足球加油，记录平凡人的足球梦。">
<meta property="og:url" content="https://sagisports.cn/">
<meta property="og:image" content="https://sagisports.cn/assets/brand/sagi-official-logo.webp?v=20261121b">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#000;--white:#fff;--red:#ff101f;--muted:#777}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100svh;overflow:hidden}
.entry{
 min-height:100svh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:max(24px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
 background:#000;
 position:relative;
}
.wordmark{
 position:absolute;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
 font-size:10px;font-weight:900;letter-spacing:5px;color:#626262;white-space:nowrap;
}
.mark{
 width:min(82vw,720px);
 aspect-ratio:1/1;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
.mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.25))}
.loveButton{
 position:absolute;
 left:50.07%;
 top:68.87%;
 width:24.8%;
 aspect-ratio:1/1;
 transform:translate(-50%,-50%);
 border-radius:50%;
 border:0;
 background:var(--red);
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
 box-shadow:none;
 outline:none;
 appearance:none;
 -webkit-appearance:none;
 transition:transform .18s ease,filter .18s ease,opacity .18s ease;
 animation:redDotBreath 2.1s ease-in-out infinite;
}
.loveButton:hover,.loveButton:focus-visible{
 transform:translate(-50%,-50%) scale(1.04);
 filter:brightness(1.08);
 box-shadow:none;
 outline:none;
}
.loveButton:active{
 transform:translate(-50%,-50%) scale(.97);
 filter:brightness(.96);
}
.copy{text-align:center;margin-top:-2.5vh;animation:fade .9s .18s both}
.title{font-size:clamp(26px,7vw,42px);font-weight:950;letter-spacing:.06em;margin:0}
.title .dot{color:var(--red)}
.sub{margin-top:13px;font-size:11px;line-height:1.9;color:#666;letter-spacing:.14em}
.hint{margin-top:18px;font-size:9px;color:#353535;letter-spacing:.20em}
.exit .mark,.exit .copy{opacity:0;transform:scale(.985);transition:.2s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes redDotBreath{
 0%,100%{
  opacity:1;
  filter:brightness(.94);
 }
 50%{
  opacity:.90;
  filter:brightness(1.14);
 }
}
@media(max-width:520px){
 .mark{width:min(92vw,560px)}
 .copy{margin-top:-5vw}
 .wordmark{font-size:9px;letter-spacing:4px}
}
@media(prefers-reduced-motion:reduce){.mark,.copy,.loveButton{animation:none}}
</style>
</head>
<body>
<main class="entry" id="entry">
  <div class="wordmark">SAGI SPORTS</div>

  <div class="mark" aria-label="SAGI A red dot">
    <svg viewBox="0 0 2048 2048" role="img" aria-hidden="true">
      <path fill="#fff" d="M 844,256 L 788,296 L 739,349 L 715,385 L 586,635 L 382,1063 L 153,1605 L 145,1638 L 145,1684 L 170,1746 L 235,1811 L 265,1828 L 317,1844 L 379,1844 L 420,1832 L 455,1814 L 489,1784 L 523,1729 L 696,1353 L 992,748 L 1012,729 L 1043,729 L 1058,743 L 1159,944 L 1545,1767 L 1600,1818 L 1664,1844 L 1726,1844 L 1754,1836 L 1812,1807 L 1857,1766 L 1894,1700 L 1902,1672 L 1902,1606 L 1894,1577 L 1689,1087 L 1653,1017 L 1593,875 L 1360,397 L 1316,337 L 1255,280 L 1219,256 L 1125,215 L 1041,203 L 974,207 L 902,227 Z"/>
    </svg>
    <button class="loveButton" id="loveButton" aria-label="点开热爱，进入 SAGI SPORTS 主页"></button>
  </div>

  <section class="copy">
    <h1 class="title">点开热爱<span class="dot">.</span></h1>
    <div class="sub">为身边的足球加油<br>记录平凡人的足球梦</div>
    <div class="hint">TAP THE RED DOT</div>
  </section>
</main>
<script>
const btn=document.getElementById("loveButton");
btn.addEventListener("click",()=>{
  document.getElementById("entry").classList.add("exit");
  setTimeout(()=>location.href="/home.html",180);
});
</script>
</body>
</html>
