<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAGI EVENT SYSTEM V1.3</title><style>
:root{--bg:#080808;--p:#151515;--l:#303030;--t:#f5f1e8;--m:#888;--g:#dfbd67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:860px;margin:auto;padding:20px 14px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:23px;font-weight:800}.sub,.muted{color:var(--m);font-size:12px}.ver{border:1px solid #635226;color:var(--g);padding:8px 11px;border-radius:999px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:15px;margin:14px 0}.hero h1{font-size:28px;margin:10px 0}.badge{display:inline-block;color:var(--g);border:1px solid #59491f;border-radius:999px;padding:6px 10px;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.k{background:#090909;border:1px solid var(--l);border-radius:14px;padding:12px}.k span{display:block;color:var(--m);font-size:10px}.k b{font-size:25px;color:#f0d88e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:var(--m);font-size:11px;margin-bottom:5px}input,select{width:100%;font-size:16px;background:#090909;color:#fff;border:1px solid #3a3a3a;border-radius:13px;padding:12px}button{min-height:44px;border:0;border-radius:13px;background:#292929;color:#fff;font-weight:750;padding:10px 14px}.primary{background:linear-gradient(135deg,#c39f4b,#ecd27f);color:#111}.danger{background:#552424}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hidden{display:none!important}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#090909f5;border-top:1px solid #292929;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;color:#777;border-radius:0}.nav .active{color:var(--g)}.match{background:#090909;border:1px solid #292929;border-radius:14px;padding:11px;margin:8px 0}.mh{display:flex;justify-content:space-between;color:#888;font-size:11px;margin-bottom:7px}.score{display:grid;grid-template-columns:minmax(0,1fr) 50px 15px 50px minmax(0,1fr);gap:5px;align-items:center}.score input{text-align:center;padding:8px}.home{text-align:right}.away{text-align:left}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #292929;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.notice{display:none;background:#211b10;border:1px solid #62522a;color:#edd991;border-radius:12px;padding:10px;margin-top:12px}.round{color:var(--g);font-size:12px;margin:14px 0 5px}.champ{background:#211b10;border:1px solid #66552a;color:#efd77d;border-radius:14px;padding:12px;margin-bottom:10px}.champ b{display:block;font-size:22px}.test{margin-top:8px;font-size:12px;color:#8f8}.test.bad{color:#f88}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="top"><div><div class="brand">SAGI EVENT SYSTEM</div><div class="sub">赛事 · 比赛 · 积分 · 工具</div></div><div class="ver">V1.3</div></div><div id="notice" class="notice"></div>
<section id="event"><div class="card hero"><span class="badge">TORANHE / TFC / 青少年赛事</span><h1 id="hero">新建赛事</h1><div class="muted">8队赛事手机管理。支持单循环、A/B分组和双败制。</div><div class="kpis"><div class="k"><span>球队</span><b>8</b></div><div class="k"><span>比赛</span><b id="mc">0</b></div><div class="k"><span>完成</span><b id="dc">0</b></div></div></div>
<div class="card"><h2>赛事设置</h2><div class="grid"><div><label>赛事名称</label><input id="ename" value="冬季联赛"></div><div><label>地点</label><input id="loc" value="新疆塔城市"></div><div><label>赛制</label><select id="fmt"><option value="round">8队单循环</option><option value="groups">A/B组 + 淘汰赛</option><option value="double">8队双败制</option></select></div><div><label>首场日期</label><input id="date" type="date"></div><div><label>首场时间</label><input id="startTime" type="time" value="10:00"></div><div><label>单场时长（分钟）</label><input id="matchMinutes" type="number" min="10" max="180" value="50"></div><div><label>场间间隔（分钟）</label><input id="breakMinutes" type="number" min="0" max="120" value="10"></div><div><label>每天场次</label><input id="perDay" type="number" min="1" max="12" value="4"></div></div><div class="actions"><button id="gen" class="primary" type="button">生成赛事</button><button id="demo" type="button">载入示例</button><button id="clear" class="danger" type="button">清空</button></div><div id="selftest" class="test">脚本状态：正在初始化</div><div class="muted" style="margin-top:6px">单循环将自动按7轮排赛，并自动调整相邻场次，尽量避免同一支球队背靠背。</div></div>
<div class="card"><h2>球队</h2><div id="teamInputs" class="teams"></div></div></section>
<section id="matches" class="hidden"><div class="card"><h2>比赛中心</h2><div id="matchList" class="muted">请先生成赛事</div></div></section>
<section id="stand" class="hidden"><div id="standWrap"><div class="card muted">请先生成赛事</div></div></section>
<section id="tools" class="hidden"><div class="card"><h2>工具</h2><button id="summaryBtn" type="button">生成赛果摘要</button><textarea id="summary" class="hidden" style="width:100%;height:180px;margin-top:10px;background:#090909;color:#fff;border:1px solid #333;border-radius:12px;padding:10px"></textarea></div></section></div>
<nav class="nav"><button data-tab="event" class="active">赛事</button><button data-tab="matches">比赛</button><button data-tab="stand">积分</button><button data-tab="tools">工具</button></nav>
<script>
(function(){'use strict';
var S={name:'',loc:'',date:'',startTime:'10:00',matchMinutes:50,breakMinutes:10,perDay:4,fmt:'round',teams:['球队1','球队2','球队3','球队4','球队5','球队6','球队7','球队8'],matches:[],champ:null};
function q(x){return document.getElementById(x)}
function n(i){return Number.isInteger(i)?S.teams[i]:'待定'}
function M(id,stage,h,a,g){return{id:id,stage:stage,home:h,away:a,group:g||'',hs:null,as:null,status:'pending',active:true,sdate:'',stime:''}}
function pad2(v){return String(v).padStart(2,'0')}
function addDays(dateStr,days){if(!dateStr)return '';var p=dateStr.split('-').map(Number);var d=new Date(Date.UTC(p[0],p[1]-1,p[2]+days));return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())}
function timeToMin(t){var p=(t||'10:00').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)}
function minToTime(m){m=((m%1440)+1440)%1440;return pad2(Math.floor(m/60))+':'+pad2(m%60)}
function sameTeam(a,b){if(!a||!b)return false;return a.home===b.home||a.home===b.away||a.away===b.home||a.away===b.away}
function orderRoundNoBackToBack(round,prev){if(!round.length)return round;var pool=round.slice(),out=[];if(prev){var ix=pool.findIndex(function(m){return !sameTeam(prev,m)});if(ix>0){var x=pool.splice(ix,1)[0];pool.unshift(x)}}while(pool.length){var last=out.length?out[out.length-1]:prev;var j=pool.findIndex(function(m){return !last||!sameTeam(last,m)});if(j<0)j=0;out.push(pool.splice(j,1)[0])}return out}
function assignSchedule(){var a=visible(),per=Math.max(1,Math.min(12,parseInt(S.perDay,10)||4)),dur=Math.max(10,Math.min(180,parseInt(S.matchMinutes,10)||50)),br=Math.max(0,Math.min(120,parseInt(S.breakMinutes,10)||10)),base=timeToMin(S.startTime);a.forEach(function(m,i){var day=Math.floor(i/per),slot=i%per,total=base+slot*(dur+br),extra=Math.floor(total/1440);m.sdate=addDays(S.date,day+extra);m.stime=minToTime(total)})}

function note(t){var x=q('notice');x.textContent=t;x.style.display='block';setTimeout(function(){x.style.display='none'},1800)}
function visible(){return S.matches.filter(function(m){return m.active!==false})}
function save(){try{localStorage.setItem('sagi_v12',JSON.stringify(S))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem('sagi_v12')||'null');if(x&&Array.isArray(x.teams)&&Array.isArray(x.matches))S=Object.assign(S,x)}catch(e){}}
function readTeams(){var a=[];for(var i=0;i<8;i++){var x=q('t'+i);a.push(x&&x.value.trim()?x.value.trim():'球队'+(i+1))}return a}
function buildRound(){S.matches=[];var arr=[0,1,2,3,4,5,6,7],id=1,prev=null;for(var r=0;r<7;r++){var rr=[];for(var i=0;i<4;i++){rr.push(M('R'+id++,'第'+(r+1)+'轮',arr[i],arr[7-i]))}rr=orderRoundNoBackToBack(rr,prev);rr.forEach(function(m){S.matches.push(m)});prev=rr[rr.length-1];var fixed=arr[0],rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed].concat(rest)}}
function buildGroups(){S.matches=[];var k=1,gs=[['A',[0,1,2,3]],['B',[4,5,6,7]]];gs.forEach(function(g){for(var i=0;i<4;i++)for(var j=i+1;j<4;j++)S.matches.push(M('G'+k++,g[0]+'组',g[1][i],g[1][j],g[0]))});S.matches.push(M('SF1','半决赛1',null,null));S.matches.push(M('SF2','半决赛2',null,null));S.matches.push(M('F','决赛',null,null))}
function buildDouble(){S.matches=[M('W1','胜者组R1',0,7),M('W2','胜者组R1',3,4),M('W3','胜者组R1',1,6),M('W4','胜者组R1',2,5),M('W5','胜者组半决赛',null,null),M('W6','胜者组半决赛',null,null),M('L1','败者组R1',null,null),M('L2','败者组R1',null,null),M('L3','败者组R2',null,null),M('L4','败者组R2',null,null),M('W7','胜者组决赛',null,null),M('L5','败者组R3',null,null),M('L6','败者组决赛',null,null),M('GF','总决赛',null,null)]}
function generate(){try{S.name=q('ename').value.trim()||'未命名赛事';S.loc=q('loc').value.trim();S.date=q('date').value;S.startTime=q('startTime').value||'10:00';S.matchMinutes=parseInt(q('matchMinutes').value,10)||50;S.breakMinutes=parseInt(q('breakMinutes').value,10)||10;S.perDay=parseInt(q('perDay').value,10)||4;S.fmt=q('fmt').value;S.teams=readTeams();S.champ=null;if(S.fmt==='round')buildRound();else if(S.fmt==='groups')buildGroups();else buildDouble();assignSchedule();save();render();note('成功生成 '+visible().length+' 场比赛，并已排时间');switchTab('matches')}catch(e){alert('生成失败：'+e.message)}}
function table(group){var ids=group==='A'?[0,1,2,3]:group==='B'?[4,5,6,7]:[0,1,2,3,4,5,6,7],x={};ids.forEach(function(i){x[i]={i:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});S.matches.forEach(function(m){var ok=group?m.group===group:m.stage==='单循环';if(!ok||m.hs===null||m.as===null||!x[m.home]||!x[m.away])return;var h=x[m.home],a=x[m.away];h.p++;a.p++;h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;if(m.hs>m.as){h.w++;a.l++;h.pts+=3}else if(m.hs<m.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}});return Object.keys(x).map(function(k){var z=x[k];z.gd=z.gf-z.ga;return z}).sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf})}
function score(id,key,v){var m=S.matches.find(function(x){return x.id===id});if(!m)return;m[key]=v===''?null:Math.max(0,parseInt(v,10)||0);m.status=(m.hs!==null&&m.as!==null)?'done':'pending';save();render()}
function renderTeams(){q('teamInputs').innerHTML='';S.teams.forEach(function(t,i){var x=document.createElement('input');x.id='t'+i;x.value=t;q('teamInputs').appendChild(x)})}
function renderMatches(){var w=q('matchList'),a=visible();if(!a.length){w.innerHTML='请先生成赛事';return}w.innerHTML='';a.forEach(function(m,i){var d=document.createElement('div');d.className='match';var disabled=!(Number.isInteger(m.home)&&Number.isInteger(m.away));d.innerHTML='<div class="mh"><span>'+m.stage+' · #'+(i+1)+'</span><span>'+((m.sdate||m.stime)?((m.sdate||'')+' '+(m.stime||'')):(m.status==='done'?'已结束':'未开始'))+'</span></div><div class="score"><div class="home">'+n(m.home)+'</div><input data-id="'+m.id+'" data-k="hs" inputmode="numeric" '+(disabled?'disabled':'')+' value="'+(m.hs===null?'':m.hs)+'"><span>:</span><input data-id="'+m.id+'" data-k="as" inputmode="numeric" '+(disabled?'disabled':'')+' value="'+(m.as===null?'':m.as)+'"><div class="away">'+n(m.away)+'</div></div>';w.appendChild(d)});w.querySelectorAll('input[data-id]').forEach(function(x){x.addEventListener('change',function(){score(x.dataset.id,x.dataset.k,x.value)})})}
function tableHtml(title,a){var h='<div class="card"><h2>'+title+'</h2><table><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>净</th><th>分</th></tr>';a.forEach(function(x,i){h+='<tr><td>'+(i+1)+'</td><td>'+n(x.i)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+x.gd+'</td><td><b>'+x.pts+'</b></td></tr>'});return h+'</table></div>'}
function renderStand(){var w=q('standWrap');if(!S.matches.length){w.innerHTML='<div class="card muted">请先生成赛事</div>';return}if(S.fmt==='round')w.innerHTML=tableHtml('单循环积分榜',table('ALL'));else if(S.fmt==='groups')w.innerHTML=tableHtml('A组',table('A'))+tableHtml('B组',table('B'));else{var g={};visible().forEach(function(m){(g[m.stage]||(g[m.stage]=[])).push(m)});var h='<div class="card"><h2>双败对阵</h2>';Object.keys(g).forEach(function(k){h+='<div class="round">'+k+'</div>';g[k].forEach(function(m){h+='<div class="match">'+n(m.home)+'　'+(m.hs===null?'-':m.hs)+' : '+(m.as===null?'-':m.as)+'　'+n(m.away)+'</div>'})});w.innerHTML=h+'</div>'}}
function render(){q('hero').textContent=S.name||'新建赛事';q('ename').value=S.name||q('ename').value;q('loc').value=S.loc||q('loc').value;q('date').value=S.date||'';q('startTime').value=S.startTime||'10:00';q('matchMinutes').value=S.matchMinutes||50;q('breakMinutes').value=S.breakMinutes==null?10:S.breakMinutes;q('perDay').value=S.perDay||4;q('fmt').value=S.fmt||'round';q('mc').textContent=visible().length;q('dc').textContent=visible().filter(function(m){return m.status==='done'}).length;renderTeams();renderMatches();renderStand()}
function switchTab(name){['event','matches','stand','tools'].forEach(function(x){q(x).classList.toggle('hidden',x!==name)});document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===name)})}
function demo(){S.name='2026 托朗戈杯示例';S.loc='新疆';S.fmt='round';S.startTime='10:00';S.matchMinutes=50;S.breakMinutes=10;S.perDay=4;S.teams=['塔城','乌苏','托里','额敏','独山子','尼勒克','和丰','阿勒泰'];buildRound();assignSchedule();save();render();note('示例已载入并排好时间')}
function clearAll(){try{localStorage.removeItem('sagi_v12')}catch(e){}S={name:'',loc:'',date:'',startTime:'10:00',matchMinutes:50,breakMinutes:10,perDay:4,fmt:'round',teams:['球队1','球队2','球队3','球队4','球队5','球队6','球队7','球队8'],matches:[],champ:null};render();note('已清空')}
document.querySelectorAll('.nav button').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab)})});q('gen').addEventListener('click',generate);q('demo').addEventListener('click',demo);q('clear').addEventListener('click',clearAll);q('summaryBtn').addEventListener('click',function(){var a=[S.name,S.date,S.loc].filter(Boolean);visible().filter(function(m){return m.status==='done'}).forEach(function(m){a.push((m.sdate||'')+' '+(m.stime||'')+'｜'+m.stage+'｜'+n(m.home)+' '+m.hs+':'+m.as+' '+n(m.away))});q('summary').value=a.join('\n');q('summary').classList.remove('hidden')});
load();render();q('selftest').textContent='脚本状态：正常；时间排程与防背靠背已启用';
})();
</script></body></html>
