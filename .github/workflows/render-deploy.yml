name: Deploy SAGI Cloud to Render

on:
  push:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/**"
      - "render.yaml"
      - ".github/workflows/render-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Detect deploy hook
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No deploy hook configured; relying on Render autoDeployTrigger=commit."
          fi

      - name: Trigger Render deploy
        if: steps.hook.outputs.available == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --retry 3 "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for SAGI Cloud 3.9.3 + LOCAL AI V1.2
        run: |
          python - <<'PY'
          import json, time, urllib.request, sys
          url = "https://sagi-cloud-bridge-suny820916.onrender.com/health"
          expected = "3.9.3"
          for i in range(36):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      data = json.loads(r.read().decode("utf-8"))
                  version = str(data.get("version", ""))
                  voice = str(data.get("voiceDirectorVersion", ""))
                  semantic = bool(data.get("voiceSemanticLock"))
                  protected = bool(data.get("voiceSemanticMeaningProtected"))
                  exact = bool(data.get("voiceLockstepExactDuration"))
                  local_ai = str(data.get("localAIVersion", ""))
                  local_visual = str(data.get("localVisualVersion", ""))
                  local_ai_configured = bool(data.get("localAIConfigured"))
                  print(f"check {i+1}/36: version={version} voiceDirector={voice} semantic={semantic} protected={protected} exact={exact} localAI={local_ai} localVisual={local_visual} configured={local_ai_configured}")
                  if version == expected and voice == "2.4" and local_ai == "1.2" and local_visual == "1.2" and bool(data.get("localVisual")) and bool(data.get("animationFirst")) and bool(data.get("voiceOneShot")) and bool(data.get("voiceCaptionFromFinalAudio")) and semantic and protected and exact and bool(data.get("voiceVideoDurationLock")):
                      print(f"SAGI Cloud Voice Director 2.4 + LOCAL AI V1.2 + VISUAL verified. AI configured={local_ai_configured}")
                      sys.exit(0)
              except Exception as e:
                  print(f"check {i+1}/36 failed: {e}")
              time.sleep(10)
          print("Expected SAGI Cloud version 3.9.3 / Voice Director 2.4 / LOCAL AI V1.2 + VISUAL was not observed.")
          sys.exit(1)
          PY
