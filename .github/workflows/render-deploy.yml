name: Deploy SAGI Cloud to Render

on:
  push:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/**"
      - "render.yaml"
      - ".github/workflows/render-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Detect deploy hook
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No deploy hook configured; relying on Render autoDeployTrigger=commit."
          fi

      - name: Trigger Render deploy
        if: steps.hook.outputs.available == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --retry 3 "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for SAGI Cloud 3.9.3 + MARKET V1.1
        run: |
          python - <<'PY'
          import json, time, urllib.request, sys
          url = "https://sagi-cloud-bridge-suny820916.onrender.com/health"
          expected = "3.9.4"
          for i in range(36):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      data = json.loads(r.read().decode("utf-8"))
                  version = str(data.get("version", ""))
                  voice = str(data.get("voiceDirectorVersion", ""))
                  semantic = bool(data.get("voiceSemanticLock"))
                  protected = bool(data.get("voiceSemanticMeaningProtected"))
                  exact = bool(data.get("voiceLockstepExactDuration"))
                  local_ai = str(data.get("localAIVersion", ""))
                  local_visual = str(data.get("localVisualVersion", ""))
                  local_poster = str(data.get("localPosterVersion", ""))
                  local_ai_configured = bool(data.get("localAIConfigured"))
                  deploy_revision = str(data.get("deployRevision", ""))
                  market_intake = bool(data.get("marketIntake"))
                  market_version = str(data.get("marketIntakeVersion", ""))
                  print(f"check {i+1}/36: version={version} revision={deploy_revision} market={market_intake}/{market_version} voiceDirector={voice} localAI={local_ai} localVisual={local_visual} localPoster={local_poster}")
                  if version == expected and deploy_revision == "2026-11-12-match-intelligence-v100" and bool(data.get("matchIntelligence")) and str(data.get("matchIntelligenceVersion", "")) == "1.0-cloud-lite" and market_intake and market_version == "1.1" and voice == "2.4" and local_ai == "1.2" and local_visual == "1.2" and local_poster == "1.2.1" and bool(data.get("localVisual")) and bool(data.get("localPoster")) and bool(data.get("animationFirst")) and bool(data.get("voiceOneShot")) and bool(data.get("voiceCaptionFromFinalAudio")) and semantic and protected and exact and bool(data.get("voiceVideoDurationLock")):
                      print(f"SAGI Cloud 3.9.4 + Match Intelligence V1.0 + MARKET V1.1 verified. AI configured={local_ai_configured}")
                      sys.exit(0)
              except Exception as e:
                  print(f"check {i+1}/36 failed: {e}")
              time.sleep(10)
          print("Expected SAGI Cloud 3.9.4 + Match Intelligence V1.0 was not observed.")
          sys.exit(1)
          PY
