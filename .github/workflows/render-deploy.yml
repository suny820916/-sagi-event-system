name: Deploy SAGI Cloud to Render

on:
  push:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/**"
      - "render.yaml"
      - ".github/workflows/render-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Render deployment credentials
        id: render_auth
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "mode=hook" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook configured."
          elif [ -n "$RENDER_API_KEY" ]; then
            echo "mode=api" >> "$GITHUB_OUTPUT"
            echo "Render API key configured."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::error::No Render deployment credential is configured. Add repository secret RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY."
          fi

      - name: Trigger Render deploy via hook
        if: steps.render_auth.outputs.mode == 'hook'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          SEP='?'
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) SEP='&' ;; esac
          curl --fail --show-error --silent --retry 3 "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${GITHUB_SHA}"

      - name: Trigger Render deploy via API
        if: steps.render_auth.outputs.mode == 'api'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BLUEPRINT_ID: exs-dbp5r0e1egvs73b59730
          RENDER_SERVICE_NAME: sagi-cloud-bridge-suny820916
        run: |
          set -euo pipefail
          BP="$(curl --fail --show-error --silent --retry 3 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/blueprints/$RENDER_BLUEPRINT_ID")"
          SERVICE_ID="$(python -c 'import json,sys; d=json.load(sys.stdin); n=sys.argv[1]; rows=d.get("resources") or []; print(next((str(x.get("id") or "") for x in rows if x.get("name")==n),""))' "$RENDER_SERVICE_NAME" <<<"$BP")"
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Render Blueprint did not expose service $RENDER_SERVICE_NAME."
            exit 1
          fi
          echo "Deploying Render service $RENDER_SERVICE_NAME ($SERVICE_ID) at commit $GITHUB_SHA"
          curl --fail --show-error --silent --retry 3 \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "{"commitId":"$GITHUB_SHA","clearCache":"do_not_clear"}" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys"

      - name: Stop when no Render credential is configured
        if: steps.render_auth.outputs.mode == 'none'
        run: |
          echo "Render Blueprint: https://dashboard.render.com/blueprint/exs-dbp5r0e1egvs73b59730"
          echo "Configure one GitHub Actions secret: RENDER_DEPLOY_HOOK_URL (recommended) or RENDER_API_KEY."
          exit 1

      - name: Wait for SAGI Cloud 3.9.8 + LARGE SMART CUT
        run: |
          python - <<'PY'
          import json, time, urllib.request, sys
          url = "https://sagi-cloud-bridge-suny820916.onrender.com/health"
          expected = "3.9.8"
          for i in range(36):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      data = json.loads(r.read().decode("utf-8"))
                  version = str(data.get("version", ""))
                  voice = str(data.get("voiceDirectorVersion", ""))
                  semantic = bool(data.get("voiceSemanticLock"))
                  protected = bool(data.get("voiceSemanticMeaningProtected"))
                  exact = bool(data.get("voiceLockstepExactDuration"))
                  local_ai = str(data.get("localAIVersion", ""))
                  local_visual = str(data.get("localVisualVersion", ""))
                  local_poster = str(data.get("localPosterVersion", ""))
                  local_ai_configured = bool(data.get("localAIConfigured"))
                  deploy_revision = str(data.get("deployRevision", ""))
                  market_intake = bool(data.get("marketIntake"))
                  market_version = str(data.get("marketIntakeVersion", ""))
                  print(f"check {i+1}/36: version={version} revision={deploy_revision} market={market_intake}/{market_version} voiceDirector={voice} localAI={local_ai} localVisual={local_visual} localPoster={local_poster}")
                  if version == expected and deploy_revision == "2026-11-21-voice-pro-origin-wake-hotfix-v1" and bool(data.get("matchIntelligence")) and str(data.get("matchIntelligenceVersion", "")) == "1.1.2-tracking-core" and market_intake and market_version == "1.1" and voice == "2.4" and local_ai == "1.2" and local_visual == "1.2" and local_poster == "1.2.1" and bool(data.get("localVisual")) and bool(data.get("localPoster")) and bool(data.get("animationFirst")) and bool(data.get("voiceOneShot")) and bool(data.get("voiceCaptionFromFinalAudio")) and semantic and protected and exact and bool(data.get("voiceVideoDurationLock")) and bool(data.get("smartCutCloud")) and str(data.get("smartCutCloudVersion", "")) == "1.1" and bool(data.get("smartCutLargeMedia")) and bool(data.get("smartCutLowMemory")) and bool(data.get("smartCutChunkUpload")) and str(data.get("smartCutChunkUploadVersion", "")) == "1.0" and bool(data.get("voicePro")) and str(data.get("voiceProVersion", "")) == "1.0":
                      print(f"SAGI Cloud 3.9.8 + LARGE SMART CUT + VOICE PRO 1.0 + Match Intelligence + MARKET verified. AI configured={local_ai_configured}")
                      sys.exit(0)
              except Exception as e:
                  print(f"check {i+1}/36 failed: {e}")
              time.sleep(10)
          print("Expected SAGI Cloud 3.9.8 + LARGE SMART CUT + VOICE PRO 1.0 was not observed.")
          sys.exit(1)
          PY
