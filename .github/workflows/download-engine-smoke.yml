name: SAGI Download Engine Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/**"
      - "content-os/sagi-down.html"
      - ".github/workflows/download-engine-smoke.yml"
  workflow_dispatch:

jobs:
  download-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify public platform engines
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error

          # BTCH: opportunistic only. Basic HTTP/CORS should work; deep upstream
          # degradation is recorded but does not fail the release.
          btch="https://btch-downloader-api-green.vercel.app"
          req=urllib.request.Request(btch+"/api/health",headers={
              "Origin":"https://suny820916.github.io","User-Agent":"SAGI-engine-smoke"
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              body=json.loads(r.read().decode())
              cors=r.headers.get("access-control-allow-origin","")
              assert r.status == 200 and body.get("success") is True
              assert cors in ("*","https://suny820916.github.io")
          try:
              req=urllib.request.Request(btch+"/api/health?deep=1",headers={"User-Agent":"SAGI-engine-smoke"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  deep=json.loads(r.read().decode())
              print("BTCH_DEEP",deep)
          except urllib.error.HTTPError as e:
              print("BTCH_DEGRADED",e.code)
              assert e.code in (429,500,502,503,504)

          # TikWM: real public TikTok resolver. A public node may rate-limit
          # cloud runners, so record degradation but continue to FxTwitter.
          tik_ok=False
          try:
              tik_url="https://www.tiktok.com/@scout2015/video/6718335390845095173"
              data=urllib.parse.urlencode({"url":tik_url}).encode()
              req=urllib.request.Request("https://www.tikwm.com/api/",data=data,headers={
                  "Origin":"https://suny820916.github.io",
                  "Referer":"https://www.tikwm.com/",
                  "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1",
                  "Content-Type":"application/x-www-form-urlencoded",
                  "Accept":"application/json",
              },method="POST")
              with urllib.request.urlopen(req,timeout=35) as r:
                  tik=json.loads(r.read().decode())
                  print("TIKWM_HTTP",r.status,"CORS",r.headers.get("access-control-allow-origin",""))
              assert int(tik.get("code", -1)) == 0, tik
              td=tik.get("data") or {}
              tik_media=td.get("hdplay") or td.get("play") or ((td.get("images") or [None])[0])
              assert tik_media, td
              req=urllib.request.Request(tik_media,headers={
                  "User-Agent":"Mozilla/5.0","Range":"bytes=0-2047"
              })
              with urllib.request.urlopen(req,timeout=25) as r:
                  sample=r.read(2048)
                  ctype=(r.headers.get("content-type") or "").lower()
                  print("TIKWM_MEDIA",r.status,ctype,len(sample))
              assert len(sample) > 128
              tik_ok=True
              print("TIKWM_OK")
          except urllib.error.HTTPError as e:
              print("TIKWM_DEGRADED",e.code)
          except Exception as e:
              print("TIKWM_DEGRADED",repr(e))

          # FxTwitter: discover a current video dynamically instead of relying
          # on a hard-coded post that can be deleted.
          fx=None
          fx_video=None
          for handle in ("FIFAWorldCup","UEFA","ESPNFC","ChampionsLeague"):
              try:
                  url="https://api.fxtwitter.com/2/profile/"+handle+"/media?count=20"
                  req=urllib.request.Request(url,headers={
                      "Origin":"https://suny820916.github.io",
                      "User-Agent":"SAGI-engine-smoke","Accept":"application/json",
                  })
                  with urllib.request.urlopen(req,timeout=25) as r:
                      candidate=json.loads(r.read().decode())
                      print("FX_PROFILE",handle,r.status,"CORS",r.headers.get("access-control-allow-origin",""))
                  if int(candidate.get("code") or 0) != 200:
                      continue
                  for status in candidate.get("results") or []:
                      media=(status or {}).get("media") or {}
                      videos=media.get("videos") or []
                      if videos and str(videos[0].get("url") or "").startswith("http"):
                          fx=candidate
                          fx_video=videos[0]["url"]
                          print("FX_VIDEO_FOUND",handle,(status or {}).get("id"))
                          break
                  if fx_video:
                      break
              except urllib.error.HTTPError as e:
                  print("FX_PROFILE_DEGRADED",handle,e.code)
              except Exception as e:
                  print("FX_PROFILE_DEGRADED",handle,repr(e))
          assert fx_video, "FxTwitter returned no current public video across test profiles"
          try:
              req=urllib.request.Request(fx_video,headers={
                  "User-Agent":"Mozilla/5.0","Referer":"https://x.com/","Range":"bytes=0-2047"
              })
              with urllib.request.urlopen(req,timeout=25) as r:
                  sample=r.read(2048)
                  ctype=(r.headers.get("content-type") or "").lower()
                  print("FX_MEDIA",r.status,ctype,len(sample))
              assert len(sample) > 128
              print("FXTWITTER_MEDIA_OK")
          except urllib.error.HTTPError as e:
              # X video CDN can deny datacenter Range requests even while the
              # browser-facing resolver is healthy, so API resolution is the
              # required signal and CDN byte fetch is additional telemetry.
              print("FX_MEDIA_CLOUD_RESTRICTED",e.code)
          print("FXTWITTER_OK")
          PY

      - name: Verify router source order
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("sagi-cloud-bridge/app.py").read_text(encoding="utf-8")
          assert '"instagram": ["parth-dl", "btch"]' in s
          assert '"tiktok": ["tikwm", "btch"]' in s
          assert '"twitter": ["fxtwitter", "btch"]' in s
          assert 'platform == "youtube"' in s and 'run_router_engine(job_id, "btch"' in s
          print("ROUTER_ORDER_OK")
          PY
