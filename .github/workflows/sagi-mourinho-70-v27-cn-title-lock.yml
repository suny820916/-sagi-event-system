name: SAGI MOURINHO 70S V2.7 CN TITLE LOCK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sagi-mourinho-70-v27-cn-title-lock.yml"
      - "cloud-blender-worker/overlay/mourinho_70s_v27_cn_title_lock.ass"
concurrency:
  group: sagi-mourinho-v27-cn-title-lock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Build Blender image
        run: docker build -t sagi-mourinho-v27 ./cloud-blender-worker
      - name: Render 70s V5.13-preserved tactical master
        run: |
          set -euo pipefail
          mkdir -p mourinho_v27_out/critical_frames
          docker run --rm -v "$PWD/mourinho_v27_out:/out" sagi-mourinho-v27 bash -lc '
            set -euo pipefail
            blender --background --python /app/engine/sagi_tactical_mourinho_70_v13.py -- /app/presets/mourinho_real_madrid_4231_70s_v26_v513_master_readability.json /out
            ffmpeg -y -loglevel error -framerate 30 -i /out/frames/frame_%04d.png -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -map 0:v:0 -map 1:a:0 -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -preset veryfast -crf 20 -c:a aac -b:a 64k -shortest -movflags +faststart /out/V27_BASE_NO_TITLES.mp4
          '
          sudo chown -R "$USER":"$USER" mourinho_v27_out
      - name: Add locked Chinese title and subtitle system
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          ffmpeg -y -loglevel error -i mourinho_v27_out/V27_BASE_NO_TITLES.mp4 -vf "ass=cloud-blender-worker/overlay/mourinho_70s_v27_cn_title_lock.ass" -c:v libx264 -profile:v baseline -level 3.1 -pix_fmt yuv420p -preset veryfast -crf 20 -c:a copy -movflags +faststart mourinho_v27_out/SAGI_MOURINHO_70S_V27_CN_TITLE_LOCK.mp4
          for t in 4 12 20 28 36 44 52 60 68; do
            ffmpeg -y -loglevel error -ss "$t" -i mourinho_v27_out/SAGI_MOURINHO_70S_V27_CN_TITLE_LOCK.mp4 -frames:v 1 "mourinho_v27_out/critical_frames/${t}.jpg"
          done
          python3 - <<'PY'
          import json,subprocess
          p='mourinho_v27_out/'
          r=json.load(open(p+'execution_report.json'))
          assert r['valid'] and r['duration_sec']==70 and not r['errors'],r
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',p+'SAGI_MOURINHO_70S_V27_CN_TITLE_LOCK.mp4']).decode())
          assert abs(d-70)<0.05,d
          assert '穆里尼奥的皇马' in open('cloud-blender-worker/overlay/mourinho_70s_v27_cn_title_lock.ass').read()
          r['packaging_version']='V2.7 CN TITLE LOCK'
          r['title_layer']='Chinese main title, subtitle, tactical chapter headings'
          r['final_mp4_duration_sec']=d
          r['teactics_exact_source_visual_acceptance']='NOT_VERIFIED'
          json.dump(r,open(p+'execution_report_v27.json','w'),ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SAGI-MOURINHO-70S-V2.7-CN-TITLE-LOCK
          path: |
            mourinho_v27_out/SAGI_MOURINHO_70S_V27_CN_TITLE_LOCK.mp4
            mourinho_v27_out/critical_frames/*.jpg
            mourinho_v27_out/execution_report_v27.json
            mourinho_v27_out/scene.blend
            cloud-blender-worker/overlay/mourinho_70s_v27_cn_title_lock.ass
          retention-days: 7
