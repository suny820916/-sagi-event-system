name: SAGI PLAYER INTRO V3.6 DUAL TEAM LINEUP test

on:
  push:
    paths:
      - 'intro/v36.html'
      - 'intro/vmix-v36.html'
      - '.github/workflows/intro-v36-e2e.yml'

permissions:
  contents: write

jobs:
  v36-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Chrome
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          test -n "$CHROME_BIN"
      - name: Run V3.6 DUAL TEAM LINEUP tests
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/intro-v36-http.log 2>&1 &
          sleep 2
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const out=[],errs=[];const add=(n,ok,d='')=>out.push({n,ok:!!ok,d});let browser;
            try{
              browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await context.route('https://audio.test/**',async route=>route.fulfill({status:200,contentType:'audio/mpeg',body:Buffer.from('49443303000000000000','hex')}));
              const page=await context.newPage();
              page.on('pageerror',e=>errs.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource')&&!m.text().includes('MEDIA_ELEMENT_ERROR'))errs.push('console: '+m.text())});
              const r=await page.goto('http://127.0.0.1:8080/intro/v36.html',{waitUntil:'networkidle'});
              add('页面HTTP 200',r&&r.status()===200,String(r&&r.status()));
              add('标题V3.6 DUAL TEAM',(await page.title())==='SAGI PLAYER INTRO V3.6 · DUAL TEAM LINEUP',await page.title());
              add('手机端无横向溢出',await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+4),await page.evaluate(()=>document.documentElement.scrollWidth+' / '+innerWidth));
              add('默认输出为TUNNEL',(await page.locator('#outputBg').inputValue())==='tunnel',await page.locator('#outputBg').inputValue());
              add('TUNNEL场景存在',await page.locator('#tunnelScene').count()===1);
              add('舞台scene-tunnel启用',await page.locator('#stage').evaluate(el=>el.classList.contains('scene-tunnel')));
              add('左LED显示球队',(await page.locator('#ledLeft').textContent()).includes('TARLAN FC'),await page.locator('#ledLeft').textContent());
              add('右LED显示SAGI',(await page.locator('#ledRight').textContent()).includes('SAGI'),await page.locator('#ledRight').textContent());
              add('HOME/AWAY切换按钮存在',await page.locator('#homeSideBtn').count()===1&&await page.locator('#awaySideBtn').count()===1);
              add('默认当前为HOME',(await page.locator('#stage').getAttribute('data-side'))==='HOME',await page.locator('#stage').getAttribute('data-side'));
              add('HOME队名正确',(await page.locator('#teamName').inputValue())==='TARLAN FC',await page.locator('#teamName').inputValue());
              add('SHOW TIMELINE默认15段',await page.locator('#showTimeline .showStep').count()===15,String(await page.locator('#showTimeline .showStep').count()));
              add('SHOW默认总时长57.0秒',(await page.locator('#showTotal').textContent())==='57.0s',await page.locator('#showTotal').textContent());
              add('SHOW整套预演按钮存在',await page.locator('#showPlayBtn').count()===1);
              add('SHOW上一段按钮存在',await page.locator('#showPrevBtn').count()===1);
              add('SHOW下一段按钮存在',await page.locator('#showNextBtn').count()===1);
              const defaultShowNames=await page.locator('#showTimeline .showName').allTextContents();
              add('SHOW默认双队顺序正确',defaultShowNames.join('|')==='Logo Sting|比赛信息|开场倒计时|主队开场|主队门将|主队后卫|主队中场|主队前锋|主队完整首发|客队开场|客队门将|客队后卫|客队中场|客队前锋|客队完整首发',defaultShowNames.join('|'));
              await page.locator('#showTimeline .showStep').first().locator('.down').click();await page.waitForTimeout(60);
              const movedShowNames=await page.locator('#showTimeline .showName').allTextContents();
              add('SHOW顺序可调整',movedShowNames[0]==='比赛信息'&&movedShowNames[1]==='Logo Sting',movedShowNames.join('|'));
              await page.click('#showResetBtn');await page.waitForTimeout(60);
              add('SHOW恢复默认顺序',(await page.locator('#showTimeline .showName').first().textContent())==='Logo Sting',await page.locator('#showTimeline .showName').first().textContent());
              const firstShow=page.locator('#showTimeline .showStep').first(),lastShow=page.locator('#showTimeline .showStep').last();
              await firstShow.locator('.showDur').fill('1.5');await firstShow.locator('.showDur').dispatchEvent('change');
              await firstShow.locator('.showTransition').selectOption('FLASH');await firstShow.locator('.showCue').selectOption('STING');
              await lastShow.locator('.showEnable input').uncheck();await page.waitForTimeout(60);
              add('SHOW段时长可编辑',(await firstShow.locator('.showDur').inputValue())==='1.5',await firstShow.locator('.showDur').inputValue());
              add('SHOW转场可编辑',(await firstShow.locator('.showTransition').inputValue())==='FLASH',await firstShow.locator('.showTransition').inputValue());
              add('SHOW Cue可编辑',(await firstShow.locator('.showCue').inputValue())==='STING',await firstShow.locator('.showCue').inputValue());
              add('SHOW段可禁用',!(await lastShow.locator('.showEnable input').isChecked()));
              add('SHOW禁用后总时长50.5秒',(await page.locator('#showTotal').textContent())==='50.5s',await page.locator('#showTotal').textContent());
              await page.click('#showSaveBtn');await page.reload({waitUntil:'networkidle'});await page.waitForTimeout(100);
              add('SHOW保存后时长不丢失',(await page.locator('#showTimeline .showStep').first().locator('.showDur').inputValue())==='1.5',await page.locator('#showTimeline .showStep').first().locator('.showDur').inputValue());
              add('SHOW保存后转场不丢失',(await page.locator('#showTimeline .showStep').first().locator('.showTransition').inputValue())==='FLASH',await page.locator('#showTimeline .showStep').first().locator('.showTransition').inputValue());
              add('SHOW保存后Cue不丢失',(await page.locator('#showTimeline .showStep').first().locator('.showCue').inputValue())==='STING',await page.locator('#showTimeline .showStep').first().locator('.showCue').inputValue());
              add('SHOW保存后禁用状态不丢失',!(await page.locator('#showTimeline .showStep').last().locator('.showEnable input').isChecked()));
              await page.click('#showResetBtn');await page.waitForTimeout(60);
              const firstLive=page.locator('#showTimeline .showStep').first(),secondLive=page.locator('#showTimeline .showStep').nth(1);
              await firstLive.locator('.showDur').fill('0.5');await firstLive.locator('.showDur').dispatchEvent('change');
              await firstLive.locator('.showTransition').selectOption('FADE');await firstLive.locator('.showCue').selectOption('RISER');
              await secondLive.locator('.showEnable input').uncheck();
              
              add('MATCH PACKAGE赛事名称控件存在',await page.locator('#matchCompetition').count()===1);
              add('MATCH PACKAGE主客队控件存在',await page.locator('#matchHome').count()===1&&await page.locator('#matchAway').count()===1);
              add('赛事Logo上传控件存在',await page.locator('#eventLogoFile').count()===1);
              add('主音乐上传控件存在',await page.locator('#musicFile').count()===1);
              add('真实Cue URL控件存在',await page.locator('#sfxWhoosh').count()===1&&await page.locator('#sfxHit').count()===1&&await page.locator('#sfxRiser').count()===1&&await page.locator('#sfxCrowd').count()===1&&await page.locator('#sfxSting').count()===1);
              add('AUDIO ENGINE四种模式',await page.locator('#audioMode option').count()===4,String(await page.locator('#audioMode option').count()));
              add('AUDIO ENGINE三套主题',await page.locator('#audioTheme option').count()===3,String(await page.locator('#audioTheme option').count()));
              add('Ducking控件存在',await page.locator('#audioDucking').count()===1);
              add('Cue音量控件存在',await page.locator('#cueVolume').count()===1);
              add('倒计时节拍控件存在',await page.locator('#countdownBeat').count()===1);
              await page.fill('#matchCompetition','TFC WINTER LEAGUE');
              await page.fill('#matchRound','MATCHDAY 03');
              await page.fill('#matchHome','TARLAN FC');
              await page.fill('#matchAway','ICE POINT FC');
              await page.fill('#matchKickoff','14:30');
              await page.fill('#matchVenue','TACHENG SPORTS CENTER');
              await page.locator('#eventLogoFile').setInputFiles({name:'event.png',mimeType:'image/png',buffer:Buffer.from('89504e470d0a1a0a','hex')});await page.waitForTimeout(80);
              add('赛事Logo预览生成',await page.locator('#eventLogoPreview img').count()===1,String(await page.locator('#eventLogoPreview img').count()));
              await page.locator('#musicFile').setInputFiles({name:'show.mp3',mimeType:'audio/mpeg',buffer:Buffer.from('49443303000000000000','hex')});await page.waitForTimeout(50);
              add('本机主音乐已载入',(await page.locator('#musicPreview').textContent()).includes('AUDIO'),await page.locator('#musicPreview').textContent());
              await page.click('#clearMusicBtn');await page.waitForTimeout(30);
              await page.fill('#musicUrl','https://audio.test/show.mp3');
              await page.selectOption('#musicVolume','0.65');
              await page.fill('#sfxWhoosh','https://audio.test/whoosh.mp3');
              await page.fill('#sfxHit','https://audio.test/hit.mp3');
              await page.fill('#sfxRiser','https://audio.test/riser.mp3');
              await page.fill('#sfxCrowd','https://audio.test/crowd.mp3');
              await page.fill('#sfxSting','https://audio.test/sting.mp3');
              await page.selectOption('#audioMode','BUILTIN');await page.selectOption('#audioTheme','NORTH_WIND');await page.selectOption('#audioDucking','0.35');
              await page.fill('#musicUrl','');await page.click('#audioTestBtn');await page.waitForTimeout(80);
              add('BUILT-IN主音乐可启动',(await page.locator('#stage').getAttribute('data-music'))==='builtin',await page.locator('#stage').getAttribute('data-music'));
              add('NORTH WIND主题生效',(await page.locator('#stage').getAttribute('data-audio-theme'))==='NORTH_WIND',await page.locator('#stage').getAttribute('data-audio-theme'));
              await page.click('#cueTestBtn');await page.waitForTimeout(40);
              add('BUILT-IN HIT Cue可触发',(await page.locator('#stage').getAttribute('data-cue-source'))==='builtin',await page.locator('#stage').getAttribute('data-cue-source'));
              await page.click('#audioStopBtn');
              await page.selectOption('#audioMode','HYBRID');await page.selectOption('#audioTheme','SAGI_PULSE');await page.fill('#musicUrl','https://audio.test/show.mp3');
              await page.click('#audioTestBtn');await page.waitForTimeout(50);
              add('HYBRID远端主音乐优先',(await page.locator('#stage').getAttribute('data-music'))==='external',await page.locator('#stage').getAttribute('data-music'));
              await page.click('#cueTestBtn');await page.waitForTimeout(40);
              add('HYBRID真实HIT Cue优先',(await page.locator('#stage').getAttribute('data-cue-source'))==='real',await page.locator('#stage').getAttribute('data-cue-source'));
              add('Ducking被触发',(await page.locator('#stage').getAttribute('data-duck'))==='active'||(await page.locator('#stage').getAttribute('data-duck'))==='idle',await page.locator('#stage').getAttribute('data-duck'));
              await page.selectOption('#audioMode','MUTE');await page.click('#audioTestBtn');await page.waitForTimeout(30);
              add('MUTE模式生效',(await page.locator('#stage').getAttribute('data-music'))==='muted',await page.locator('#stage').getAttribute('data-music'));
              await page.selectOption('#audioMode','HYBRID');await page.click('#audioStopBtn');
              add('比赛信息实时同步赛事名',(await page.locator('#matchCompetitionStage').textContent())==='TFC WINTER LEAGUE',await page.locator('#matchCompetitionStage').textContent());
              add('比赛信息实时同步客队',(await page.locator('#matchAwayStage').textContent())==='ICE POINT FC',await page.locator('#matchAwayStage').textContent());
              await page.click('#saveBtn');await page.waitForTimeout(120);
              await page.fill('#matchAway','TEMP');await page.fill('#musicUrl','');
              await page.click('#loadBtn');await page.waitForTimeout(220);
              add('比赛包装保存读取客队不丢失',(await page.locator('#matchAway').inputValue())==='ICE POINT FC',await page.locator('#matchAway').inputValue());
              add('比赛包装保存读取音乐URL不丢失',(await page.locator('#musicUrl').inputValue())==='https://audio.test/show.mp3',await page.locator('#musicUrl').inputValue());
              add('比赛包装保存读取Cue URL不丢失',(await page.locator('#sfxHit').inputValue())==='https://audio.test/hit.mp3',await page.locator('#sfxHit').inputValue());
              add('STING URL保存读取不丢失',(await page.locator('#sfxSting').inputValue())==='https://audio.test/sting.mp3',await page.locator('#sfxSting').inputValue());
              add('AUDIO ENGINE模式保存读取不丢失',(await page.locator('#audioMode').inputValue())==='HYBRID',await page.locator('#audioMode').inputValue());
              add('AUDIO ENGINE主题保存读取不丢失',(await page.locator('#audioTheme').inputValue())==='SAGI_PULSE',await page.locator('#audioTheme').inputValue());

              const rows=await page.locator('#roster .playerRow').count();
              add('示例名单共16人',rows===16,String(rows));
              const metas=await page.locator('#roster .pmeta').allTextContents();
              add('首发11人+替补5人',metas.filter(x=>!x.startsWith('SUB')).length===11&&metas.filter(x=>x.startsWith('SUB')).length===5,metas.join('|'));
              add('队长C存在',(await page.locator('#roster .pname').allTextContents()).some(x=>x.includes('C')));
              add('球员数据存在',metas.some(x=>x.includes('GOALS'))&&metas.some(x=>x.includes('ASSISTS'))&&metas.some(x=>x.includes('CLEAN SHEETS')),metas.join('|'));
              add('HOME首名球员AZAMAT',(await page.locator('#roster .pname').first().textContent()).includes('AZAMAT'),await page.locator('#roster .pname').first().textContent());
              await page.click('#awaySideBtn');await page.waitForTimeout(90);
              add('切换AWAY成功',(await page.locator('#stage').getAttribute('data-side'))==='AWAY',await page.locator('#stage').getAttribute('data-side'));
              add('AWAY队名正确',(await page.locator('#teamName').inputValue())==='ICE POINT FC',await page.locator('#teamName').inputValue());
              add('AWAY名单16人',await page.locator('#roster .playerRow').count()===16,String(await page.locator('#roster .playerRow').count()));
              add('AWAY首名球员MURAT',(await page.locator('#roster .pname').first().textContent()).includes('MURAT'),await page.locator('#roster .pname').first().textContent());
              await page.selectOption('#formation','4-4-2');await page.waitForTimeout(40);
              await page.locator('#crestFile').setInputFiles({name:'away.png',mimeType:'image/png',buffer:Buffer.from('89504e470d0a1a0a02','hex')});await page.waitForTimeout(70);
              const awayCrest=await page.locator('#crestPreview img').getAttribute('src');
              await page.click('#homeSideBtn');await page.waitForTimeout(90);
              add('切回HOME成功',(await page.locator('#stage').getAttribute('data-side'))==='HOME',await page.locator('#stage').getAttribute('data-side'));
              add('HOME阵型没有被客队覆盖',(await page.locator('#formation').inputValue())==='4-3-3',await page.locator('#formation').inputValue());
              add('HOME名单仍16人',await page.locator('#roster .playerRow').count()===16,String(await page.locator('#roster .playerRow').count()));
              await page.locator('#crestFile').setInputFiles({name:'home.png',mimeType:'image/png',buffer:Buffer.from('89504e470d0a1a0a01','hex')});await page.waitForTimeout(70);
              const homeCrest=await page.locator('#crestPreview img').getAttribute('src');
              add('HOME/AWAY队徽独立',homeCrest!==awayCrest,String(homeCrest!==awayCrest));
              await page.click('#saveBtn');await page.waitForTimeout(420);
