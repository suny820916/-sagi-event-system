name: SAGI TEST 04 CAMERA EXIT

concurrency:
  group: sagi-test04-camera-exit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/presets/christmas_tree_execution_test04_camera_exit.json"
      - ".github/workflows/sagi-test04-camera-exit.yml"
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v1.py"
  workflow_dispatch:

jobs:
  render-test04:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-test04 ./cloud-blender-worker

      - name: Render TEST 04 and encode iPhone-safe MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test04_out
          docker run --rm \
            -v "$PWD/test04_out:/out" \
            sagi-test04 \
            bash -lc '
              blender --background \
                --python /app/engine/sagi_tactical_execution_director_v1.py \
                -- \
                /app/presets/christmas_tree_execution_test04_camera_exit.json \
                /out

              ffmpeg -y -loglevel error \
                -framerate 24 \
                -i /out/frames/frame_%04d.png \
                -f lavfi \
                -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 \
                -profile:v baseline \
                -level 3.1 \
                -pix_fmt yuv420p \
                -preset veryfast \
                -crf 23 \
                -c:a aac \
                -b:a 64k \
                -shortest \
                -movflags +faststart \
                /out/SAGI_TEST04_CAMERA_EXIT.mp4

              ffprobe -v error \
                -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
                -of json \
                /out/SAGI_TEST04_CAMERA_EXIT.mp4 \
                > /out/probe.json
            '
          sudo chown -R "$USER":"$USER" test04_out
          test -s test04_out/SAGI_TEST04_CAMERA_EXIT.mp4
          cat test04_out/execution_report.json
          cat test04_out/probe.json

      - name: Upload TEST 04 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-TEST04-CAMERA-EXIT
          path: |
            test04_out/SAGI_TEST04_CAMERA_EXIT.mp4
            test04_out/execution_report.json
            test04_out/probe.json
            test04_out/scene.blend
          retention-days: 7
