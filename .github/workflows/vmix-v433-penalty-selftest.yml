name: SAGI vMix V4.33 Penalty Core

on:
  push:
    paths:
      - "intro/sagi-penalty-core-v433.js"
      - "intro/v45-lan.html"
      - "intro/vmix-v45-lan.html"
      - "intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat"
      - "intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat"
      - "intro/tests/v433-penalty-core-selftest.mjs"
      - "intro/tests/v433-penalty-integration-selftest.mjs"
      - ".github/workflows/vmix-v433-penalty-selftest.yml"
  pull_request:
    paths:
      - "intro/sagi-penalty-core-v433.js"
      - "intro/v45-lan.html"
      - "intro/vmix-v45-lan.html"
      - "intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat"
      - "intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat"
      - "intro/tests/v4270-browser-selftest.mjs"
      - "intro/tests/v433-penalty-core-selftest.mjs"
      - "intro/tests/v433-penalty-integration-selftest.mjs"
      - ".github/workflows/vmix-v433-penalty-selftest.yml"
  workflow_dispatch:

jobs:
  penalty-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run V4.33 penalty core self-test
        run: node intro/tests/v433-penalty-core-selftest.mjs
      - name: Run V4.33 live/package integration gate
        run: node intro/tests/v433-penalty-integration-selftest.mjs


  windows-package:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Parse V4.33 RC BAT and embedded Bridge with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat'
          $source = [IO.File]::ReadAllText((Resolve-Path $path), [Text.Encoding]::UTF8)
          $pattern = '(?s)###SAGI_PS###\r?\n(.*?)\r?\n###SAGI_CONTROL###\r?\n(.*?)\r?\n###SAGI_OUTPUT###\r?\n(.*)$'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'V4.33 embedded BAT payload extraction failed' }
          $bridge = $match.Groups[1].Value
          $control = $match.Groups[2].Value
          $output = $match.Groups[3].Value
          if ($bridge.Length -lt 1000 -or $control.Length -lt 100000 -or $output.Length -lt 50000) { throw 'V4.33 extracted payload is truncated' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($bridge, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw ('V4.33 embedded Bridge PowerShell syntax errors: ' + (($errors | ForEach-Object { $_.Message + ' line ' + $_.Extent.StartLineNumber }) -join '; '))
          }
          foreach ($marker in @('SAGI433_PENALTY_RC1','SAGIPenaltyCore','mdPenaltyCommitKick','mdPenaltySubmitBusy')) {
            if (-not $control.Contains($marker)) { throw "V4.33 control marker missing: $marker" }
          }
          if (-not $source.Contains('$ProgressPreference = "SilentlyContinue"')) { throw 'V4.32 console progress hotfix missing from V4.33 BAT' }
          Write-Host 'V4.33 Windows BAT extraction + PowerShell 5.1 parser PASS'
      - name: Run V4.33 penalty portable gates on Windows
        shell: pwsh
        run: |
          node intro/tests/v433-penalty-core-selftest.mjs
          node intro/tests/v433-penalty-integration-selftest.mjs
      - name: Upload V4.33 RC test launcher
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V433_PENALTY_RC_CI_PASSED_NOT_PRODUCTION_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat
          if-no-files-found: error
          retention-days: 7
