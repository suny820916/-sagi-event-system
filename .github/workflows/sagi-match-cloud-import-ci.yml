name: SAGI Match Intelligence Cloud Import CI

on:
  push:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/match_intelligence_lite.py"
      - "sagi-cloud-bridge/requirements.txt"
      - "sagi-cloud-bridge/app.py"
      - ".github/workflows/sagi-match-cloud-import-ci.yml"
  workflow_dispatch:

jobs:
  import-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Match Intelligence runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Flask>=3,<4" "requests>=2.32,<3" "imageio-ffmpeg>=0.6,<1" "numpy>=1.26,<3" "onnxruntime>=1.20,<2"
      - name: Compile cloud module
        run: python -m py_compile sagi-cloud-bridge/match_intelligence_lite.py
      - name: Import and register Flask blueprint
        run: |
          cd sagi-cloud-bridge
          python - <<'PY'
          from threading import Lock
          from flask import Flask
          import match_intelligence_lite as m

          app = Flask(__name__)
          bp = m.create_match_intelligence_blueprint(
              heavy_slot=Lock(),
              allowed_origin="https://suny820916.github.io",
          )
          app.register_blueprint(bp)

          rules = sorted(str(r) for r in app.url_map.iter_rules())
          print("\n".join(rules))
          assert "/api/match-intelligence/health" in rules
          assert "/api/match-intelligence/jobs" in rules

          with app.test_client() as client:
              r = client.get("/api/match-intelligence/health")
              print(r.status_code, r.get_json())
              assert r.status_code == 200
              data = r.get_json()
              assert data["ok"] is True
              assert data["version"] == "1.0-cloud-lite"
          PY
