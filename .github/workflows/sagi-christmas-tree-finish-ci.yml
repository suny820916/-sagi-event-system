name: SAGI Christmas Tree Finish CI


concurrency:
  group: sagi-christmas-tree-finish-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/engine/**"
      - "cloud-blender-worker/presets/christmas_tree_attack_30_42.json"
      - ".github/workflows/sagi-christmas-tree-finish-ci.yml"
  workflow_dispatch:

jobs:
  render-attack-30-42:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sagi-blender-worker:finish ./cloud-blender-worker

      - name: Start container
        run: |
          docker run -d --name sagi-finish-ci \
            -p 10000:10000 \
            -e PORT=10000 \
            -e SAGI_API_KEY=test \
            -e SAGI_RENDER_TIMEOUT_SEC=2100 \
            sagi-blender-worker:finish

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/health; then exit 0; fi
            sleep 2
          done
          docker logs sagi-finish-ci
          exit 1

      - name: Render Christmas-tree attack 30-42
        shell: bash
        run: |
          set -euo pipefail
          jq -c '{config:.}' cloud-blender-worker/presets/christmas_tree_attack_30_42.json > finish_request.json

          curl -fsS -X POST http://127.0.0.1:10000/jobs \
            -H "X-API-Key: test" \
            -H "Content-Type: application/json" \
            --data-binary @finish_request.json | tee finish_start.json

          JOB_ID=$(python3 -c 'import json; print(json.load(open("finish_start.json"))["job_id"])')
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

          for i in $(seq 1 480); do
            curl -fsS "http://127.0.0.1:10000/jobs/$JOB_ID" \
              -H "X-API-Key: test" | tee finish_status.json
            STATUS=$(python3 -c 'import json; print(json.load(open("finish_status.json"))["status"])')
            [ "$STATUS" = "done" ] && break
            if [ "$STATUS" = "failed" ]; then
              curl -fsS "http://127.0.0.1:10000/jobs/$JOB_ID/log" -H "X-API-Key: test" || true
              exit 1
            fi
            sleep 5
          done

          test "$(python3 -c 'import json; print(json.load(open("finish_status.json"))["status"])')" = "done"

          curl -fsSL "http://127.0.0.1:10000/jobs/$JOB_ID/video" -H "X-API-Key: test" -o sagi_christmas_tree_attack_30_42.mp4
          curl -fsSL "http://127.0.0.1:10000/jobs/$JOB_ID/blend" -H "X-API-Key: test" -o sagi_christmas_tree_attack_30_42.blend

          test -s sagi_christmas_tree_attack_30_42.mp4
          test -s sagi_christmas_tree_attack_30_42.blend

          docker exec sagi-finish-ci ffprobe -v error \
            -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
            -of json "/tmp/sagi_jobs/$JOB_ID/render.mp4" | tee finish_probe.json

      - name: Upload finish artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sagi-christmas-tree-attack-30-42
          path: |
            sagi_christmas_tree_attack_30_42.mp4
            sagi_christmas_tree_attack_30_42.blend
            finish_probe.json
            finish_status.json
          retention-days: 7

      - name: Container logs
        if: always()
        run: docker logs sagi-finish-ci || true
