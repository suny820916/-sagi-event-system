name: SAGI LOCAL Live E2E

on:
  push:
    branches: [main]
    paths:
      - 'sagi-local/**'
      - '.github/workflows/sagi-local-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for exact GitHub Pages build
        env:
          URL: https://suny820916.github.io/-sagi-event-system/sagi-local/
        run: |
          set -e
          for i in $(seq 1 45); do
            BODY="$(curl -fsSL --max-time 12 "$URL?live_e2e=$GITHUB_SHA-$i" || true)"
            if printf '%s' "$BODY" | grep -q 'data-sagi-local-build="1.3.0"'; then
              echo "Exact SAGI LOCAL 1.3.0 is live."
              exit 0
            fi
            echo "waiting for Pages build ($i/45)"
            sleep 4
          done
          echo "SAGI LOCAL 1.3.0 never appeared on public Pages."
          exit 1

      - name: Verify live Service Worker is network-first v122
        run: |
          set -e
          curl -fsSL --max-time 12 "https://suny820916.github.io/-sagi-event-system/sagi-local/sw.js?e2e=$GITHUB_SHA" > /tmp/sw.js
          grep -q "sagi-ai-local-v130" /tmp/sw.js
          grep -q "cache:'no-store'" /tmp/sw.js
          grep -q "self.skipWaiting" /tmp/sw.js
          grep -q "self.clients.claim" /tmp/sw.js
          echo "Live PWA update strategy OK."

      - name: Run real public poster flow in headless Chrome
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          URL="https://suny820916.github.io/-sagi-event-system/sagi-local/?selftest=1&e2e=$GITHUB_SHA"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --virtual-time-budget=9000 --dump-dom "$URL" > /tmp/live-dom.html
          echo "=== LIVE SELFTEST MARKERS ==="
          grep -o 'data-live-selftest="[^"]*"' /tmp/live-dom.html || true
          grep -o '<canvas[^>]*id="poster34"[^>]*>' /tmp/live-dom.html || true
          grep -o '<canvas[^>]*id="poster916"[^>]*>' /tmp/live-dom.html || true
          grep -o '<button[^>]*id="download34"[^>]*>' /tmp/live-dom.html || true
          grep -o '<button[^>]*id="download916"[^>]*>' /tmp/live-dom.html || true
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live-dom.html').read_text(encoding='utf-8',errors='ignore')
          checks={
            'build':'data-sagi-local-build="1.3.0"' in s,
            'selftest':'data-live-selftest="ok"' in s,
            'poster34':'id="poster34"' in s and 'data-rendered="1"' in s[s.find('id="poster34"'):s.find('id="poster34"')+500],
            'poster916':'id="poster916"' in s and 'data-rendered="1"' in s[s.find('id="poster916"'):s.find('id="poster916"')+500],
            'download34':'id="download34"' in s,
            'download916':'id="download916"' in s,
            'templates':'data-template-smoke="ok"' in s,
            'templateButtons':'data-template="editorial"' in s and 'data-template="split"' in s and 'data-template="impact"' in s,
          }
          print(checks)
          assert all(checks.values()), checks
          PY
          echo "PUBLIC SAGI LOCAL POSTER FLOW OK"

      - name: Verify live page core labels
        run: |
          set -e
          curl -fsSL --max-time 12 "https://suny820916.github.io/-sagi-event-system/sagi-local/?labels=$GITHUB_SHA" > /tmp/live.html
          grep -q 'V1.3.0 · POSTER HOTFIX' /tmp/live.html
          grep -q '立即生成海报' /tmp/live.html
          grep -q '保存3:4 PNG' /tmp/live.html
          grep -q '保存9:16 PNG' /tmp/live.html
