name: SAGI LOCAL Live E2E

on:
  push:
    branches: [main]
    paths:
      - 'sagi-local/**'
      - '.github/workflows/sagi-local-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for exact GitHub Pages build
        env:
          URL: https://suny820916.github.io/-sagi-event-system/sagi-local/
        run: |
          set -e
          for i in $(seq 1 45); do
            BODY="$(curl -fsSL --max-time 12 "$URL?live_e2e=$GITHUB_SHA-$i" || true)"
            if printf '%s' "$BODY" | grep -q 'data-sagi-local-build="1.2.2"'; then
              echo "Exact SAGI LOCAL 1.2.2 is live."
              exit 0
            fi
            echo "waiting for Pages build ($i/45)"
            sleep 4
          done
          echo "SAGI LOCAL 1.2.2 never appeared on public Pages."
          exit 1

      - name: Verify live Service Worker is network-first v122
        run: |
          set -e
          curl -fsSL --max-time 12 "https://suny820916.github.io/-sagi-event-system/sagi-local/sw.js?e2e=$GITHUB_SHA" > /tmp/sw.js
          grep -q "sagi-ai-local-v122" /tmp/sw.js
          grep -q "cache:'no-store'" /tmp/sw.js
          grep -q "self.skipWaiting" /tmp/sw.js
          grep -q "self.clients.claim" /tmp/sw.js
          echo "Live PWA update strategy OK."

      - name: Run real public poster flow in headless Chrome
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          URL="https://suny820916.github.io/-sagi-event-system/sagi-local/?selftest=1&e2e=$GITHUB_SHA"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --virtual-time-budget=9000 --dump-dom "$URL" > /tmp/live-dom.html
          grep -q 'data-sagi-local-build="1.2.2"' /tmp/live-dom.html
          grep -q 'data-live-selftest="ok"' /tmp/live-dom.html
          grep -q 'id="poster34"[^>]*data-rendered="1"' /tmp/live-dom.html
          grep -q 'id="poster916"[^>]*data-rendered="1"' /tmp/live-dom.html
          grep -q 'id="download34"' /tmp/live-dom.html
          grep -q 'id="download916"' /tmp/live-dom.html
          echo "PUBLIC SAGI LOCAL POSTER FLOW OK"

      - name: Verify live page core labels
        run: |
          set -e
          curl -fsSL --max-time 12 "https://suny820916.github.io/-sagi-event-system/sagi-local/?labels=$GITHUB_SHA" > /tmp/live.html
          grep -q 'V1.2.2 · LIVE FIX' /tmp/live.html
          grep -q '立即生成海报' /tmp/live.html
          grep -q '保存3:4 PNG' /tmp/live.html
          grep -q '保存9:16 PNG' /tmp/live.html
