name: SAGI MOURINHO REAL MADRID 70S V1

concurrency:
  group: sagi-mourinho-real-madrid-70s-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/presets/mourinho_real_madrid_70s_v1.json"
      - "cloud-blender-worker/presets/mourinho_real_madrid_70s_cn.ass"
      - ".github/workflows/sagi-mourinho-real-madrid-70s.yml"
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v57.py"
  workflow_dispatch:

jobs:
  render-mourinho-70s:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-mourinho-70s ./cloud-blender-worker

      - name: Render and compose Mourinho 70s
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mourinho_70s_out
          docker run --rm \
            -v "$PWD/mourinho_70s_out:/out" \
            sagi-mourinho-70s \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-dejavu-core >/dev/null

              blender --background \
                --python /app/engine/sagi_tactical_execution_director_v57.py \
                -- \
                /app/presets/mourinho_real_madrid_70s_v1.json \
                /out

              ffmpeg -y -loglevel error \
                -framerate 30 \
                -i /out/frames/frame_%04d.png \
                -f lavfi \
                -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 -profile:v baseline -level 3.1 \
                -pix_fmt yuv420p -preset veryfast -crf 20 \
                -c:a aac -b:a 64k -shortest -movflags +faststart \
                /out/MOURINHO_REAL_MADRID_70S_BASE.mp4

              cp /app/presets/mourinho_real_madrid_70s_cn.ass /out/mourinho_real_madrid_70s_cn.ass

              ffmpeg -y -loglevel error \
                -i /out/MOURINHO_REAL_MADRID_70S_BASE.mp4 \
                -vf "ass=/out/mourinho_real_madrid_70s_cn.ass" \
                -c:v libx264 -profile:v baseline -level 3.1 \
                -pix_fmt yuv420p -preset veryfast -crf 20 \
                -c:a copy -movflags +faststart \
                /out/MOURINHO_REAL_MADRID_70S_V1.mp4

              ffmpeg -y -loglevel error \
                -ss 19 -t 39 \
                -i /out/MOURINHO_REAL_MADRID_70S_V1.mp4 \
                -c:v libx264 -pix_fmt yuv420p -crf 20 -preset veryfast -c:a aac \
                /out/MOURINHO_REAL_MADRID_CORE_19_58.mp4

              rm -f /out/MOURINHO_REAL_MADRID_70S_BASE.mp4
            '

          sudo chown -R "$USER":"$USER" mourinho_70s_out
          test -s mourinho_70s_out/MOURINHO_REAL_MADRID_70S_V1.mp4
          test -s mourinho_70s_out/MOURINHO_REAL_MADRID_CORE_19_58.mp4
          test -s mourinho_70s_out/execution_report.json
          test -s mourinho_70s_out/scene.blend

      - name: Upload Mourinho 70s artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-MOURINHO-REAL-MADRID-70S-V1
          path: |
            mourinho_70s_out/MOURINHO_REAL_MADRID_70S_V1.mp4
            mourinho_70s_out/MOURINHO_REAL_MADRID_CORE_19_58.mp4
            mourinho_70s_out/execution_report.json
            mourinho_70s_out/scene.blend
            mourinho_70s_out/mourinho_real_madrid_70s_cn.ass
            cloud-blender-worker/presets/mourinho_real_madrid_70s_v1.json
          retention-days: 7
