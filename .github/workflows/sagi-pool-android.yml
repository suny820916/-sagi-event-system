name: SAGI POOL Android LIVE ENGINE

on:
  push:
    paths:
      - 'sagi-pool-live/android-live-engine/**'
      - '.github/workflows/sagi-pool-android.yml'
  pull_request:
    paths:
      - 'sagi-pool-live/android-live-engine/**'
  workflow_dispatch:

concurrency:
  group: sagi-pool-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 3 -type d | sort | head -n 120
            exit 1
          fi
          echo "Using SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile debug APK
        working-directory: sagi-pool-live/android-live-engine
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify debug APK
        run: test -f sagi-pool-live/android-live-engine/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-POOL-LIVE-ENGINE-debug
          path: sagi-pool-live/android-live-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Compile unsigned release APK
        working-directory: sagi-pool-live/android-live-engine
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="sagi-pool-live/android-live-engine/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

      - name: Verify commercial manifest security
        shell: bash
        run: |
          set -euo pipefail
          APK="sagi-pool-live/android-live-engine/app/build/outputs/apk/release/app-release-unsigned.apk"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -z "$APKANALYZER" ]; then
            echo "apkanalyzer not found"
            exit 1
          fi
          "$APKANALYZER" manifest print "$APK" > "$RUNNER_TEMP/sagi-release-manifest.xml"
          grep -q 'package="com.sagi.poollive"' "$RUNNER_TEMP/sagi-release-manifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$RUNNER_TEMP/sagi-release-manifest.xml"
          grep -q 'android:allowBackup="false"' "$RUNNER_TEMP/sagi-release-manifest.xml"
          if grep -q 'android:debuggable="true"' "$RUNNER_TEMP/sagi-release-manifest.xml"; then
            echo "Release APK is debuggable"
            exit 1
          fi
          echo "Release manifest security verified."

      - name: Prepare optional commercial signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAGI_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sagi-pool-release.jks"
            echo "SAGI_KEYSTORE_PATH=$RUNNER_TEMP/sagi-pool-release.jks" >> "$GITHUB_ENV"
            echo "SAGI_RELEASE_READY=1" >> "$GITHUB_ENV"
            echo "Commercial signing key loaded."
          else
            echo "SAGI_RELEASE_READY=0" >> "$GITHUB_ENV"
            echo "Commercial signing secrets are not configured; debug APK remains available."
          fi

      - name: Build signed commercial APK
        if: env.SAGI_RELEASE_READY == '1'
        working-directory: sagi-pool-live/android-live-engine
        env:
          SAGI_KEYSTORE_PASSWORD: ${{ secrets.SAGI_ANDROID_KEYSTORE_PASSWORD }}
          SAGI_KEY_ALIAS: ${{ secrets.SAGI_ANDROID_KEY_ALIAS }}
          SAGI_KEY_PASSWORD: ${{ secrets.SAGI_ANDROID_KEY_PASSWORD }}
          TENCENT_LIVE_LICENSE_URL: ${{ secrets.TENCENT_LIVE_LICENSE_URL }}
          TENCENT_LIVE_LICENSE_KEY: ${{ secrets.TENCENT_LIVE_LICENSE_KEY }}
          SAGI_DEFAULT_SYNC_URL: ${{ secrets.SAGI_DEFAULT_SYNC_URL }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signed commercial APK
        if: env.SAGI_RELEASE_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          APK="sagi-pool-live/android-live-engine/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload signed commercial APK
        if: env.SAGI_RELEASE_READY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-POOL-LIVE-ENGINE-commercial
          path: sagi-pool-live/android-live-engine/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
