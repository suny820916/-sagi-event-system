name: SAGI POOL Android LIVE ENGINE

on:
  push:
    paths:
      - 'sagi-pool-live/android-live-engine/**'
      - '.github/workflows/sagi-pool-android.yml'
  pull_request:
    paths:
      - 'sagi-pool-live/android-live-engine/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Android app
        working-directory: sagi-pool-live/android-live-engine
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: test -f sagi-pool-live/android-live-engine/app/build/outputs/apk/debug/app-debug.apk
