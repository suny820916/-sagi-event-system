name: SAGI MATCH PHOTO CI
on:
  push:
    branches: [match-photo-v1]
    paths:
      - 'match-photo/**'
      - 'kit/photo.html'
      - 'kit/index.html'
      - '.github/workflows/match-photo-ci.yml'
  pull_request:
    paths:
      - 'match-photo/**'
      - 'kit/photo.html'
      - 'kit/index.html'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: match-photo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check public/app.js
