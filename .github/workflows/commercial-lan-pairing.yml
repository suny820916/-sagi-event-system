name: Commercial LAN Pairing

on:
  push:
    branches: [commercial-v1.0]
    paths:
      - 'commercial/lan/**'
      - '.github/workflows/commercial-lan-pairing.yml'
  pull_request:
    paths:
      - 'commercial/lan/**'
      - '.github/workflows/commercial-lan-pairing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lan-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check commercial/lan/lan-pairing.mjs
      - run: node --check commercial/lan/lan-pairing-selftest.mjs
      - run: node commercial/lan/lan-pairing-selftest.mjs
      - run: node --check commercial/lan/lan-gateway.mjs
      - run: node --check commercial/lan/lan-gateway-selftest.mjs
      - run: node commercial/lan/lan-gateway-selftest.mjs
      - run: node --check commercial/lan/lan-command-selftest.mjs
      - run: node commercial/lan/lan-command-selftest.mjs
