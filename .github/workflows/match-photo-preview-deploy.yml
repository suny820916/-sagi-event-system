name: SAGI MATCH PHOTO Preview Deploy

on:
  push:
    branches: [match-photo-v1]
    paths:
      - "match-photo/**"
      - ".github/workflows/match-photo-preview-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render API credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY is not configured in this repository."
            exit 1
          fi

      - name: Create or update free preview service
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.parse, urllib.error

          key = os.environ["RENDER_API_KEY"]
          service_name = "sagi-match-photo-preview"
          api = "https://api.render.com/v1"
          headers = {
              "Authorization": f"Bearer {key}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def call(method, path, body=None):
              req = urllib.request.Request(api + path, method=method, headers=headers)
              if body is not None:
                  req.data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      return r.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  print(f"Render {method} {path} failed: {e.code} {raw}")
                  raise

          status, services = call("GET", "/services?name=" + urllib.parse.quote(service_name) + "&limit=20")
          service = None
          for row in services:
              s = row.get("service", row)
              if s.get("name") == service_name:
                  service = s
                  break

          if service is None:
              _, owners = call("GET", "/owners?limit=20")
              if not owners:
                  raise RuntimeError("No Render workspace available to API key")
              owner = owners[0].get("owner", owners[0])
              owner_id = owner["id"]

              payload = {
                  "type": "web_service",
                  "name": service_name,
                  "ownerId": owner_id,
                  "repo": "https://github.com/suny820916/-sagi-event-system",
                  "branch": "match-photo-v1",
                  "rootDir": "match-photo",
                  "autoDeployTrigger": "checksPass",
                  "envVars": [
                      {"key":"NODE_VERSION","value":"20.18.0"},
                      {"key":"DATA_DIR","value":"/tmp/sagi-match-photo"},
                      {"key":"PAYMENT_MODE","value":"mock"},
                      {"key":"PUBLIC_TITLE","value":"SAGI MATCH PHOTO · 总决赛预览"},
                      {"key":"ADMIN_KEY","value":"SAGI-PHOTO-PREVIEW-2026"}
                  ],
                  "serviceDetails": {
                      "runtime": "node",
                      "region": "singapore",
                      "plan": "free",
                      "buildCommand": "npm install",
                      "startCommand": "npm start",
                      "healthCheckPath": "/api/health"
                  }
              }
              _, created = call("POST", "/services", payload)
              service = created.get("service", created)
              print("Created preview service:", service.get("id"))
          else:
              print("Preview service already exists:", service.get("id"))
              sid = service["id"]
              call("PATCH", f"/services/{sid}", {
                  "branch":"match-photo-v1",
                  "rootDir":"match-photo",
                  "autoDeployTrigger":"checksPass",
                  "serviceDetails":{
                      "buildCommand":"npm install",
                      "startCommand":"npm start",
                      "healthCheckPath":"/api/health"
                  }
              })
              for k,v in {
                  "NODE_VERSION":"20.18.0",
                  "DATA_DIR":"/tmp/sagi-match-photo",
                  "PAYMENT_MODE":"mock",
                  "PUBLIC_TITLE":"SAGI MATCH PHOTO · 总决赛预览",
                  "ADMIN_KEY":"SAGI-PHOTO-PREVIEW-2026"
              }.items():
                  call("PUT", f"/services/{sid}/env-vars/{urllib.parse.quote(k)}", {"value":v})
              call("POST", f"/services/{sid}/deploys", {"commitId": os.environ["GITHUB_SHA"], "clearCache":"do_not_clear"})

          url = ((service.get("serviceDetails") or {}).get("url")
                 or ("https://" + service.get("slug","") + ".onrender.com" if service.get("slug") else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("url=" + url + "\n")
              out.write("service_id=" + str(service.get("id","")) + "\n")
          print("Preview URL:", url)
          PY

      - name: Wait for preview health
        env:
          URL: ${{ steps.render.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Render service URL not returned."
            exit 1
          fi
          python - <<'PY'
          import json, os, time, urllib.request
          url=os.environ["URL"].rstrip("/")+"/api/health"
          last=""
          for i in range(45):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data=json.loads(r.read().decode())
                  print("health", data)
                  if data.get("ok") and data.get("service")=="SAGI MATCH PHOTO":
                      print("PREVIEW_READY", os.environ["URL"])
                      raise SystemExit(0)
              except Exception as e:
                  last=str(e)
                  print(f"check {i+1}/45: {e}")
              time.sleep(10)
          print("Preview did not become healthy:", last)
          raise SystemExit(1)
          PY
