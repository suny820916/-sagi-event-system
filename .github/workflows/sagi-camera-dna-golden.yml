name: SAGI TACTICAL EXECUTION DIRECTOR

concurrency:
  group: sagi-tactical-execution-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v1.py"
      - "cloud-blender-worker/presets/christmas_tree_execution_v1.json"
      - "cloud-blender-worker/Dockerfile"
      - ".github/workflows/sagi-camera-dna-golden.yml"
  workflow_dispatch:

jobs:
  render-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-tactical-execution ./cloud-blender-worker

      - name: Render Tactical Execution Master
        run: |
          set -euo pipefail
          mkdir -p execution_out
          docker run --rm \
            -v "$PWD/execution_out:/out" \
            sagi-tactical-execution \
            sh -lc '
              blender --background \
                --python /app/engine/sagi_tactical_execution_director_v1.py \
                -- /app/presets/christmas_tree_execution_v1.json /out

              ffmpeg -y -loglevel error \
                -framerate 24 \
                -i /out/frames/frame_%04d.png \
                -f lavfi \
                -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 \
                -profile:v baseline \
                -level 3.1 \
                -pix_fmt yuv420p \
                -preset veryfast \
                -crf 21 \
                -c:a aac \
                -b:a 64k \
                -shortest \
                -movflags +faststart \
                /out/SAGI_TACTICAL_EXECUTION_CHRISTMAS_TREE_V1.mp4
            '

          test -s execution_out/SAGI_TACTICAL_EXECUTION_CHRISTMAS_TREE_V1.mp4
          test -s execution_out/scene.blend

          docker run --rm \
            -v "$PWD/execution_out:/out" \
            sagi-tactical-execution \
            ffprobe -v error \
              -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
              -of json /out/SAGI_TACTICAL_EXECUTION_CHRISTMAS_TREE_V1.mp4 \
            | tee execution_out/probe.json

      - name: Upload Tactical Execution Master
        uses: actions/upload-artifact@v4
        with:
          name: sagi-tactical-execution-christmas-tree-v1
          path: |
            execution_out/SAGI_TACTICAL_EXECUTION_CHRISTMAS_TREE_V1.mp4
            execution_out/scene.blend
            execution_out/probe.json
            execution_out/execution_report.json
          retention-days: 7
