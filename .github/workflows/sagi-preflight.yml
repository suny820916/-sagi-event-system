name: SAGI Full Preflight

on:
  push:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/**"
      - "content-os/sagi-down.html"
      - "content-os/sagi-down-sw.js"
      - "render.yaml"
      - ".github/workflows/sagi-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "sagi-cloud-bridge/**"
      - "content-os/sagi-down.html"
      - "content-os/sagi-down-sw.js"
      - ".github/workflows/sagi-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAGI_SERVER_SECRET: smoke-secret
      SAGI_ALLOWED_ORIGIN: https://suny820916.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "sagi-cloud-bridge/requirements.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact Render dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sagi-cloud-bridge/requirements.txt

      - name: Verify dependency compatibility
        run: |
          python - <<'PY'
          import av, faster_whisper, gallery_dl, parth_dl, sys
          print("python", sys.version)
          print("av", av.__version__)
          print("faster_whisper", getattr(faster_whisper, "__version__", "unknown"))
          print("gallery_dl", getattr(gallery_dl, "__version__", "unknown"))
          print("parth_dl", getattr(parth_dl, "__version__", "unknown"))
          major = int(av.__version__.split(".")[0])
          assert major < 19, f"PyAV must stay <19 with released faster-whisper, got {av.__version__}"
          PY

      - name: Reproduce PyAV decode path
        run: |
          python - <<'PY'
          import wave, math, struct, tempfile, os
          from faster_whisper.audio import decode_audio
          path = os.path.join(tempfile.gettempdir(), "sagi_smoke.wav")
          sr = 16000
          with wave.open(path, "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              for i in range(sr):
                  x = int(900 * math.sin(2 * math.pi * 440 * i / sr))
                  w.writeframesraw(struct.pack("<h", x))
          audio = decode_audio(path, sampling_rate=16000)
          assert len(audio) >= 15000, len(audio)
          print("decode_audio OK", len(audio))
          PY

      - name: Load real Whisper tiny and transcribe test audio
        run: |
          cd sagi-cloud-bridge
          python - <<'PY'
          import wave, math, struct, tempfile, os
          from faster_whisper import WhisperModel
          path = os.path.join(tempfile.gettempdir(), "sagi_whisper_smoke.wav")
          sr = 16000
          with wave.open(path, "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              for i in range(sr * 2):
                  x = int(700 * math.sin(2 * math.pi * 330 * i / sr))
                  w.writeframesraw(struct.pack("<h", x))
          model = WhisperModel("Systran/faster-whisper-tiny", device="cpu", compute_type="int8", cpu_threads=2)
          segments, info = model.transcribe(path, beam_size=1, best_of=1, vad_filter=False)
          rows = list(segments)
          print("real Whisper transcribe OK", "lang=", getattr(info, "language", ""), "segments=", len(rows))
          PY

      - name: Real caption-media endpoint smoke test
        run: |
          cd sagi-cloud-bridge
          if ! command -v espeak >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq espeak
          fi
          python - <<'PY'
          import io, os, subprocess, tempfile
          from pathlib import Path
          import imageio_ffmpeg
          import app as mod

          work = Path(tempfile.mkdtemp(prefix="sagi_real_caption_"))
          wav = work / "speech.wav"
          mp4 = work / "speech.mp4"

          subprocess.run([
              "espeak","-s","145","-w",str(wav),
              "This is a football test. The double pivot protects the back four."
          ], check=True)

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([
              ffmpeg,"-hide_banner","-loglevel","error","-y",
              "-f","lavfi","-i","color=c=black:s=640x360:r=25:d=5",
              "-i",str(wav),
              "-c:v","libx264","-pix_fmt","yuv420p",
              "-c:a","aac","-b:a","96k","-shortest",str(mp4)
          ], check=True)

          assert mp4.exists() and mp4.stat().st_size > 1000, mp4.stat().st_size if mp4.exists() else 0

          c = mod.app.test_client()
          token = mod.client_token()
          headers = {
              "Authorization": "Bearer " + token,
              "Origin": "https://suny820916.github.io",
          }
          with mp4.open("rb") as fh:
              r = c.post(
                  "/api/caption-media",
                  headers=headers,
                  data={
                      "media": (io.BytesIO(fh.read()), "speech.mp4"),
                      "start": "0",
                      "duration": "5",
                      "language": "en",
                  },
                  content_type="multipart/form-data",
              )

          print("caption-media status", r.status_code)
          print("caption-media body", r.get_data(as_text=True)[:2000])
          assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
          d = r.get_json()
          assert d["ok"] is True
          assert isinstance(d.get("segments"), list) and len(d["segments"]) >= 1, d
          assert any(str(x.get("text") or "").strip() for x in d["segments"]), d
          assert all(float(x["end"]) >= float(x["start"]) for x in d["segments"])
          print("REAL caption-media OK", len(d["segments"]), "segments", [x["text"] for x in d["segments"]])
          PY

      - name: Flask API smoke test
        run: |
          cd sagi-cloud-bridge
          python - <<'PY'
          import io, types, subprocess
          from pathlib import Path
          import imageio_ffmpeg
          import app as mod

          class Seg:
              def __init__(self, start, end, text):
                  self.start, self.end, self.text = start, end, text

          class FakeModel:
              def transcribe(self, *args, **kwargs):
                  return iter([Seg(0.0, 1.2, "This is a test."), Seg(1.2, 2.4, "Football translation.")]), types.SimpleNamespace(language="en", language_probability=0.99)

          mod.get_caption_model = lambda: FakeModel()
          mod._google_translate_text = lambda text, source, target: text.replace("This is a test.", "这是一个测试。").replace("Football translation.", "足球翻译。").replace("Hello", "你好").replace("world", "世界")

          c = mod.app.test_client()
          health = c.get("/health").get_json()
          print("health", health)
          assert health["version"] == "3.9.2"
          assert health["captionMedia"] is True
          assert health["contextTranslate"] is True
          assert health["smartTranslate"] is True
          assert health["aiVoice"] is True
          assert health["voiceDirectorVersion"] == "1.7"
          assert health["voiceNarrationNoCut"] is True
          assert health["voiceSentenceTimeline"] is True
          assert health["voiceCompletenessGuard"] is True
          assert health["aiVisualSync"] is True
          assert health["aiVisualSyncMaxHoldSeconds"] == 3
          assert health["aiVisualSyncSentenceMap"] is True
          assert health["voiceMeaningFirst"] is True
          assert health["voiceMeaningIntegrityRequired"] == 100
          assert health["voiceLockstep"] is True
          assert health["voiceLockstepExactDuration"] is True
          assert health["voiceLockstepOriginalVideoMaster"] is True
          assert health["voiceMeaningAuditRequiredForAIRender"] is True
          assert health["voiceVideoDurationLock"] is True
          assert health["voiceAutoCondenseToClip"] is True
          assert health["voiceRenderNeverExtendsVideo"] is True
          assert health["aiSceneSync"] is True
          assert health["aiSceneSyncVersion"] == "1.4"
          assert health["aiSceneSyncLocalFrameAnalysis"] is True
          assert health["aiSceneSyncSemanticCaptionMatch"] is True
          assert health["cloudRender"] is True
          assert health["cloudDownload"] is True
          assert set(health["downloadPlatforms"]) >= {"Instagram","YouTube","TikTok","X"}
          assert health["instagramPostFallback"].startswith("btch -> parth-dl")
          assert health["downloadRouter"] is True
          assert health["downloadRouterVersion"] == "3.0"
          assert health["btchEnabled"] is True
          assert health["parthDlEnabled"] is True
          assert health["tikwmEnabled"] is True
          assert health["fxtwitterEnabled"] is True
          assert "carousel-zip" in health["downloadMediaKinds"]
          assert health["galleryFallbackTimeoutSeconds"] == 25
          assert health["cloudDownloadVersion"] == "3.0"
          assert health["downloadPrimary"] == "multi-engine-router"
          assert health["footballDataHub"] is True
          assert health["footballDataHubVersion"] == "2.0"
          assert set(health["footballCompetitions"]) >= {"PL","PD","BL1","SA","FL1","CL"}
          # MATCH DATA HUB V2: Chinese aliases must resolve exactly and a
          # single structured source must remain a candidate.
          assert mod._football_team_match("皇马", "Real Madrid CF") is True
          assert mod._football_team_match("皇马", "Real Madrid Castilla") is False
          base = mod._football_match_row("ESPN public feed", "PD", "2026-11-01T20:00:00Z", "Valencia", "Real Madrid", 0, 3)
          verified2 = mod._football_match_row("football-data.org", "PD", "2026-11-01T20:00:00Z", "Valencia CF", "Real Madrid CF", 0, 3)
          yes, no = mod._football_merge([base, verified2], 8, {})
          assert len(yes) == 1 and yes[0]["verified"] is True and yes[0]["providerCount"] == 2
          crest_row = mod._football_match_row("football-data.org", "PD", "2026-11-01T20:00:00Z", "Valencia CF", "Real Madrid CF", 0, 3, home_logo="https://crests.football-data.org/95.png", away_logo="https://crests.football-data.org/86.png")
          assert crest_row["homeLogo"].endswith("/95.png") and crest_row["awayLogo"].endswith("/86.png")
          yes, no = mod._football_merge([base, crest_row], 8, {})
          assert yes[0]["homeLogo"].endswith("/95.png") and yes[0]["awayLogo"].endswith("/86.png")
          assert "football_crest" in mod.app.view_functions
          yes, no = mod._football_merge([base], 8, {})
          assert len(yes) == 0 and len(no) == 1 and no[0]["verificationTier"] == "candidate"
          assert health["cobaltMode"] == "legacy-fallback-only"
          assert health["cobaltConfigured"] is False
          assert health["instagramProxyConfigured"] is False
          assert health["instagramEgress"] == "render-direct"

          # Proxy configuration must propagate to both browser-like HTML requests
          # and media-file requests without exposing the proxy value in /health.
          mod.INSTAGRAM_PROXY = "http://user:pass@proxy.test:8080"
          assert mod._curl_proxy_kwargs() == {"proxy":"http://user:pass@proxy.test:8080"}
          assert mod._requests_proxy_kwargs()["proxies"]["https"] == "http://user:pass@proxy.test:8080"
          proxied_health = c.get("/health").get_json()
          assert proxied_health["instagramProxyConfigured"] is True
          assert proxied_health["instagramEgress"] == "proxy"
          assert "proxy.test" not in str(proxied_health)
          mod.INSTAGRAM_PROXY = ""

          # V3 router: platform detection and engine ordering.
          assert mod.source_platform("https://www.instagram.com/reel/TEST/") == "instagram"
          assert mod.source_platform("https://www.tiktok.com/@u/video/123") == "tiktok"
          assert mod.source_platform("https://x.com/u/status/123") == "twitter"
          assert mod.source_platform("https://youtu.be/abc") == "youtube"
          assert mod._router_engines("instagram") == ["btch","parth-dl"]
          assert mod._router_engines("tiktok") == ["btch","tikwm"]
          assert mod._router_engines("twitter") == ["fxtwitter","btch"]

          # First successful router engine must stop native yt-dlp immediately.
          original_router = mod._router_engines
          original_btch = mod.run_btch_download
          original_direct = mod._download_with_strategy
          calls = []
          def fake_btch(job_id, url, wanted_name):
              calls.append("btch")
              with mod.jobs_lock:
                  mod.jobs[job_id].update({
                      "status":"ready","strategy":"btch","mediaKind":"video",
                      "fileCount":1,"size":123,"path":__file__,"workdir":"",
                      "filename":"SAGI_TEST.mp4","error":"","errorCode":""
                  })
              return True
          mod._router_engines = lambda platform: ["btch"]
          mod.run_btch_download = fake_btch
          mod._download_with_strategy = lambda *a, **k: (_ for _ in ()).throw(RuntimeError("NATIVE_SHOULD_NOT_RUN"))
          rid = "router-primary-smoke"
          with mod.jobs_lock:
              mod.jobs[rid] = {
                  "id":rid,"status":"queued","created_at":mod.iso(),"updated_at":mod.iso(),
                  "title":"SAGI_TEST","source_url":"https://www.instagram.com/reel/TEST/",
                  "requested_name":"SAGI_TEST","error":"","errorCode":"","size":0,
                  "worker":"","strategy":"sagi_cloud","download_key":"k","path":"","workdir":"","filename":""
              }
          try:
              mod.run_download(rid, "https://www.instagram.com/reel/TEST/", "SAGI_TEST")
              with mod.jobs_lock:
                  rj = dict(mod.jobs[rid])
              assert rj["status"] == "ready" and rj["strategy"] == "btch", rj
              assert calls == ["btch"], calls
              assert "btch" in rj.get("engineTrace", []), rj
              print("Multi-engine primary routing smoke OK", rj["engineTrace"])
          finally:
              mod._router_engines = original_router
              mod.run_btch_download = original_btch
              mod._download_with_strategy = original_direct

          token = mod.client_token()
          headers = {"Authorization": "Bearer " + token, "Origin": "https://suny820916.github.io"}

          # Native cloud download route must accept supported social links without
          # requiring a residential proxy or opening cobalt.tools.
          class FakeThread:
              def __init__(self, target=None, args=(), daemon=None, **kwargs):
                  self.target=target; self.args=args
              def start(self): pass
          original_thread = mod.Thread
          mod.Thread = FakeThread
          try:
              r = c.post("/api/jobs", headers={**headers, "Content-Type":"application/json"},
                         json={"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ","name":"SAGI_TEST"})
              assert r.status_code == 202, (r.status_code, r.get_data(as_text=True))
              jd = r.get_json()
              assert jd["ok"] is True and jd["engine"] == "sagi-cloud-download"
              assert jd["job"]["strategy"] == "sagi_cloud"
              r = c.post("/api/jobs", headers={**headers, "Content-Type":"application/json"},
                         json={"url":"https://example.com/video","name":"bad"})
              assert r.status_code == 400, (r.status_code, r.get_data(as_text=True))
              print("SAGI Cloud Download API smoke OK")
          finally:
              mod.Thread = original_thread

          # Fast Instagram page parser must extract public media without waiting
          # on a 150-second gallery subprocess.
          single_html = '''
          <meta property="og:image" content="https://scontent.cdninstagram.com/v/t51/sample1.jpg?x=1">
          <img src="https://scontent.cdninstagram.com/v/t51/recommendation.jpg?x=9">
          '''
          media = mod._extract_instagram_media_urls(single_html)
          assert len(media) == 1 and media[0][0] == "image" and "sample1.jpg" in media[0][1], media

          video_html = '''
          <meta property="og:image" content="https://scontent.cdninstagram.com/v/t51/poster.jpg?x=1">
          <meta property="og:video" content="https://scontent.cdninstagram.com/v/t50/clip.mp4?x=2">
          '''
          media = mod._extract_instagram_media_urls(video_html)
          assert len(media) == 1 and media[0][0] == "video" and "clip.mp4" in media[0][1], media

          carousel_html = '''
          edge_sidecar_to_children
          <script>{"display_url":"https:\\/\\/scontent.cdninstagram.com\\/v\\/t51\\/sample2.jpg?x=2","video_url":"https:\\/\\/scontent.cdninstagram.com\\/v\\/t50\\/clip2.mp4?x=3"}</script>
          '''
          media = mod._extract_instagram_media_urls(carousel_html)
          assert any(k=="image" and "sample2.jpg" in u for k,u in media), media
          assert any(k=="video" and "clip2.mp4" in u for k,u in media), media
          assert mod._instagram_shortcode("https://www.instagram.com/p/ABC_123/?foo=1") == "ABC_123"
          print("Instagram fast HTML parser smoke OK", len(media))

          # If fast parsing truly cannot resolve a post, only then use the short
          # gallery-dl fallback. This test must never make a live Instagram request.
          original_extract = mod._download_with_strategy
          original_fast = mod.run_instagram_fast_post
          original_gallery = mod.run_gallery_download
          original_router_order = mod._router_engines
          def no_video(*args, **kwargs):
              raise mod.DownloadError("ERROR: [Instagram] TEST: There is no video in this post")
          def fake_gallery(job_id, url, wanted_name):
              with mod.jobs_lock:
                  mod.jobs[job_id].update({
                      "status":"ready","strategy":"gallery-dl","mediaKind":"carousel",
                      "fileCount":3,"size":123,"path":__file__,"workdir":"",
                      "filename":"SAGI_TEST_CAROUSEL.zip","error":"","errorCode":""
                  })
          mod._download_with_strategy = no_video
          mod.run_instagram_fast_post = lambda *args, **kwargs: (_ for _ in ()).throw(RuntimeError("FAST_NO_MEDIA"))
          mod.run_gallery_download = fake_gallery
          mod._router_engines = lambda platform: []
          gid = "gallery-smoke"
          with mod.jobs_lock:
              mod.jobs[gid] = {
                  "id":gid,"status":"queued","created_at":mod.iso(),"updated_at":mod.iso(),
                  "title":"SAGI_TEST","source_url":"https://www.instagram.com/p/TEST/",
                  "requested_name":"SAGI_TEST","error":"","errorCode":"","size":0,
                  "worker":"","strategy":"sagi_cloud","download_key":"k","path":"","workdir":"","filename":""
              }
          try:
              mod.run_download(gid, "https://www.instagram.com/p/TEST/", "SAGI_TEST")
              with mod.jobs_lock:
                  gj = dict(mod.jobs[gid])
              assert gj["status"] == "ready", gj
              assert gj["strategy"] == "gallery-dl", gj
              assert gj["mediaKind"] == "carousel" and gj["fileCount"] == 3, gj
              print("Instagram post fallback smoke OK", gj["strategy"], gj["mediaKind"])
          finally:
              mod._download_with_strategy = original_extract
              mod.run_instagram_fast_post = original_fast
              mod.run_gallery_download = original_gallery
              mod._router_engines = original_router_order

          r = c.post("/api/caption", headers=headers, data={"audio": (io.BytesIO(b"RIFFfake"), "caption.wav"), "language": "en"}, content_type="multipart/form-data")
          assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
          d = r.get_json()
          assert d["ok"] and len(d["segments"]) == 2

          r = c.post("/api/caption-media", headers=headers, data={"media": (io.BytesIO(b"fake-video"), "clip.mp4"), "start": "0", "duration": "15", "language": "en"}, content_type="multipart/form-data")
          assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
          d = r.get_json()
          assert d["ok"] and len(d["segments"]) == 2

          source_segments = ["Hello world" if i % 2 == 0 else "This is a test." for i in range(20)]
          r = c.post("/api/translate-context", headers={**headers, "Content-Type": "application/json"}, json={"source":"en","target":"zh-CN","mode":"faithful","segments":source_segments})
          assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
          d = r.get_json()
          assert d["ok"] and len(d["segments"]) == 20, len(d.get("segments", []))
          assert all(str(x).strip() for x in d["segments"])
          print("Flask API smoke OK", len(d["segments"]), "translated segments")
          r = c.post("/api/translate-smart", headers={**headers, "Content-Type": "application/json"}, json={"source":"en","target":"zh-CN","mode":"football","paragraphs":["The double pivot protects the back four during transition."]})
          assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
          sd = r.get_json()
          assert sd["ok"] and len(sd["results"]) == 1
          assert "双后腰" in sd["results"][0]["text"] or "四后卫" in sd["results"][0]["text"]
          assert "攻防攻防转换" not in sd["results"][0]["text"]
          assert 0 <= float(sd["averageScore"]) <= 100
          print("Smart translate smoke OK", sd["averageScore"], sd["results"][0]["text"])
          # AI Voice endpoint smoke with provider mocked locally.
          class FakeResp:
              def __init__(self, status=200, payload=None, content=b""):
                  self.status_code=status; self._payload=payload or {}; self.content=content; self.text=""
              def json(self): return self._payload
              def iter_content(self, chunk_size=65536):
                  data=self.content or b""
                  for i in range(0,len(data),chunk_size):
                      yield data[i:i+chunk_size]
              def raise_for_status(self):
                  if self.status_code >= 400: raise RuntimeError(self.status_code)

          mod.ELEVENLABS_API_KEY = "test-key"
          mod.list_eleven_voices = lambda force=False: [
              {"voice_id":"male-test","name":"Male","category":"premade","gender":"male","accent":"","language":"","preview_url":""},
              {"voice_id":"female-test","name":"Female","category":"premade","gender":"female","accent":"","language":"","preview_url":""},
          ]
          original_post = mod.requests.post
          def fake_post(url, *args, **kwargs):
              if "/v1/voices/add" in url:
                  return FakeResp(payload={"voice_id":"clone-test","requires_verification":False})
              if "/v1/text-to-speech/" in url:
                  return FakeResp(content=b"ID3" + b"x"*5000)
              return original_post(url, *args, **kwargs)
          mod.requests.post = fake_post

          r = c.get("/api/voice/status", headers=headers)
          assert r.status_code == 200, r.get_data(as_text=True)
          vd = r.get_json()
          assert vd["configured"] is True and vd["voiceCount"] >= 2 and vd["cloneConfigured"] is True

          r = c.post("/api/voice/clone", headers=headers, data={
              "sample": (io.BytesIO(b"voice"*1000), "voice.m4a"),
              "name": "SAGI Test Voice", "consent": "true"
          }, content_type="multipart/form-data")
          assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
          assert r.get_json()["voice_id"] == "clone-test"

          # V1.2 validates real decodable audio instead of accepting arbitrary bytes.
          original_synth = mod.synthesize_voice
          def fake_synth(text, mode, voice_id, output_path, speed=1.0, style="natural"):
              duration = max(0.8, min(2.2, len(str(text or "")) / 5.0))
              exe = imageio_ffmpeg.get_ffmpeg_exe()
              subprocess.run([
                  exe, "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "lavfi", "-i", f"sine=frequency=620:duration={duration}",
                  "-c:a", "pcm_s16le", "-f", "wav", str(output_path)
              ], check=True)
              return str(output_path)
          mod.synthesize_voice = fake_synth
          try:
              narration = "第一句完整测试。第二句也必须保留。最后一句绝不能被截掉。"
              r = c.post("/api/voice/preview", headers={**headers, "Content-Type":"application/json"},
                         json={"text":narration,"mode":"ai_male","speed":1.0})
              assert r.status_code == 200, (r.status_code, r.get_data(as_text=True))
              assert len(r.data) > 1000
              assert r.headers.get("X-SAGI-Voice-Complete") == "1"
              assert int(r.headers.get("X-SAGI-Voice-Coverage") or 0) == 100
              assert int(r.headers.get("X-SAGI-Voice-Segments") or 0) >= 3
              print("VOICE V1.2 COMPLETE PREVIEW OK", r.headers.get("X-SAGI-Voice-Segments"))
          finally:
              mod.synthesize_voice = original_synth
              mod.requests.post = original_post
          print("AI Voice API smoke OK")
          PY

      - name: Real keyless Edge Neural TTS smoke test
        run: |
          cd sagi-cloud-bridge
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import app as mod
