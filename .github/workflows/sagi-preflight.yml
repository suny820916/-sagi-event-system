          python - <<'PY'
          import imageio_ffmpeg, subprocess
          exe=imageio_ffmpeg.get_ffmpeg_exe()
          print("ffmpeg", exe)
          enc=subprocess.check_output([exe,"-hide_banner","-encoders"],text=True,stderr=subprocess.STDOUT)
