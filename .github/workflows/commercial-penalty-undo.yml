name: Commercial penalty undo
on:
  push:
    branches: [commercial-v1.0]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node commercial/core/penalty-undo-selftest.mjs
      - run: node commercial/lan/engine-lan-selftest.mjs
