name: SAGI vMix V4.26.6 Browser Self Test

on:
  push:
    paths:
      - "intro/vmix-v45-lan.html"
      - "intro/v45-lan.html"
      - "intro/tests/v4266-browser-selftest.mjs"
      - ".github/workflows/vmix-v4266-selftest.yml"
  workflow_dispatch:

jobs:
  browser-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Run SAGI browser self-test
        run: |
          mkdir -p selftest-artifacts
          node intro/tests/v4266-browser-selftest.mjs
      - name: Upload self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_V4266_BROWSER_SELFTEST
          path: selftest-artifacts
          retention-days: 7
      - name: Export certified launcher only after all tests pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V4266_CERTIFIED_LAUNCHER
          path: intro/SAGI_VMIX_LAN_V48_FULL_TEAM_NAME_4266.bat
          if-no-files-found: error
          retention-days: 7
