name: SAGI VIEWPOINT V5.4 KEYFRAME MATCH PREVIEW

concurrency:
  group: sagi-viewpoint-v54-preview-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/presets/christmas_tree_attack_viewpoint_v54_preview.json"
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v54.py"
      - ".github/workflows/sagi-viewpoint-v54-preview.yml"
  workflow_dispatch:

jobs:
  render-v54-keyframes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-viewpoint-v54 ./cloud-blender-worker

      - name: Render representative Teactics-match frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewpoint_v54_preview
          docker run --rm \
            -e SAGI_PREVIEW_SECONDS="3,6,9,13.8,15,18,21,24,27,33,39,42" \
            -v "$PWD/viewpoint_v54_preview:/out" \
            sagi-viewpoint-v54 \
            blender --background \
              --python /app/engine/sagi_tactical_execution_director_v54.py \
              -- \
              /app/presets/christmas_tree_attack_viewpoint_v54_preview.json \
              /out

          sudo chown -R "$USER":"$USER" viewpoint_v54_preview
          test -s viewpoint_v54_preview/execution_report.json
          test -s viewpoint_v54_preview/scene.blend
          test "$(find viewpoint_v54_preview -maxdepth 1 -name 'preview_*.png' | wc -l)" -eq 12

      - name: Upload V5.4 keyframe preview
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-VIEWPOINT-V5.4-KEYFRAME-MATCH-PREVIEW
          path: |
            viewpoint_v54_preview/preview_*.png
            viewpoint_v54_preview/execution_report.json
            viewpoint_v54_preview/scene.blend
            cloud-blender-worker/presets/christmas_tree_attack_viewpoint_v54_preview.json
          retention-days: 7
