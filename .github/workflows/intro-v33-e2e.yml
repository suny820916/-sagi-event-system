name: SAGI PLAYER INTRO V3.3 SHOW DIRECTOR test

on:
  push:
    paths:
      - 'intro/v33.html'
      - 'intro/vmix-v33.html'
      - '.github/workflows/intro-v33-e2e.yml'

permissions:
  contents: write

jobs:
  v33-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Chrome
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          test -n "$CHROME_BIN"
      - name: Run V3.3 SHOW DIRECTOR tests
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/intro-v33-http.log 2>&1 &
          sleep 2
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const out=[],errs=[];const add=(n,ok,d='')=>out.push({n,ok:!!ok,d});let browser;
            try{
              browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const page=await context.newPage();
              page.on('pageerror',e=>errs.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource')&&!m.text().includes('MEDIA_ELEMENT_ERROR'))errs.push('console: '+m.text())});
              const r=await page.goto('http://127.0.0.1:8080/intro/v33.html',{waitUntil:'networkidle'});
              add('页面HTTP 200',r&&r.status()===200,String(r&&r.status()));
              add('标题V3.3 SHOW DIRECTOR',(await page.title())==='SAGI PLAYER INTRO V3.3 · SHOW DIRECTOR',await page.title());
              add('手机端无横向溢出',await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+4),await page.evaluate(()=>document.documentElement.scrollWidth+' / '+innerWidth));
              add('默认输出为TUNNEL',(await page.locator('#outputBg').inputValue())==='tunnel',await page.locator('#outputBg').inputValue());
              add('TUNNEL场景存在',await page.locator('#tunnelScene').count()===1);
              add('舞台scene-tunnel启用',await page.locator('#stage').evaluate(el=>el.classList.contains('scene-tunnel')));
              add('左LED显示球队',(await page.locator('#ledLeft').textContent()).includes('TARLAN FC'),await page.locator('#ledLeft').textContent());
              add('右LED显示SAGI',(await page.locator('#ledRight').textContent()).includes('SAGI'),await page.locator('#ledRight').textContent());
              add('SHOW TIMELINE默认7段',await page.locator('#showTimeline .showStep').count()===7,String(await page.locator('#showTimeline .showStep').count()));
              add('SHOW默认总时长28.5秒',(await page.locator('#showTotal').textContent())==='28.5s',await page.locator('#showTotal').textContent());
              add('SHOW整套预演按钮存在',await page.locator('#showPlayBtn').count()===1);
              add('SHOW上一段按钮存在',await page.locator('#showPrevBtn').count()===1);
              add('SHOW下一段按钮存在',await page.locator('#showNextBtn').count()===1);
              const defaultShowNames=await page.locator('#showTimeline .showName').allTextContents();
              add('SHOW默认顺序正确',defaultShowNames.join('|')==='球队开场|门将 GK|后卫 DF|中场 MF|前锋 FW|完整首发|替补名单',defaultShowNames.join('|'));
              await page.locator('#showTimeline .showStep').first().locator('.down').click();await page.waitForTimeout(60);
              const movedShowNames=await page.locator('#showTimeline .showName').allTextContents();
              add('SHOW顺序可调整',movedShowNames[0]==='门将 GK'&&movedShowNames[1]==='球队开场',movedShowNames.join('|'));
              await page.click('#showResetBtn');await page.waitForTimeout(60);
              add('SHOW恢复默认顺序',(await page.locator('#showTimeline .showName').first().textContent())==='球队开场',await page.locator('#showTimeline .showName').first().textContent());
              const firstShow=page.locator('#showTimeline .showStep').first(),lastShow=page.locator('#showTimeline .showStep').last();
              await firstShow.locator('.showDur').fill('1.5');await firstShow.locator('.showDur').dispatchEvent('change');
              await firstShow.locator('.showTransition').selectOption('FLASH');await firstShow.locator('.showCue').selectOption('HIT');
              await lastShow.locator('.showEnable input').uncheck();await page.waitForTimeout(60);
              add('SHOW段时长可编辑',(await firstShow.locator('.showDur').inputValue())==='1.5',await firstShow.locator('.showDur').inputValue());
              add('SHOW转场可编辑',(await firstShow.locator('.showTransition').inputValue())==='FLASH',await firstShow.locator('.showTransition').inputValue());
              add('SHOW Cue可编辑',(await firstShow.locator('.showCue').inputValue())==='HIT',await firstShow.locator('.showCue').inputValue());
              add('SHOW段可禁用',!(await lastShow.locator('.showEnable input').isChecked()));
              add('SHOW禁用后总时长22.5秒',(await page.locator('#showTotal').textContent())==='22.5s',await page.locator('#showTotal').textContent());
              await page.click('#showSaveBtn');await page.reload({waitUntil:'networkidle'});await page.waitForTimeout(100);
              add('SHOW保存后时长不丢失',(await page.locator('#showTimeline .showStep').first().locator('.showDur').inputValue())==='1.5',await page.locator('#showTimeline .showStep').first().locator('.showDur').inputValue());
              add('SHOW保存后转场不丢失',(await page.locator('#showTimeline .showStep').first().locator('.showTransition').inputValue())==='FLASH',await page.locator('#showTimeline .showStep').first().locator('.showTransition').inputValue());
              add('SHOW保存后Cue不丢失',(await page.locator('#showTimeline .showStep').first().locator('.showCue').inputValue())==='HIT',await page.locator('#showTimeline .showStep').first().locator('.showCue').inputValue());
              add('SHOW保存后禁用状态不丢失',!(await page.locator('#showTimeline .showStep').last().locator('.showEnable input').isChecked()));
              await page.click('#showResetBtn');await page.waitForTimeout(60);
              const firstLive=page.locator('#showTimeline .showStep').first(),secondLive=page.locator('#showTimeline .showStep').nth(1);
              await firstLive.locator('.showDur').fill('0.5');await firstLive.locator('.showDur').dispatchEvent('change');
              await firstLive.locator('.showTransition').selectOption('FADE');await firstLive.locator('.showCue').selectOption('RISER');
              await secondLive.locator('.showEnable input').uncheck();
              
              const rows=await page.locator('#roster .playerRow').count();
              add('示例名单共16人',rows===16,String(rows));
              const metas=await page.locator('#roster .pmeta').allTextContents();
              add('首发11人+替补5人',metas.filter(x=>!x.startsWith('SUB')).length===11&&metas.filter(x=>x.startsWith('SUB')).length===5,metas.join('|'));
              add('队长C存在',(await page.locator('#roster .pname').allTextContents()).some(x=>x.includes('C')));
              add('球员数据存在',metas.some(x=>x.includes('GOALS'))&&metas.some(x=>x.includes('ASSISTS'))&&metas.some(x=>x.includes('CLEAN SHEETS')),metas.join('|'));
              await page.click('#showPlayBtn');await page.waitForTimeout(120);
              add('SHOW播放第一段激活',await page.locator('#showTimeline .showStep').first().evaluate(el=>el.classList.contains('active')));
              add('SHOW FADE转场实际启动',await page.locator('#transitionLayer').evaluate(el=>el.getAnimations&&el.getAnimations().length>0),String(await page.locator('#transitionLayer').evaluate(el=>el.getAnimations?el.getAnimations().length:0)));
              add('SHOW RISER Cue实际触发',(await page.locator('#cueBadgeStage').textContent())==='RISER',await page.locator('#cueBadgeStage').textContent());
              await page.waitForTimeout(500);
              add('SHOW自动下一段并跳过禁用GK',(await page.locator('#status').textContent()).includes('后卫 DF'),await page.locator('#status').textContent());
              add('SHOW进度条工作',parseFloat(await page.locator('#showProgressBar').evaluate(el=>el.style.width||'0'))>=0,await page.locator('#showProgressBar').evaluate(el=>el.style.width));
              await page.click('#stopBtn');await page.waitForTimeout(50);
              add('SHOW停止按钮生效',(await page.locator('#showNow').textContent())==='STOPPED',await page.locator('#showNow').textContent());
              await page.click('#showResetBtn');
              add('MEDIA DAY上传控件存在',await page.locator('#mediaFile').count()===1);
              add('远端vMix视频URL控件存在',await page.locator('#mediaUrl').count()===1);
              add('MEDIA DAY动作选择存在',await page.locator('#mediaAction option').count()>=6,String(await page.locator('#mediaAction option').count()));
              add('DIRECTOR入点控件存在',await page.locator('#directorIn').count()===1);
              add('DIRECTOR出点控件存在',await page.locator('#directorOut').count()===1);
              add('DIRECTOR速度控件存在',await page.locator('#directorSpeed option').count()>=4,String(await page.locator('#directorSpeed option').count()));
              add('DIRECTOR定格控件存在',await page.locator('#directorFreeze').count()===1);
              add('DIRECTOR镜头推进控件存在',await page.locator('#directorCamera option').count()===4,String(await page.locator('#directorCamera option').count()));
              await page.locator('#mediaFile').setInputFiles({name:'gk-test.mp4',mimeType:'video/mp4',buffer:Buffer.from('000000186674797069736f6d0000020069736f6d69736f32','hex')});
              await page.waitForTimeout(80);
              add('本机视频预览生成',await page.locator('#mediaPreview video').count()===1,String(await page.locator('#mediaPreview video').count()));
              await page.selectOption('#mediaAction','GK_GLOVES');
              await page.fill('#mediaUrl','https://media.test/gk.mp4');
              await page.fill('#directorIn','0.6');
              await page.fill('#directorOut','2.4');
              await page.selectOption('#directorSpeed','0.5');
              await page.selectOption('#directorFreeze','1');
              await page.selectOption('#directorFreezeMs','1500');
              await page.selectOption('#directorCamera','STRONG');
              await page.click('#updateBtn');
              add('名单标记MEDIA',(await page.locator('#roster .pmeta').first().textContent()).includes('MEDIA'),await page.locator('#roster .pmeta').first().textContent());
              add('名单标记0.5慢动作',(await page.locator('#roster .pmeta').first().textContent()).includes('0.5×'),await page.locator('#roster .pmeta').first().textContent());
              add('名单标记FREEZE',(await page.locator('#roster .pmeta').first().textContent()).includes('FREEZE'),await page.locator('#roster .pmeta').first().textContent());
              await page.click('#saveBtn');await page.waitForTimeout(80);
              await page.fill('#directorIn','0');await page.selectOption('#directorSpeed','1');await page.selectOption('#directorFreeze','0');await page.selectOption('#directorCamera','NONE');
              await page.click('#loadBtn');await page.waitForTimeout(180);
              add('保存读取IN点不丢失',(await page.locator('#directorIn').inputValue())==='0.6',await page.locator('#directorIn').inputValue());
              add('保存读取速度不丢失',(await page.locator('#directorSpeed').inputValue())==='0.5',await page.locator('#directorSpeed').inputValue());
              add('保存读取FREEZE不丢失',(await page.locator('#directorFreeze').inputValue())==='1',await page.locator('#directorFreeze').inputValue());
              add('保存读取镜头强度不丢失',(await page.locator('#directorCamera').inputValue())==='STRONG',await page.locator('#directorCamera').inputValue());
              add('保存读取远端URL不丢失',(await page.locator('#mediaUrl').inputValue())==='https://media.test/gk.mp4',await page.locator('#mediaUrl').inputValue());

              await page.locator('#gkBtn').scrollIntoViewIfNeeded();await page.click('#gkBtn');await page.waitForTimeout(180);
              add('门将单独出现',await page.locator('#playersArea .playerCard').count()===1);
              add('门将数据显示',await page.locator('#playersArea .statPill').count()===1,String(await page.locator('#playersArea .statPill').count()));
              add('GK英雄布局启用',await page.locator('#playersArea').evaluate(el=>el.classList.contains('layout-GK')));
              add('GK大字背景正确',(await page.locator('#roleBackdrop').textContent())==='GK',await page.locator('#roleBackdrop').textContent());
              const gkWidth=await page.locator('#playersArea .playerCard').evaluate(el=>el.getBoundingClientRect().width);
              add('GK英雄位尺寸放大',gkWidth>80,String(gkWidth));
              add('GK通道LED切换',(await page.locator('#ledLeft').textContent()).includes('GOALKEEPER'),await page.locator('#ledLeft').textContent());
              add('TUNNEL镜头推进动画启动',await page.locator('#tunnelScene').evaluate(el=>el.getAnimations&&el.getAnimations().length>0),String(await page.locator('#tunnelScene').evaluate(el=>el.getAnimations?el.getAnimations().length:0)));
              add('GK使用MEDIA DAY视频层',await page.locator('#playersArea .mediaVideo').count()===1,String(await page.locator('#playersArea .mediaVideo').count()));
              add('GK MEDIA DAY标签显示',(await page.locator('#playersArea .mediaTag').textContent()).includes('GK_GLOVES'),await page.locator('#playersArea .mediaTag').textContent());
              add('视频与照片兜底层同时存在',await page.locator('#playersArea .mediaFallback').count()===1,String(await page.locator('#playersArea .mediaFallback').count()));
              const gkVideo=page.locator('#playersArea .mediaVideo');
              add('DIRECTOR IN写入视频',(await gkVideo.getAttribute('data-in'))==='0.6',await gkVideo.getAttribute('data-in'));
              add('DIRECTOR OUT写入视频',(await gkVideo.getAttribute('data-out'))==='2.4',await gkVideo.getAttribute('data-out'));
              add('DIRECTOR 0.5×生效',Math.abs((await gkVideo.evaluate(v=>v.playbackRate))-.5)<.001,String(await gkVideo.evaluate(v=>v.playbackRate)));
              add('DIRECTOR FREEZE写入视频',(await gkVideo.getAttribute('data-freeze'))==='1',await gkVideo.getAttribute('data-freeze'));
              add('DIRECTOR STRONG镜头写入',(await gkVideo.getAttribute('data-camera'))==='STRONG',await gkVideo.getAttribute('data-camera'));
              add('DIRECTOR标签显示0.50×',(await page.locator('#playersArea .directorBadge').textContent()).includes('0.50×'),await page.locator('#playersArea .directorBadge').textContent());
              const freezeTriggered=await gkVideo.evaluate(v=>{try{Object.defineProperty(v,'duration',{configurable:true,value:5});Object.defineProperty(v,'currentTime',{configurable:true,writable:true,value:2.41});v.pause=()=>{};v.dispatchEvent(new Event('timeupdate'));return v.dataset.frozen==='1'}catch(e){return false}});
              add('DIRECTOR末帧定格逻辑触发',freezeTriggered,String(freezeTriggered));

              await page.click('#dfBtn');await page.waitForTimeout(180);
              add('4名后卫组合',await page.locator('#playersArea .playerCard').count()===4);
              add('后卫阵型4点高亮',await page.locator('#formationNodes .node.active').count()===4);
              add('阵型点原生动画启动',await page.locator('#formationNodes .node.active').first().evaluate(el=>el.getAnimations&&el.getAnimations().length>0));
              add('后卫DEF大字背景',(await page.locator('#roleBackdrop').textContent())==='DEF',await page.locator('#roleBackdrop').textContent());
              const dfWidths=await page.locator('#playersArea .playerCard').evaluateAll(els=>els.map(x=>x.getBoundingClientRect().width));
              add('后卫中间两人更突出',dfWidths.length===4&&dfWidths[1]>dfWidths[0]*1.2&&dfWidths[2]>dfWidths[3]*1.2,JSON.stringify(dfWidths));

              await page.click('#mfBtn');await page.waitForTimeout(180);
              add('3名中场组合',await page.locator('#playersArea .playerCard').count()===3);
              add('中场数据卡存在',await page.locator('#playersArea .statPill').count()===3,String(await page.locator('#playersArea .statPill').count()));
              add('中场MID大字背景',(await page.locator('#roleBackdrop').textContent())==='MID',await page.locator('#roleBackdrop').textContent());
              const mfWidths=await page.locator('#playersArea .playerCard').evaluateAll(els=>els.map(x=>x.getBoundingClientRect().width));
              add('中场核心人物最大',mfWidths.length===3&&mfWidths[1]>mfWidths[0]*1.25&&mfWidths[1]>mfWidths[2]*1.25,JSON.stringify(mfWidths));

              await page.click('#fwBtn');await page.waitForTimeout(180);
              add('3名前锋组合',await page.locator('#playersArea .playerCard').count()===3);
              add('前锋GOALS数据存在',(await page.locator('#playersArea').textContent()).includes('GOALS'));
              add('前锋FWD大字背景',(await page.locator('#roleBackdrop').textContent())==='FWD',await page.locator('#roleBackdrop').textContent());
              const fwWidths=await page.locator('#playersArea .playerCard').evaluateAll(els=>els.map(x=>x.getBoundingClientRect().width));
              add('前锋中锋英雄位最大',fwWidths.length===3&&fwWidths[1]>fwWidths[0]*1.25&&fwWidths[1]>fwWidths[2]*1.25,JSON.stringify(fwWidths));
              const visualGeom=await page.evaluate(()=>{const f=document.getElementById('frame').getBoundingClientRect(),cards=[...document.querySelectorAll('#playersArea .playerCard')].map(x=>x.getBoundingClientRect());const hit=r=>r.right>f.left&&r.left<f.right&&r.bottom>f.top&&r.top<f.bottom;return{frame:{x:f.x,y:f.y,w:f.width,h:f.height},cards:cards.map(r=>({x:r.x,y:r.y,w:r.width,h:r.height,hit:hit(r)}))}});
              add('V3.3人物全部在预览框内',visualGeom.cards.every(x=>x.hit),JSON.stringify(visualGeom));

              await page.click('#fullBtn');await page.waitForTimeout(180);
              add('完整首发仍为11人',await page.locator('#fullList .fullRow').count()===11,String(await page.locator('#fullList .fullRow').count()));
              add('完整阵型11点全亮',await page.locator('#formationNodes .node.active').count()===11);
              add('完整首发显示队长C',await page.locator('#fullList .captainBadge').count()===1,String(await page.locator('#fullList .captainBadge').count()));
              add('FULL时通道出口打开',await page.locator('#stage').evaluate(el=>el.classList.contains('tunnel-open')));
              add('FULL时LED切换FORMATION',(await page.locator('#ledLeft').textContent()).includes('FORMATION'),await page.locator('#ledLeft').textContent());

              await page.click('#subsBtn');await page.waitForTimeout(180);
              add('替补画面5人',await page.locator('#subList .subRow').count()===5,String(await page.locator('#subList .subRow').count()));
              add('替补标题正确',(await page.locator('#groupName').textContent())==='SUBSTITUTES',await page.locator('#groupName').textContent());
              await page.selectOption('#outputBg','stadium');await page.waitForTimeout(100);
              add('切换STADIUM后通道隐藏',await page.locator('#tunnelScene').evaluate(el=>getComputedStyle(el).display==='none'),await page.locator('#tunnelScene').evaluate(el=>getComputedStyle(el).display));
              await page.selectOption('#outputBg','tunnel');await page.waitForTimeout(100);
              add('切回TUNNEL后通道恢复',await page.locator('#tunnelScene').evaluate(el=>getComputedStyle(el).display!=='none'),await page.locator('#tunnelScene').evaluate(el=>getComputedStyle(el).display));

              await page.click('#autoBtn');await page.waitForTimeout(180);
              add('自动播放升级为7段',(await page.locator('#status').textContent()).includes('/ 7'),await page.locator('#status').textContent());
              await page.click('#stopBtn');

              const link=await page.evaluate(()=>new URL('./vmix-v33.html',location.href).toString());
              add('V3.3 vMix链接正确',link.includes('vmix-v33.html'),link);

              const state={commandId:'v33_test_1',visualVersion:'V3.3-SHOW-DIRECTOR',group:'DF',team:'TARLAN FC',formation:'4-3-3',
                players:[
                  {name:'DIAS',number:'2',role:'DF',position:'RB',captain:false,statLabel:'APPS',statValue:'12',photo:''},
                  {name:'NURLAN',number:'4',role:'DF',position:'CB',captain:true,statLabel:'APPS',statValue:'14',photo:'',mediaUrl:'https://media.test/nurlan.mp4',mediaAction:'ARMS',directorIn:0.4,directorOut:2.2,directorSpeed:0.75,directorFreeze:true,directorFreezeMs:1000,directorCamera:'STRONG'},
                  {name:'ALMAS',number:'5',role:'DF',position:'CB',captain:false,statLabel:'APPS',statValue:'13',photo:''},
                  {name:'ERLAN',number:'3',role:'DF',position:'LB',captain:false,statLabel:'APPS',statValue:'11',photo:''}
                ],
                allPlayers:[
                  {name:'AZAMAT',number:'1',role:'GK',position:'GK',captain:false,statLabel:'CLEAN SHEETS',statValue:'6'},
                  {name:'DIAS',number:'2',role:'DF',position:'RB',captain:false,statLabel:'APPS',statValue:'12'},
                  {name:'NURLAN',number:'4',role:'DF',position:'CB',captain:true,statLabel:'APPS',statValue:'14'},
                  {name:'ALMAS',number:'5',role:'DF',position:'CB',captain:false,statLabel:'APPS',statValue:'13'},
                  {name:'ERLAN',number:'3',role:'DF',position:'LB',captain:false,statLabel:'APPS',statValue:'11'},
                  {name:'SULTAN',number:'6',role:'MF',position:'CM',captain:false,statLabel:'ASSISTS',statValue:'5'},
                  {name:'MARHULAN',number:'8',role:'MF',position:'CM',captain:false,statLabel:'APPS',statValue:'14'},
                  {name:'ASLAN',number:'10',role:'MF',position:'AM',captain:false,statLabel:'GOALS',statValue:'7'},
                  {name:'DANIYAR',number:'7',role:'FW',position:'RW',captain:false,statLabel:'GOALS',statValue:'8'},
                  {name:'ARDAK',number:'9',role:'FW',position:'ST',captain:false,statLabel:'GOALS',statValue:'12'},
                  {name:'TIMUR',number:'11',role:'FW',position:'LW',captain:false,statLabel:'GOALS',statValue:'6'}
                ],
                substitutes:[
                  {name:'BEK',number:'12',role:'GK',position:'GK',statLabel:'APPS',statValue:'3'},
                  {name:'RUSLAN',number:'14',role:'DF',position:'CB',statLabel:'APPS',statValue:'6'},
                  {name:'ILIAS',number:'16',role:'MF',position:'CM',statLabel:'ASSISTS',statValue:'2'},
                  {name:'SAMAT',number:'18',role:'FW',position:'ST',statLabel:'GOALS',statValue:'3'},
                  {name:'AMAN',number:'20',role:'FW',position:'RW',statLabel:'APPS',statValue:'5'}
                ],crest:'',stadium:'',background:'tunnel',duration:4000,show:{sessionId:'show_test_1',stepIndex:2,stepTotal:6,label:'后卫 DF',transition:'SLIDE',cue:'WHOOSH',autoNext:true}};
              await context.route('**/rest/v1/rpc/sagi_get_event',async route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({slug:'tacheng-winter-2026',revision:1,payload:{lineupIntro:state}})}));
              await context.route('https://media.test/**',async route=>route.fulfill({status:200,contentType:'video/mp4',body:Buffer.from('000000186674797069736f6d0000020069736f6d69736f32','hex')}));
