name: SAGI VOICE Standalone Live E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sagi-voice-direct-live.yml"

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify permanent workers.dev PWA + real audio
        run: |
          set -euo pipefail
          BASE="https://sagi-voice-edge-relay.sg3544225.workers.dev"
          API="$BASE/api/direct-tts"

          echo "=== wait for permanent standalone PWA v2 ==="
          READY=0
          for i in $(seq 1 48); do
            HTML="$(curl --fail --show-error --silent --connect-timeout 10 --max-time 20 "$BASE/" || true)"
            MANIFEST="$(curl --fail --show-error --silent --connect-timeout 10 --max-time 20 "$BASE/manifest.webmanifest" || true)"
            SW="$(curl --fail --show-error --silent --connect-timeout 10 --max-time 20 "$BASE/voice-sw.js" || true)"
            if echo "$HTML" | grep -q "独立长期入口 · 不属于 SAGI TOOLS · R3.2" \
              && echo "$MANIFEST" | grep -q '"start_url":"/"' \
              && echo "$SW" | grep -q 'sagi-voice-standalone-v2'; then
              READY=1
              echo "standalone PWA v2 live on attempt $i"
              break
            fi
            echo "standalone PWA v2 not fully live yet: $i/48"
            sleep 5
          done
          test "$READY" = "1"

          echo "=== root and legacy alias ==="
          curl --fail --show-error --silent "$BASE/" | grep -q "SAGI VOICE"
          curl --fail --show-error --silent "$BASE/voice" | grep -q "SAGI VOICE"

          echo "=== PWA assets ==="
          MANIFEST="$(curl --fail --show-error --silent "$BASE/manifest.webmanifest")"
          echo "$MANIFEST" | grep -q '"name":"SAGI VOICE"'
          echo "$MANIFEST" | grep -q '"start_url":"/"'
          echo "$MANIFEST" | grep -q '"display":"standalone"'
          curl --fail --show-error --silent "$BASE/voice-manifest.json" | grep -q '"name":"SAGI VOICE"'
          curl --fail --show-error --silent "$BASE/voice-sw.js" | grep -q 'sagi-voice-standalone-v2'
          curl --fail --show-error --silent "$BASE/icon.svg" | grep -q '<svg'
          curl --fail --show-error --silent "$BASE/voice-icon.svg" | grep -q '<svg'

          echo "=== real Microsoft Edge Neural audio ==="
          BODY='{"text":"第三次参加阿图什杯，这一次，塔城要冲出小组，创造历史！","mode":"ai_male","speed":1.16,"style":"football_passion","quality":"cinema"}'
          STATUS="$(curl --show-error --silent             -H "Content-Type: application/json"             -d "$BODY"             -D /tmp/headers             -o /tmp/audio             -w '%{http_code}'             "$API")"
          cat /tmp/headers
          echo "http_status=$STATUS"
          if [ "$STATUS" != "200" ]; then cat /tmp/audio; exit 1; fi
          SIZE="$(wc -c < /tmp/audio)"
          echo "audio_bytes=$SIZE"
          test "$SIZE" -gt 5000
          grep -qi '^x-sagi-direct-tts: 1' /tmp/headers
          grep -qi '^x-sagi-voice-complete: 1' /tmp/headers
          grep -qi '^x-sagi-voice-provider: Microsoft Edge Neural Direct' /tmp/headers
          echo "SAGI VOICE PERMANENT WORKERS.DEV PWA LIVE E2E OK"
