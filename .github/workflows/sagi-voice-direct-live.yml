name: SAGI VOICE Standalone Live E2E
# permanent-entry-r3.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sagi-voice-direct-live.yml"

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify sagisports.cn standalone voice
        run: |
          set -euo pipefail
          PAGE="https://sagisports.cn/voice/"
          API="https://sagi-voice-edge-relay.sg3544225.workers.dev/api/direct-tts"

          echo "=== wait for standalone page ==="
          READY=0
          for i in $(seq 1 36); do
            HTML="$(curl --fail --show-error --silent --connect-timeout 10 --max-time 20 "$PAGE" || true)"
            if echo "$HTML" | grep -q "STANDALONE R3.1" && echo "$HTML" | grep -q "不属于 SAGI TOOLS"; then
              READY=1
              echo "standalone page live on attempt $i"
              break
            fi
            echo "standalone page not live yet: $i/36"
            sleep 5
          done
          test "$READY" = "1"

          echo "=== CORS preflight ==="
          curl --fail --show-error --silent -X OPTIONS             -H "Origin: https://sagisports.cn"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: content-type"             -D /tmp/preflight             -o /dev/null             "$API"
          cat /tmp/preflight
          grep -qi '^access-control-allow-origin: https://sagisports.cn' /tmp/preflight
          grep -qi '^access-control-allow-methods: .*POST' /tmp/preflight

          echo "=== real standalone audio ==="
          BODY='{"text":"第三次参加阿图什杯，这一次，塔城要冲出小组，创造历史！","mode":"ai_male","speed":1.16,"style":"football_passion","quality":"cinema"}'
          STATUS="$(curl --show-error --silent             -H "Origin: https://sagisports.cn"             -H "Content-Type: application/json"             -d "$BODY"             -D /tmp/headers             -o /tmp/audio             -w '%{http_code}'             "$API")"
          cat /tmp/headers
          echo "http_status=$STATUS"
          if [ "$STATUS" != "200" ]; then cat /tmp/audio; exit 1; fi

          SIZE="$(wc -c < /tmp/audio)"
          echo "audio_bytes=$SIZE"
          test "$SIZE" -gt 5000
          grep -qi '^access-control-allow-origin: https://sagisports.cn' /tmp/headers
          grep -qi '^x-sagi-direct-tts: 1' /tmp/headers
          grep -qi '^x-sagi-voice-complete: 1' /tmp/headers
          grep -qi '^x-sagi-voice-provider: Microsoft Edge Neural Direct' /tmp/headers
          echo "SAGI VOICE STANDALONE LIVE E2E OK"
