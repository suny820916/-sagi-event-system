name: SAGI VIEWPOINT V5.3 TEACTICS UI HIERARCHY PREVIEW

concurrency:
  group: sagi-viewpoint-v53-preview-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/presets/christmas_tree_attack_viewpoint_v53_preview.json"
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v53.py"
      - ".github/workflows/sagi-viewpoint-v53-preview.yml"
  workflow_dispatch:

jobs:
  render-viewpoint-v53-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-viewpoint-v53 ./cloud-blender-worker

      - name: Render V5.3 12fps visual preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewpoint_v53_out
          docker run --rm \
            -v "$PWD/viewpoint_v53_out:/out" \
            sagi-viewpoint-v53 \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends fonts-dejavu-core fonts-lato >/dev/null

              blender --background \
                --python /app/engine/sagi_tactical_execution_director_v53.py \
                -- \
                /app/presets/christmas_tree_attack_viewpoint_v53_preview.json \
                /out

              ffmpeg -y -loglevel error \
                -framerate 12 \
                -i /out/frames/frame_%04d.png \
                -f lavfi \
                -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 -profile:v baseline -level 3.1 \
                -pix_fmt yuv420p -preset veryfast -crf 19 \
                -c:a aac -b:a 64k -shortest -movflags +faststart \
                /out/SAGI_VIEWPOINT_V5_3_BASE.mp4

              printf "%s" "" | base64 -d > /out/v53_titles.ass

              ffmpeg -y -loglevel error \
                -i /out/SAGI_VIEWPOINT_V5_3_BASE.mp4 \
                -vf "ass=/out/v53_titles.ass" \
                -c:v libx264 -profile:v baseline -level 3.1 \
                -pix_fmt yuv420p -preset veryfast -crf 19 \
                -c:a copy -movflags +faststart \
                /out/SAGI_VIEWPOINT_V5_3_PREVIEW_00_43.mp4

              ffmpeg -y -loglevel error \
                -ss 12 -t 31 \
                -i /out/SAGI_VIEWPOINT_V5_3_PREVIEW_00_43.mp4 \
                -c:v libx264 -pix_fmt yuv420p -crf 19 -preset veryfast -c:a aac \
                /out/SAGI_VIEWPOINT_V5_3_PREVIEW_12_43.mp4

              rm -f /out/SAGI_VIEWPOINT_V5_3_BASE.mp4
            '

          sudo chown -R "$USER":"$USER" viewpoint_v53_out
          test -s viewpoint_v53_out/SAGI_VIEWPOINT_V5_3_PREVIEW_00_43.mp4
          test -s viewpoint_v53_out/SAGI_VIEWPOINT_V5_3_PREVIEW_12_43.mp4
          test -s viewpoint_v53_out/execution_report.json

      - name: Upload V5.3 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-VIEWPOINT-V5.3-TEACTICS-UI-HIERARCHY-PREVIEW
          path: |
            viewpoint_v53_out/SAGI_VIEWPOINT_V5_3_PREVIEW_00_43.mp4
            viewpoint_v53_out/SAGI_VIEWPOINT_V5_3_PREVIEW_12_43.mp4
            viewpoint_v53_out/execution_report.json
            viewpoint_v53_out/scene.blend
            viewpoint_v53_out/v53_titles.ass
            cloud-blender-worker/presets/christmas_tree_attack_viewpoint_v53_preview.json
          retention-days: 7
