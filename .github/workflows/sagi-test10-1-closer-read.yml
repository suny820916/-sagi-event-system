name: SAGI TEST 10.1 CLOSER READ

concurrency:
  group: sagi-test10-1-closer-read-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/presets/christmas_tree_execution_test10_1_closer_read.json"
      - ".github/workflows/sagi-test10-1-closer-read.yml"
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v1.py"
  workflow_dispatch:

jobs:
  render-test10-1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-test10-1 ./cloud-blender-worker

      - name: Render TEST 10.1 and encode iPhone-safe MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test10_1_out
          docker run --rm \
            -v "$PWD/test10_1_out:/out" \
            sagi-test10-1 \
            bash -lc '
              blender --background \
                --python /app/engine/sagi_tactical_execution_director_v1.py \
                -- \
                /app/presets/christmas_tree_execution_test10_1_closer_read.json \
                /out

              ffmpeg -y -loglevel error \
                -framerate 24 \
                -i /out/frames/frame_%04d.png \
                -f lavfi \
                -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 \
                -profile:v baseline \
                -level 3.1 \
                -pix_fmt yuv420p \
                -preset veryfast \
                -crf 23 \
                -c:a aac \
                -b:a 64k \
                -shortest \
                -movflags +faststart \
                /out/SAGI_TEST10_1_CLOSER_READ.mp4

              ffprobe -v error \
                -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
                -of json \
                /out/SAGI_TEST10_1_CLOSER_READ.mp4 \
                > /out/probe.json
            '
          sudo chown -R "$USER":"$USER" test10_1_out
          test -s test10_1_out/SAGI_TEST10_1_CLOSER_READ.mp4
          cat test10_1_out/execution_report.json
          cat test10_1_out/probe.json

      - name: Upload TEST 10.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-TEST10-1-CLOSER-READ
          path: |
            test10_1_out/SAGI_TEST10_1_CLOSER_READ.mp4
            test10_1_out/execution_report.json
            test10_1_out/probe.json
            test10_1_out/scene.blend
          retention-days: 7
