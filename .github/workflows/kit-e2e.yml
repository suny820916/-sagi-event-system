name: SAGI KIT DESIGNER V1.2.1 test

on:
  push:
    paths:
      - 'kit/**'
      - '.github/workflows/kit-e2e.yml'

permissions:
  contents: write

jobs:
  kit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Chrome
        run: |
          npm install --no-save playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          test -n "$CHROME_BIN"
      - name: Run V1.2.1 factory pattern tests
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/kit-http.log 2>&1 &
          sleep 2
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const out=[],errs=[]; const add=(n,ok,d='')=>out.push({n,ok:!!ok,d});
            let browser;
            try{
              browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,acceptDownloads:true});
              const page=await context.newPage();
              page.on('pageerror',e=>errs.push('pageerror: '+e.message));
              page.on('console',m=>{if(m.type()==='error')errs.push('console: '+m.text())});
              const r=await page.goto('http://127.0.0.1:8080/kit/v121.html',{waitUntil:'networkidle'});
              add('页面HTTP 200',r&&r.status()===200,String(r&&r.status()));
              add('标题V1.2.1',(await page.title())==='SAGI KIT DESIGNER V1.2.1',await page.title());
              add('默认纸样生产板',await page.locator('#paperView').evaluate(el=>getComputedStyle(el).display!=='none'));

              for(const id of ['front','back','sleeve','cuff','collarWide','collarNarrow']){
                add('裁片存在 '+id,await page.locator('#piece-'+id).count()===1);
              }

              add('描摹轮廓默认锁定',await page.isChecked('#patternLocked'));
              add('锁定时位置不可编辑',await page.locator('#pieceX').isDisabled()&&await page.locator('#pieceW').isDisabled());

              await page.uncheck('#patternLocked');
              await page.fill('#pieceX','45');
              await page.fill('#pieceY','205');
              add('解锁后可改前片坐标',(await page.locator('#piece-front').getAttribute('transform')).includes('translate(45 205)'),await page.locator('#piece-front').getAttribute('transform'));

              await page.check('#patternLocked');
              await page.click('[data-piece="collarWide"]');
              await page.locator('#pieceColor').evaluate(el=>{el.value='#145b46';el.dispatchEvent(new Event('input',{bubbles:true}))});
              await page.click('[data-piece="collarNarrow"]');
              await page.locator('#pieceColor').evaluate(el=>{el.value='#f5ebdd';el.dispatchEvent(new Event('input',{bubbles:true}))});
              add('双层领口独立配色',(await page.locator('#collarWideShape').getAttribute('fill')).toLowerCase()==='#145b46'&&(await page.locator('#collarNarrowShape').getAttribute('fill')).toLowerCase()==='#f5ebdd');

              await page.click('[data-piece="front"]');
              await page.selectOption('#patternType','flow');
              add('前片独立纹样',await page.locator('#frontPattern path').count()>0,String(await page.locator('#frontPattern path').count()));
              await page.click('[data-piece="back"]');
              await page.selectOption('#patternType','weave');
              add('后片独立纹样',await page.locator('#backPattern line').count()>10,String(await page.locator('#backPattern line').count()));
              await page.click('[data-piece="sleeve"]');
              await page.selectOption('#patternType','diag');
              add('肩袖独立纹样',await page.locator('#sleevePattern line').count()>10,String(await page.locator('#sleevePattern line').count()));

              await page.fill('#crestX','88'); await page.fill('#crestY','118'); await page.fill('#crestW','30');
              const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2L9sAAAAASUVORK5CYII=','base64');
              await page.locator('#crestFile').setInputFiles({name:'crest.png',mimeType:'image/png',buffer:png});
              await page.waitForTimeout(200);
              add('队徽按mm定位到前片',(await page.locator('#frontAssets image').first().getAttribute('x'))==='88'&&(await page.locator('#frontAssets image').first().getAttribute('width'))==='30');

              const refSvg=Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="red"/></svg>');
              await page.locator('#refFile').setInputFiles({name:'factory.svg',mimeType:'image/svg+xml',buffer:refSvg});
              await page.waitForTimeout(100);
              add('厂家参考层可导入',await page.locator('#refLayer image').count()===1);
              await page.fill('#refOpacity','25');
              add('参考层透明度可调',(await page.locator('#refLayer').getAttribute('opacity'))==='0.25',await page.locator('#refLayer').getAttribute('opacity'));

              await page.click('#previewBtn');
              add('成衣预览可切换',await page.locator('#previewView').evaluate(el=>getComputedStyle(el).display!=='none'));
              await page.click('#paperBtn');

              await page.click('#saveBtn'); await page.fill('#chestText','TEMP'); await page.click('#loadBtn');
              add('V1.2.1保存读取正常',(await page.inputValue('#chestText'))==='塔城',await page.inputValue('#chestText'));

              const svgDownload=page.waitForEvent('download');
              await page.click('#svgBtn'); const sd=await svgDownload;
              add('描摹SVG可导出',sd.suggestedFilename()==='SAGI-KIT-V121-TRACE.svg',sd.suggestedFilename());

              const spec=await page.locator('#spec').innerText();
              add('未标定时不冒充毫米',spec.includes('未标定（当前只保证形状与比例）')&&spec.includes('前片 ×1')&&spec.includes('肩袖 ×2'),spec.slice(0,220));
              await page.fill('#frontActualWidth','520');
              const scaleText=await page.inputValue('#scaleInfo');
              add('输入真实前片宽度后完成mm标定',scaleText.includes('mm/单位'),scaleText);
              add('手机端无横向溢出',await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+4),await page.evaluate(()=>document.documentElement.scrollWidth+' / '+innerWidth));
              await context.close();
            }catch(e){errs.push('fatal: '+(e.stack||e.message||String(e)))}finally{if(browser)await browser.close()}
            const failed=out.filter(x=>!x.ok);
            const lines=['SAGI KIT DESIGNER V1.2.1 TEST','time='+new Date().toISOString(),'',
              ...out.map(x=>(x.ok?'PASS':'FAIL')+' | '+x.n+(x.d?' | '+x.d:'')),'','Browser errors:',...(errs.length?errs:['none']),'',
              'SUMMARY: '+(failed.length===0&&errs.length===0?'PASS':'FAIL')+' ('+(out.length-failed.length)+'/'+out.length+' checks passed)'];
            fs.writeFileSync('kit-test-result.txt',lines.join('\n'));console.log(lines.join('\n'));
            if(failed.length||errs.length)process.exitCode=1;
          })();
          NODE
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f kit-test-result.txt ]; then
            git add kit-test-result.txt
            git commit -m "Record SAGI KIT DESIGNER V1.2.1 test result" || exit 0
            git push
          fi
