name: SAGI vMix V4.35 HUMANIZED CONTROLS R1 Certification

on:
  push:
    paths:
      - "intro/vmix-v45-lan.html"
      - "intro/v45-lan.html"
      - "intro/assets/toranhe-event-logo.png"
      - "intro/tests/v4270-browser-selftest.mjs"
      - "intro/sagi-signature-core-v432.js"
      - "intro/tests/v432-signature-core-selftest.mjs"
      - "intro/tests/v432-event-identity-gate.mjs"
      - "intro/tests/v432-brand-gate.mjs"
      - "intro/tests/v432-integration-gate.mjs"
      - "intro/tests/v433-penalty-single-source-gate.mjs"
      - "intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat"
      - "intro/tests/v434-replay-brand-transition-gate.mjs"
      - "intro/SAGI_VMIX_LAN_V434_REPLAY_BRAND_RC.bat"
      - "intro/tests/v435-humanized-controls-gate.mjs"
      - "intro/SAGI_VMIX_LAN_V435_HUMANIZED_CONTROLS_RC.bat"
      - "intro/tests/v432-china-lan-preflight.mjs"
      - "intro/tests/v432-bridge-ssot-runtime.ps1"
      - "intro/tests/v432-field-preflight.ps1"
      - "intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat"
      - "intro/tests/v4311-replay-hotfix-selftest.mjs"
      - "intro/SAGI_VMIX_LAN_V4311_REPLAY_HOTFIX.bat"
      - ".github/workflows/vmix-v4270-selftest.yml"
      - "intro/SAGI_VMIX_LAN_V48_STAGE_4310.bat"
  pull_request:
    paths:
      - "intro/vmix-v45-lan.html"
      - "intro/v45-lan.html"
      - "intro/assets/toranhe-event-logo.png"
      - "intro/tests/v4270-browser-selftest.mjs"
      - "intro/sagi-signature-core-v432.js"
      - "intro/tests/v432-signature-core-selftest.mjs"
      - "intro/tests/v432-event-identity-gate.mjs"
      - "intro/tests/v432-brand-gate.mjs"
      - "intro/tests/v432-integration-gate.mjs"
      - "intro/tests/v433-penalty-single-source-gate.mjs"
      - "intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat"
      - "intro/tests/v434-replay-brand-transition-gate.mjs"
      - "intro/SAGI_VMIX_LAN_V434_REPLAY_BRAND_RC.bat"
      - "intro/tests/v435-humanized-controls-gate.mjs"
      - "intro/SAGI_VMIX_LAN_V435_HUMANIZED_CONTROLS_RC.bat"
      - "intro/tests/v432-china-lan-preflight.mjs"
      - "intro/tests/v432-bridge-ssot-runtime.ps1"
      - "intro/tests/v432-field-preflight.ps1"
      - "intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat"
      - "intro/tests/v4311-replay-hotfix-selftest.mjs"
      - "intro/SAGI_VMIX_LAN_V4311_REPLAY_HOTFIX.bat"
      - ".github/workflows/vmix-v4270-selftest.yml"
      - "intro/SAGI_VMIX_LAN_V48_STAGE_4310.bat"
  workflow_dispatch:

jobs:
  browser-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify main integration merge without modifying branch
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main
          candidate="${PR_HEAD_SHA:-$(git rev-parse HEAD)}"
          echo "Candidate head: $candidate"
          echo "Current main: $(git rev-parse FETCH_HEAD)"
          base="$(git merge-base "$candidate" FETCH_HEAD)"
          echo "Merge base: $base"
          if git merge-tree --write-tree "$candidate" FETCH_HEAD > /tmp/sagi-v432-merge-tree.txt 2>&1; then
            echo "V4.32 main integration rehearsal: CLEAN"
          else
            echo "::error::V4.32 main integration rehearsal failed"
            sed -n '1,120p' /tmp/sagi-v432-merge-tree.txt
            exit 1
          fi
      - name: Validate V4.31.0 BAT launcher structure
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='intro/SAGI_VMIX_LAN_V48_STAGE_4310.bat';
          const s=fs.readFileSync(p,'utf8');
          const lines=s.split(/\r?\n/);
          const idx={ps:lines.indexOf('###SAGI_PS###'),control:lines.indexOf('###SAGI_CONTROL###'),output:lines.indexOf('###SAGI_OUTPUT###')};
          const markers=lines.filter(x=>/^###SAGI_(PS|CONTROL|OUTPUT)###$/.test(x));
          if(JSON.stringify(markers)!==JSON.stringify(['###SAGI_PS###','###SAGI_CONTROL###','###SAGI_OUTPUT###'])) throw new Error('BAT embedded marker structure is broken: '+JSON.stringify(markers));
          if(!(idx.ps>0&&idx.control>idx.ps&&idx.output>idx.control)) throw new Error('BAT payload marker order is invalid: '+JSON.stringify(idx));
          const rx=lines.find(x=>x.includes('$m=[regex]::Match'));
          if(!rx||!rx.includes('###SAGI_PS###')||!rx.includes('###SAGI_CONTROL###')||!rx.includes('###SAGI_OUTPUT###')) throw new Error('BAT PowerShell extraction command is truncated');
          const control=lines.slice(idx.control+1,idx.output).join('\n');
          const output=lines.slice(idx.output+1).join('\n');
          if(!control.includes('V4.31.0')||!control.includes('sagiLiveHealthCheck')) throw new Error('V4.31.0 control payload missing');
          if(!output.includes('V4.31.0')||!output.includes('sagiOutputWatchdog')) throw new Error('V4.31.0 output payload missing');
          const staleGuard='V4\\.30\\.9', currentGuard='V4\\.31\\.0';
          if(s.includes(staleGuard)) throw new Error('BAT still contains stale V4.30.9 validation logic');
          if(s.split(currentGuard).length-1<2) throw new Error('BAT V4.31.0 validation guards missing');
          if(!lines.some(x=>x.includes('powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ^'))) throw new Error('BAT PowerShell bootstrap missing');
          console.log('BAT STRUCTURE PASS', {bytes:Buffer.byteLength(s),idx});
          NODE
      - name: Require replay compatibility coverage in broadcast browser self-test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('intro/tests/v4270-browser-selftest.mjs','utf8');
          const required=[
            'TEST 6: event-logo replay stinger visual',
            'TEST 7: replay key plays only latest Replay Event',
            'replay stinger did not auto clear',
            'replay stinger'
          ];
          for(const marker of required) if(!s.includes(marker)) throw new Error('Replay regression coverage missing: '+marker);
          console.log('Replay browser regression coverage present; full browser test must pass below');
          NODE
      - name: Validate V4.32 Signature Core
        run: node intro/tests/v432-signature-core-selftest.mjs
      - name: Validate V4.32 event identity
        run: node intro/tests/v432-event-identity-gate.mjs
      - name: Validate V4.32 SAGI brand integration
        run: node intro/tests/v432-brand-gate.mjs
      - name: Validate V4.32 clean integration and package
        run: node intro/tests/v432-integration-gate.mjs
      - name: Validate inherited V4.33 penalty SSOT and historical package
        run: node intro/tests/v433-penalty-single-source-gate.mjs
      - name: Validate inherited V4.34 replay brand and historical package
        run: node intro/tests/v434-replay-brand-transition-gate.mjs
      - name: Validate V4.35 humanized controls and exact package parity
        run: node intro/tests/v435-humanized-controls-gate.mjs
      - name: Validate China LAN-first packaged core dependency gate
        run: node intro/tests/v432-china-lan-preflight.mjs
      - name: Run V4.31.0 broadcast compatibility self-test
        run: |
          mkdir -p selftest-artifacts
          node intro/tests/v4270-browser-selftest.mjs
      - name: Upload V4.31.0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_V4310_STAGE_SELFTEST
          path: selftest-artifacts
          retention-days: 7
      - name: Export certified launcher only after all tests pass
        if: success() && hashFiles('intro/SAGI_VMIX_LAN_V48_STAGE_4310.bat') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V4310_STAGE_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V48_STAGE_4310.bat
          if-no-files-found: error
          retention-days: 7
      - name: Export V4.31.1 replay hotfix after compatibility gate
        if: success() && hashFiles('intro/SAGI_VMIX_LAN_V4311_REPLAY_HOTFIX.bat') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V4311_REPLAY_HOTFIX_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V4311_REPLAY_HOTFIX.bat
          if-no-files-found: error
          retention-days: 7
      - name: Export V4.32 SIGNATURE RC after automated gates (not production certified)
        if: success() && hashFiles('intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V432_SIGNATURE_RC_CI_PASSED_NOT_PRODUCTION_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat
          if-no-files-found: error
          retention-days: 7


      - name: Export V4.33 PENALTY SSOT RC after automated gates
        if: success() && hashFiles('intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V433_PENALTY_SSOT_RC_CI_PASSED_NOT_PRODUCTION_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat
          if-no-files-found: error
          retention-days: 7

      - name: Export V4.34 REPLAY BRAND RC after automated gates
        if: success() && hashFiles('intro/SAGI_VMIX_LAN_V434_REPLAY_BRAND_RC.bat') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V434_REPLAY_BRAND_RC_CI_PASSED_NOT_PRODUCTION_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V434_REPLAY_BRAND_RC.bat
          if-no-files-found: error
          retention-days: 7

      - name: Export V4.35 HUMANIZED CONTROLS RC after automated gates
        if: success() && hashFiles('intro/SAGI_VMIX_LAN_V435_HUMANIZED_CONTROLS_RC.bat') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_VMIX_V435_HUMANIZED_CONTROLS_RC_CI_PASSED_NOT_PRODUCTION_CERTIFIED
          path: intro/SAGI_VMIX_LAN_V435_HUMANIZED_CONTROLS_RC.bat
          if-no-files-found: error
          retention-days: 7


  windows-package-validation:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate V4.32 package extraction and PowerShell syntax on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'intro/SAGI_VMIX_LAN_V432_SIGNATURE_RC.bat'
          $source = [IO.File]::ReadAllText((Resolve-Path $path), [Text.Encoding]::UTF8)
          $pattern = '(?s)###SAGI_PS###\r?\n(.*?)\r?\n###SAGI_CONTROL###\r?\n(.*?)\r?\n###SAGI_OUTPUT###\r?\n(.*)$'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'Embedded BAT payload extraction failed' }
          $bridge = $match.Groups[1].Value
          $control = $match.Groups[2].Value
          $output = $match.Groups[3].Value
          if ($bridge.Length -lt 1000 -or $control.Length -lt 100000 -or $output.Length -lt 50000) { throw 'Extracted payload is truncated' }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($bridge, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ('Embedded bridge PowerShell syntax errors: ' + ($parseErrors | Out-String)) }
          foreach ($marker in @('SAGI432_SIGNATURE_RC3','SAGISignatureCore')) {
            if (-not $control.Contains($marker) -or -not $output.Contains($marker)) { throw "Missing shared package marker: $marker" }
          }
          foreach ($marker in @('mdNextEventIdentity','instantReplayGenerate')) {
            if (-not $control.Contains($marker)) { throw "Control payload missing: $marker" }
          }
          foreach ($marker in @('introStateAllowed','lastRenderedSignatureEventKey')) {
            if (-not $output.Contains($marker)) { throw "Output payload missing: $marker" }
          }
          # Validate that the packaged HTML actually contains the expected live-control and output roots.
          # This is a package integrity gate, not a real vMix hardware certification.
          foreach ($marker in @('id="mdGoalBtn"','id="mdRedBtn"','id="mdYellowBtn"','id="mdSubBtn"')) {
            if (-not $control.Contains($marker)) { throw "Packaged operator control missing: $marker" }
          }
          foreach ($marker in @('id="scoreBug"','id="simplePenaltyBoard"')) {
            if (-not $output.Contains($marker)) { throw "Packaged live output missing: $marker" }
          }
          Write-Host "Windows BAT extraction and embedded PowerShell parser PASS"
      - name: Validate V4.33 package extraction and inherited recovery protections on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'intro/SAGI_VMIX_LAN_V433_PENALTY_RC.bat'
          $source = [IO.File]::ReadAllText((Resolve-Path $path), [Text.Encoding]::UTF8)
          $pattern = '(?s)###SAGI_PS###\r?\n(.*?)\r?\n###SAGI_CONTROL###\r?\n(.*?)\r?\n###SAGI_OUTPUT###\r?\n(.*)$'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'V4.33 embedded BAT payload extraction failed' }
          $bridge = $match.Groups[1].Value
          $control = $match.Groups[2].Value
          $output = $match.Groups[3].Value
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($bridge, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ('V4.33 embedded bridge syntax errors: ' + ($parseErrors | Out-String)) }
          foreach ($marker in @('SAGI433_PENALTY_SSOT_RC1','mdPenaltyCompatView','FIXTURE_TAKEOVER_REQUIRED','STALE_MATCHDAY_REVISION','durableProbe.event = $null','SAGI_MATCH_PROJECTS_V2','activeProjectId')) {
            if (-not $source.Contains($marker)) { throw "V4.33 package missing: $marker" }
          }
          foreach ($marker in @('SAGI433_PENALTY_SSOT_RC1','gfxPenaltyView','penaltyShootout')) {
            if (-not $output.Contains($marker)) { throw "V4.33 output missing: $marker" }
          }
          Write-Host 'Windows V4.33 package extraction / recovery / project SSOT inheritance PASS'
      - name: Validate V4.34 replay-brand package on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'intro/SAGI_VMIX_LAN_V434_REPLAY_BRAND_RC.bat'
          $source = [IO.File]::ReadAllText((Resolve-Path $path), [Text.Encoding]::UTF8)
          $pattern = '(?s)###SAGI_PS###\r?\n(.*?)\r?\n###SAGI_CONTROL###\r?\n(.*?)\r?\n###SAGI_OUTPUT###\r?\n(.*)$'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'V4.34 embedded BAT payload extraction failed' }
          $bridge = $match.Groups[1].Value
          $control = $match.Groups[2].Value
          $output = $match.Groups[3].Value
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($bridge, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ('V4.34 embedded bridge syntax errors: ' + ($parseErrors | Out-String)) }
          foreach ($marker in @('SAGI434_REPLAY_BRAND_RC1','SAGI_MATCH_PROJECTS_V2','activeProjectId','mdLocalMutationDepth','FIXTURE_TAKEOVER_REQUIRED')) {
            if (-not $source.Contains($marker)) { throw "V4.34 package missing: $marker" }
          }
          foreach ($marker in @('data-brand-source="sagi-safe"','setReplayBrandSource','rsCompetition','LIVE PRODUCTION')) {
            if (-not $output.Contains($marker)) { throw "V4.34 replay output missing: $marker" }
          }
          Write-Host 'Windows V4.34 replay-brand package PASS'
      - name: Validate V4.35 humanized-controls package on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'intro/SAGI_VMIX_LAN_V435_HUMANIZED_CONTROLS_RC.bat'
          $source = [IO.File]::ReadAllText((Resolve-Path $path), [Text.Encoding]::UTF8)
          $pattern = '(?s)###SAGI_PS###\r?\n(.*?)\r?\n###SAGI_CONTROL###\r?\n(.*?)\r?\n###SAGI_OUTPUT###\r?\n(.*)$'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'V4.35 embedded BAT payload extraction failed' }
          $bridge = $match.Groups[1].Value
          $control = $match.Groups[2].Value
          $output = $match.Groups[3].Value
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($bridge,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ('V4.35 embedded bridge syntax errors: ' + ($parseErrors | Out-String)) }
          foreach ($marker in @('SAGI435_HUMANIZED_CONTROLS_RC1','SAGI_MATCH_PROJECTS_V2','activeProjectId','mdLocalMutationDepth','mmTakePreview','sagiHumanizedCameraDiagnostic')) {
            if (-not $source.Contains($marker)) { throw "V4.35 package missing: $marker" }
          }
          Write-Host 'Windows V4.35 humanized-controls package PASS'
      - name: Parse field/runtime scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('intro/tests/v432-field-preflight.ps1','intro/tests/v432-bridge-ssot-runtime.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($path + ' parser errors: ' + ($errors | Out-String)) }
          }
          Write-Host 'Windows PowerShell 5.1 field/runtime script syntax PASS'
      - name: Execute field preflight against packaged BAT (offline and no live ports)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'sagi-field-preflight'
          $ps51 = Join-Path $env:SystemRoot 'System32\\WindowsPowerShell\\v1.0\\powershell.exe'
          & $ps51 -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\\intro\\tests\\v432-field-preflight.ps1 -ReportDir $dir
          $code = $LASTEXITCODE
          $reports = @(Get-ChildItem -LiteralPath $dir -Filter '*.json' -ErrorAction SilentlyContinue)
          if ($reports.Count -ne 1) { throw 'Expected one preflight JSON evidence file' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.schema -ne 'SAGI_FIELD_PREFLIGHT_V1') { throw 'Unexpected evidence schema' }
          foreach ($required in @('package-extraction','bridge-powershell-parser','control-payload','output-payload')) {
            $check = @($report.checks | Where-Object { $_.name -eq $required })
            if ($check.Count -ne 1 -or -not $check[0].pass) { throw "Package gate failed: $required" }
          }
          if ($code -notin @(0,1)) { throw "Unexpected preflight exit: $code" }
          Write-Host 'Field preflight package checks and JSON evidence PASS'
          exit 0
      - name: Run V4.32 Bridge restart / SSoT runtime gate on Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\\intro\\tests\\v432-bridge-ssot-runtime.ps1
      - name: Install Playwright Chromium for Windows browser compatibility
        shell: pwsh
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium
      - name: Run full V4.31 broadcast browser regression on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path selftest-artifacts | Out-Null
          node intro/tests/v4270-browser-selftest.mjs
      - name: Upload Windows browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAGI_V432_WINDOWS_BROWSER_REGRESSION_EVIDENCE
          path: selftest-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Run V4.32 portable regression gates on Windows
        shell: pwsh
        run: |
          node intro/tests/v432-signature-core-selftest.mjs
          node intro/tests/v432-event-identity-gate.mjs
          node intro/tests/v432-brand-gate.mjs
          node intro/tests/v432-integration-gate.mjs
          node intro/tests/v433-penalty-single-source-gate.mjs
          node intro/tests/v434-replay-brand-transition-gate.mjs
          node intro/tests/v435-humanized-controls-gate.mjs
          node intro/tests/v432-china-lan-preflight.mjs
