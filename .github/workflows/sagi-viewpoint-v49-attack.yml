name: SAGI VIEWPOINT V4.9 CAMERA FOCUS TIMING POLISH

concurrency:
  group: sagi-viewpoint-v49-attack-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/presets/christmas_tree_attack_viewpoint_v49.json"
      - ".github/workflows/sagi-viewpoint-v49-attack.yml"
      - "cloud-blender-worker/engine/sagi_tactical_execution_director_v45.py"
  workflow_dispatch:

jobs:
  render-viewpoint-v49:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Blender image
        run: docker build -t sagi-viewpoint-v49 ./cloud-blender-worker

      - name: Render V4.9 camera focus timing polish 30fps attack test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewpoint_v49_out
          docker run --rm \
            -v "$PWD/viewpoint_v49_out:/out" \
            sagi-viewpoint-v49 \
            bash -lc '
              blender --background \
                --python /app/engine/sagi_tactical_execution_director_v45.py \
                -- \
                /app/presets/christmas_tree_attack_viewpoint_v49.json \
                /out

              ffmpeg -y -loglevel error \
                -framerate 30 \
                -i /out/frames/frame_%04d.png \
                -f lavfi \
                -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 -profile:v baseline -level 3.1 \
                -pix_fmt yuv420p -preset veryfast -crf 22 \
                -c:a aac -b:a 64k -shortest -movflags +faststart \
                /out/SAGI_VIEWPOINT_V4_9_ATTACK_00_43.mp4

              ffmpeg -y -loglevel error \
                -ss 12 -t 31 \
                -i /out/SAGI_VIEWPOINT_V4_9_ATTACK_00_43.mp4 \
                -c:v libx264 -pix_fmt yuv420p -crf 22 -preset veryfast -c:a aac \
                /out/SAGI_VIEWPOINT_V4_9_ATTACK_12_43.mp4
            '

          sudo chown -R "$USER":"$USER" viewpoint_v49_out
          test -s viewpoint_v49_out/SAGI_VIEWPOINT_V4_9_ATTACK_12_43.mp4
          test -s viewpoint_v49_out/execution_report.json
          test -s viewpoint_v49_out/scene.blend

      - name: Upload V4.9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGI-VIEWPOINT-V4.9-CAMERA-FOCUS-TIMING-POLISH
          path: |
            viewpoint_v49_out/SAGI_VIEWPOINT_V4_9_ATTACK_12_43.mp4
            viewpoint_v49_out/SAGI_VIEWPOINT_V4_9_ATTACK_00_43.mp4
            viewpoint_v49_out/execution_report.json
            viewpoint_v49_out/scene.blend
            cloud-blender-worker/presets/christmas_tree_attack_viewpoint_v49.json
          retention-days: 7
