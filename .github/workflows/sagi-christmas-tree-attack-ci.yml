name: SAGI Christmas Tree Attack CI


concurrency:
  group: sagi-christmas-tree-attack-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "cloud-blender-worker/engine/**"
      - "cloud-blender-worker/presets/christmas_tree_attack_06_30.json"
      - ".github/workflows/sagi-christmas-tree-attack-ci.yml"
  workflow_dispatch:

jobs:
  render-attack-06-30:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sagi-blender-worker:christmas ./cloud-blender-worker

      - name: Start container
        run: |
          docker run -d --name sagi-christmas-ci \
            -p 10000:10000 \
            -e PORT=10000 \
            -e SAGI_API_KEY=test \
            -e SAGI_RENDER_TIMEOUT_SEC=2100 \
            sagi-blender-worker:christmas

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs sagi-christmas-ci
          exit 1

      - name: Render Christmas-tree attack 06-30
        shell: bash
        run: |
          set -euo pipefail

          jq -c '{config:.}' \
            cloud-blender-worker/presets/christmas_tree_attack_06_30.json \
            > christmas_request.json

          START_JSON=$(curl -fsS -X POST \
            http://127.0.0.1:10000/jobs \
            -H "X-API-Key: test" \
            -H "Content-Type: application/json" \
            --data-binary @christmas_request.json)

          echo "$START_JSON" | tee christmas_start.json
          JOB_ID=$(python3 -c 'import json; print(json.load(open("christmas_start.json"))["job_id"])')
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

          for i in $(seq 1 600); do
            STATUS_JSON=$(curl -fsS \
              "http://127.0.0.1:10000/jobs/$JOB_ID" \
              -H "X-API-Key: test")
            echo "$STATUS_JSON" | tee christmas_status.json
            STATUS=$(python3 -c 'import json; print(json.load(open("christmas_status.json"))["status"])')

            if [ "$STATUS" = "done" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              curl -fsS \
                "http://127.0.0.1:10000/jobs/$JOB_ID/log" \
                -H "X-API-Key: test" || true
              exit 1
            fi
            sleep 5
          done

          FINAL_STATUS=$(python3 -c 'import json; print(json.load(open("christmas_status.json"))["status"])')
          test "$FINAL_STATUS" = "done"

          curl -fsSL \
            "http://127.0.0.1:10000/jobs/$JOB_ID/video" \
            -H "X-API-Key: test" \
            -o sagi_christmas_tree_attack_06_30.mp4

          curl -fsSL \
            "http://127.0.0.1:10000/jobs/$JOB_ID/blend" \
            -H "X-API-Key: test" \
            -o sagi_christmas_tree_attack_06_30.blend

          test -s sagi_christmas_tree_attack_06_30.mp4
          test -s sagi_christmas_tree_attack_06_30.blend

          docker exec sagi-christmas-ci ffprobe -v error \
            -show_entries format=duration:stream=codec_name,width,height,r_frame_rate \
            -of json "/tmp/sagi_jobs/$JOB_ID/render.mp4" \
            | tee christmas_probe.json

      - name: Upload Christmas-tree artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sagi-christmas-tree-attack-06-30
          path: |
            sagi_christmas_tree_attack_06_30.mp4
            sagi_christmas_tree_attack_06_30.blend
            christmas_probe.json
            christmas_status.json
          retention-days: 7

      - name: Container logs
        if: always()
        run: docker logs sagi-christmas-ci || true
